KG7, PRF1) were NOT differentially expressed between fistula\n   locations.\n\n================================================================================\n"}, "semantic": {"executive_summary_x": {"bullets": ["Enterocutaneous fistulas show highest myeloid/neutrophilic inflammation", "Peri-anal fistulas are distinctly lymphoid/B-cell dominant (2.7x higher)", "Internal fistulas show mixed myeloid-lymphoid inflammation", "Non-fistulising CD has lowest overall inflammatory signatures", "Proposes fistula-type-specific therapeutic targets based on immune profiles"]}, "executive_summary_y": {"bullets": ["Perianal fistulas are myeloid and plasma-cell enriched (statistically significant)", "Internal fistulas are lymphoid-dominant with higher T-cell/B-cell proportions", "Myeloid/lymphoid ratio varies by fistula type as potential biomarker", "5100-plex Xenium data independently confirms myeloid enrichment in fistula", "Cytotoxic markers show no significant difference between fistula locations"]}, "shared_points": [{"topic": "Fistulising disease has higher inflammation than non-fistulising", "x_text": "Fistulising disease shows markedly elevated myeloid signatures (~1.7x higher than non-fistulising CD)", "y_text": "Not-fistulising tissue has lowest myeloid+plasma proportion (20.68%) vs all fistula types (25-35%)"}, {"topic": "Internal fistulas have higher lymphoid/adaptive immune signature", "x_text": "Internal fistulas show mixed myeloid-lymphoid inflammation with high CD14+ monocyte infiltration", "y_text": "Internal fistulas are lymphoid-dominant with highest T-cell (12.79%) and B-cell (12.37%) proportions"}, {"topic": "Differential gene expression identifies location-specific markers", "x_text": "Enterocutaneous markers: SOCS3, CXCL8, CXCL5; Peri-anal markers: STAT1, THBS1, S100A4, PIGR", "y_text": "Perianal upregulated: THBS1, EGR1, C7, CXCL2, FCGR3B; Internal upregulated: CD79A, CD27, MZB1, WNT5A"}, {"topic": "Myeloid markers elevated in external/enterocutaneous fist  for enterocutaneous fistulas, indicating JAK/STAT pathway regulation specific to that location"}, {"topic": "Inflammatory gradient ranking across all types", "text": "X proposes an inflammatory gradient: NON-FISTULISING < DIVERTICULAR < ENTEROCUTANEOUS ~ INTERNAL < PERI-ANAL"}, {"topic": "Cluster proportion analysis showing unique cellular neighborhoods", "text": "X identifies specific cell clusters strongly enhanced in peri-anal fistulas (Cluster 14 at 13.9% vs 0.1-1.7% elsewhere)"}, {"topic": "Innate immunity compartment analyzed separately", "text": "X separately quantifies innate immunity markers showing enterocutaneous highest (35,057) and non-fistulising lowest (22,584)"}], "unique_y": [{"topic": "Perianal fistulas characterized as myeloid and plasma-cell enriched", "text": "Y claims perianal fistulas have HIGHEST myeloid (10.33%) plus dramatically elevated plasma cells (24.18%), yielding combined myeloid+plasma of 34.51% -- opposite conclusion to X for perianal"}, {"topic": "Statistical significance with chi-square tests", "text": "Y provides formal statistical testing: chi-square = 40839.06, p < 2.2e-16 for myeloid-like vs fistula type; and chi-square = 29703.54 for myeloid-like vs location"}, {"topic": "Myeloid/lymphoid ratio as quantitative biomarker", "text": "Y explicitly calculates ML ratios (0.48 to 0.72) and proposes this metric as a quantitative biomarker for fistula type classification and severity"}, {"topic": "Cross-platform validation with 5100-plex Xenium", "text": "Y independently validates findings using 5100-plex Xenium data showing fistula tissue is myeloid-dominant (ML ratio 1.622) vs HC lymphoid-dominant (0.814)"}, {"topic": "No cytotoxic signature difference between locations", "text": "Y explicitly states that cytotoxic markers (GZMB, NKG7, PRF1) were NOT differentially expressed between fistula locations despite myeloid/lymphoid differences"}, {"topic": "Plasma cells grouped with myeloid compartment", "text": "Y groups plasma cells with myeloid cells into a combined myeloid-like signature, dramatically changing proportional conclusions compared to treating them as lymphoid-derived"}, {"topic": "Chronic inflammatory signature interpretation for perianal", "text": "Y interprets perianal myeloid+plasma enrichment as chronic persistent inflammation explaining clinical refractoriness to treatment"}, {"topic": "Complete cell type proportion table across all fistula types", "text": "Y provides comprehensive proportions for 14 cell types across all fistula categories and anatomical locations, including non-immune populations (goblets, stem cells, enterocytes)"}, {"topic": "Lymphatic endothelial cell enrichment in perianal", "text": "Y identifies elevated lymphatic proportions specifically in perianal fistulas (5.12% vs 2.12-2.99% elsewhere), a distinct vascular finding"}]}, "neutral_summary": {"X": "BIOLOGICAL FINDINGS SUMMARY\n\nAnalysis of 6.3 million cells from 480-plex spatial transcriptomics and 1.9 million cells from 5100-plex data demonstrates that fistula location profoundly shapes the inflammatory microenvironment in Crohn's disease, with statistically significant differences (Chi-square=40839.06, p<2.2e-16) in immune cell composition across fistula types.\n\nKey Findings:\n\n- Perianal fistulas have the highest combined myeloid+plasma cell proportion (34.51%) compared to internal fistulas (27.00%), external fistulas (25.90%), and non-fistulising tissue (20.68%)\n- Perianal fistulas show elevated plasma cells (24.18%) compared to internal (19.49%) and external (14.94%) fistulas\n- Internal fistulas are the most lymphoid-dominant: T-cells at 12.79% (highest) and B-cells at 12.37% (highest)\n- External (enterocutaneous) fistulas show the lowest T-cell proportion (8.01%) among fistula types\n- The myeloid/lymphoid ratio ranges from 0.480 (not fistulising) to 0.721 (external fistulas), with perianal at 0.695\n- In the 5100-plex validation dataset, fistula tissue shows a myeloid/lymphoid ratio of 1.622 versus 0.814 in healthy controls\n- Myeloid markers upregulated in perianal vs internal: CXCL2 (log2FC=1.84), FCGR3A (log2FC=1.20), CD14 (log2FC=0.87), MMP9 (log2FC=0.59)\n- Lymphoid markers upregulated in internal vs perianal: CD27 (log2FC=1.48), CD79A (log2FC=1.25), CD3D (log2FC=0.50)\n- Cytotoxic markers (GZMB, NKG7, PRF1) show no significant difference between fistula locations\n- Perianal lymphatic infiltration is 2.4x higher than diverticular (5.12% vs 2.12%)\n\nBiological Interpretation:\n\nThe data reveal that perianal fistulas harbor a fundamentally different immunological environment compared to internal fistulas. The perianal myeloid dominance (macrophages, dendritic cells) combined with elevated plasma cell infiltration creates a \"chronic inflammatory\" signature that aligns with the clinical observation that perianal fistulas are typically more refractory to treatment and require more aggressive management.\n\nInternal fistulas, by contrast, exhibit a lymphoid-dominant profile with higher T-cell and B-cell proportions, suggesting a different immunopathogenic mechanism that may be more amenable to adaptive immunity-targeted therapies. The absence of cytotoxic signature differences between locations indicates that fistula location selectively affects the innate immune composition rather than the cytotoxic capacity of resident lymphoid cells.\n\nThe consistency of these findings across both the 480-plex and 5100-plex platforms strengthens the conclusion that anatomical site is a major determinant of inflammatory phenotype in fistulizing Crohn's disease, with implications for location-tailored therapeutic strategies.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nAnalysis of 6.3 million cells from spatial transcriptomics data (250,000 subsampled: 50,000 per fistula type) reveals a clear inflammatory signature gradient across fistula locations, with each location exhibiting a distinct immunological profile characterized by different ratios of myeloid, lymphoid, and cytotoxic markers.\n\nKey Findings:\n\n- Enterocutaneous fistulas show the highest myeloid inflammatory signature (average expression 31,280) compared to non-fistulising CD (18,635), representing a 1.7x elevation\n- Peri-anal fistulas show the highest lymphoid signature (14,233), which is 2.7x higher than diverticular disease (4,673)\n- CD79A (B-cell marker) is dramatically elevated in peri-anal fistulas (44,316) - approximately 4x higher than other fistula groups\n- Peri-anal fistulas show the highest cytotoxic/NK cell signature (2,979 vs 1,318 in diverticular)\n- MMP9 expression is highest in enterocutaneous (15,625) and internal (11,757) fistulas\n- Top differentially expressed genes by location: Enterocutaneous (SOCS3, CXCL8, CXCL5, EGR1, MMP1); Peri-anal (STAT1, THBS1, S100A4, PIGR, CXCL14); Internal (SOCS3, MMP1, CXCL5, CXCL8, S100A4)\n- Peri-anal fistulas show unique cluster enrichment: Cluster 14 at 13.9% (vs 0.1% in other locations)\n- CD4 (helper T cells) is highest in peri-anal (12,074) versus internal (8,311) and enterocutaneous (7,163)\n- CD3D (pan-T cell): highest in peri-anal (11,366)\n\nBiological Interpretation:\n\nThe inflammatory signature varies systematically by fistula location, revealing fundamentally different immune mechanisms at each anatomical site. Enterocutaneous fistulas are characterized by a neutrophilic/myeloid-dominant inflammation driven by strong CXCL8 and CXCL5 expression, which actively recruits neutrophils to the fistula site. The high MMP9 levels indicate aggressive tissue degradation and remodeling at these sites.\n\nPeri-anal fistulas, in contrast, exhibit a lymphoid/cytotoxic-dominant profile with dramatically elevated B-cell markers and a STAT1-driven interferon response. The 4-fold elevation of CD79A and the strong CD4+ T-cell presence suggest organized adaptive immune engagement, possibly reflecting the unique microbial environment and mucosal immune architecture of the perianal region. The PIGR elevation further indicates active mucosal immune activation with transcytosis of immunoglobulins.\n\nInternal fistulas occupy an intermediate position with mixed myeloid-lymphoid inflammation, sharing neutrophil recruitment features with enterocutaneous fistulas while maintaining moderate lymphoid involvement. Non-fistulising CD represents the lowest inflammatory state, while diverticular disease shows a metabolic/stress-dominant profile characterized by THBS1 and FKBP5 rather than classic inflammatory signatures."}}, {"id": "Q7", "type": "comparison", "text": "How does the epithelialisation of fistula affect other cells?", "responses": {"X": "================================================================================\nRESEARCH QUESTION: How does the epithelialisation of fistula affect other cells?\n================================================================================\n\nEXECUTIVE SUMMARY\n\nSpatial transcriptomics analysis of Crohn's disease fistula tissue reveals that\nepithelialisation (transition from columnar to squamous epithelium) is associated\nwith elevated fibrotic and inflammatory signatures in the surrounding tissue.\nFistula tissue shows significantly higher fibrotic and inflammatory scores compared\nto healthy and non-fistulising ulcerated tissue. Stromal cells, particularly\nmyofibroblasts and stromal subsets, exhibit the highest fibrotic-to-inflammatory\nratios, suggesting a dominant fibrotic program in fistulising disease.\n\n================================================================================\nKEY FINDINGS\n================================================================================\n\n1. FISTULA TISSUE SHOWS ELEVATED FIBROTIC AND INFLAMMATORY SCORES\n-----------------------------------------------------------------\n\nXenium 5100-plex analysis (1.86M cells, 5100 genes):\n\n| Tissue Type | N Cells | Mean Fibrotic Score | Mean Inflammatory Score |\n|-------------|---------|---------------------|------------------------|\n| FISTULA | 389,050 | 1.95e-05 | 9.30e-06 |\n| HC (Healthy) | 459,745 | 1.61e-05 | 4.19e-06 |\n| ULCER | 1,011,573 | 1.41e-05 | 4.35e-06 |\n\n- FISTULA tissue has 21% higher fibrotic scores than HC and 39% higher than ULCER\n- FISTULA tissue has 122% higher inflammatory scores than HC and 114% higher than ULCER\n- Statistical significance: p < 0.001 (Mann-Whitney U test)\n\n2. SQUAMOUS EPITHELIUM IS ASSOCIATED WITH HIGHEST FIBROTIC/INFLAMMATORY SCORES\n-------------------------------------------------------------------------------\n\nXenium 480-plex analysis (6.33M cells, 471 genes):\n\n| EPI_STATUS | N Cells | Mean Fibrotic Score | Mean Inflammatory Score |\n|------------|---------|---------------------|------------------------|\n| SQUAMOUS | 501,894 | 4.78e-05 | 3.75e-05 |\n| Non-Epi | 1,913,689 | 3.67e-05 | 3.22e-05 |\n| SQUAMOUS & COLUMNAR | 395,465 | 3.62e-05 | 3.10e-05 |\n| COLUMNAR | 3,523,556 | 3.20e-05 | 2.36e-05 |\n\n- SQUAMOUS epithelium shows 49% higher fibrotic scores than COLUMNAR epithelium\n- SQUAMOUS epithelium shows 59% higher inflammatory scores than COLUMNAR epithelium\n\n3. CELL TYPE-SPECIFIC FIBROTIC/INFLAMMATORY RATIOS\n---------------------------------------------------\n\nFrom scRNA-seq reference (24,094 cells, 32 cell types):\n\n| Cell Type | Fibrotic Score | Inflammatory Score | Fib/Inf Ratio |\n|-----------|---------------|-------------------|---------------|\n| Myofibroblasts | 1.13 | 0.63 | 1.80 |\n| Stromal 3+4 | 1.37 | 0.96 | 1.43 |\n| Stromal 2 | 1.06 | 0.75 | 1.42 |\n| IL11+ | 1.31 | 0.96 | 1.36 |\n| Stromal 3 (2) | 1.02 | 0.77 | 1.31 |\n| Stromal 3 (1) | 1.14 | 0.87 | 1.31 |\n| Stromal 1 | 1.10 | 0.92 | 1.19 |\n| Pericytes | 0.89 | 0.82 | 1.09 |\n| Myeloid | 0.20 | 1.02 | 0.20 |\n| T-cells | 0.09 | 0.57 | 0.16 |\n| B-cells | 0.06 | 0.50 | 0.12 |\n\n- Myofibroblasts have the highest fibrotic/inflammatory ratio (1.80)\n- Stromal subsets (Stromal 1-4) show ratios >1.0, indicating fibrotic dominance\n- Immune cells (Myeloid, T-cells, B-cells) show ratios <0.2, indicating inflammatory dominance\n\n4. LOCATION-SPECIFIC DIFFERENCES\n---------------------------------\n\nXenium 5100-plex by tissue location:\n\n| Location | N Cells | Mean Fibrotic Score | Mean Inflammatory Score |\n|----------|---------|---------------------|------------------------|\n| COLON | 428,538 | 1.79e-05 | 4.85e-06 |\n| ILEUM | 1,431,830 | 1.50e-05 | 5.50e-06 |\n\n- COLON shows 19% higher fibrotic scores than ILEUM\n- ILEUM shows 13% higher inflammatory scores than COLON\n\n================================================================================\nINTERPRETATION\n================================================================================\n\n1. Epithelial-mesenchymal cross-talk: The transition from columnar to squamous\n   epithelium is associated with increased fibrotic and inflammatory activity in\n   the surrounding stroma. Squamous epithelial cells secrete factors that activate\n   stromal fibroblasts.\n\n2. Myofibroblast activation: Myofibroblasts are the primary drivers of fibrosis\n   in fistula tissue (highest fibrotic/inflammatory ratio of 1.80). They respond\n   to epithelial-derived signals (TGF-beta, CTGF) to produce extracellular matrix.\n\n3. Chronic inflammation: Fistula tissue shows 2-3x higher inflammatory scores\n   compared to healthy tissue, consistent with chronic inflammatory nature of\n   Crohn's disease fistulising disease.\n\n4. Location-dependent effects: COLON tissue shows higher fibrotic scores than\n   ILEUM, reflecting differences in tissue architecture and immune composition.\n\n================================================================================\nCLINICAL IMPLICATIONS\n================================================================================\n\n1. Biomarker potential: Fibrotic and inflammatory scores could serve as quantitative\n   biomarkers for fistulising disease severity.\n\n2. Therapeutic targets: The high fibrotic/inflammatory ratio in myofibroblasts\n   suggests targeting fibrotic pathways (TGF-beta, CTGF) in stromal cells could\n   prevent fistula formation.\n\n3. Epithelialisation as a disease marker: Squamous epithelium in fistula tissue is\n   associated with heightened tissue remodeling activity, suggesting it may be a\n   marker of advanced disease.\n\n================================================================================\n", "Y": "================================================================================\nANSWER: How does the epithelialisation of fistula affect other cells?\n================================================================================\n\nEXECUTIVE SUMMARY\n\nAnalysis of Xenium 5100-plex (1,860,368 cells) and 480-plex (6,334,604 cells)\nspatial transcriptomics data from Crohn's disease fistula samples reveals that\nfistula epithelialisation drives a coordinated multi-cellular response involving\nmassive immune activation, stromal fibrosis, epithelial transformation, and\nemergence of a novel IL11+ cell population.\n\n================================================================================\nKEY FINDINGS\n================================================================================\n\nFINDING 1: MASSIVE IMMUNE ACTIVATION IN FISTULA TISSUE\n------------------------------------------------------\n\nCell Type Proportion Changes (FISTULA vs HC):\n  Myeloid:      7.24% (HC)  ->  24.10% (FISTULA)   [log2FC = +1.74, p < 1e-300]\n  Neutrophils:  0.15% (HC)  ->  4.87% (FISTULA)    [log2FC = +5.00, p < 1e-300]\n  Plasma cells: 5.45% (HC)  ->  10.31% (FISTULA)   [log2FC = +0.92, p < 1e-300]\n  B-cells:      1.53% (HC)  ->  1.76% (FISTULA)    [log2FC = +0.21, p < 1e-17]\n\nDifferential Expression in Immune Cells (FISTULA vs HC):\n  - IL1B:   log2FC = +6.99  (4.0% -> 13.2% of cells)\n  - CXCL8:  log2FC = +8.14  (0.3% -> 14.6% of cells)\n  - SPP1:   log2FC = +9.14  (0.3% -> 19.8% of cells)\n  - PLAUR:  log2FC = +5.10  (2.2% -> 23.7% of cells)\n  - MMP9:   log2FC = +3.14  (myeloid-specific)\n  - FCGR2A: log2FC = +2.97  (7.5% -> 22.6% of cells)\n\nInterpretation: Profound innate immune response with neutrophil infiltration and\nmacrophage activation. IL-1beta and CXCL8 indicate active NLRP3 inflammasome\nsignaling and neutrophil chemotaxis. SPP1 (osteopontin) is associated with chronic\ninflammation and tissue remodeling.\n\nFINDING 2: STROMAL CELLS BECOME HIGHLY FIBROTIC AND PRO-REMODELING\n------------------------------------------------------------------\n\nCell Type Proportion Changes:\n  Stromal 3 + 4:   0.26% (HC)  ->  1.97% (FISTULA)   [log2FC = +2.89]\n\nDifferential Expression in Stromal Cells (FISTULA vs HC):\n  - SERPINE1: log2FC = +4.42  (1.2% -> 10.4%) - PAI-1, pro-fibrotic\n  - GREM1:    log2FC = +3.98  (11.1% -> 48.4%) - BMP antagonist, pro-fibrotic\n  - THY1:     log2FC = +2.79  (14.2% -> 38.9%) - activated fibroblast marker\n  - THBS1:    log2FC = +2.82  (20.3% -> 41.1%) - thrombospondin-1, pro-fibrotic\n  - COL5A1:   log2FC = +1.32  (36.8% -> 41.3%) - type V collagen\n  - COL5A2:   log2FC = +1.67  (23.0% -> 31.2%) - type V collagen\n  - MMP2:     log2FC = +1.29  (49.6% -> 51.5%) - matrix remodeling\n  - FGF7:     log2FC = +2.25  (3.7% -> 9.1%) - keratinocyte growth factor\n  - PTGS2:    log2FC = +2.63  (2.3% -> 7.5%) - COX-2, inflammatory\n  - TNC:      log2FC = +7.07  (ectopic in FISTULA) - tenascin-C, fibrosis marker\n\nInterpretation: Stromal cells adopt a highly activated, pro-fibrotic phenotype:\n1. Enhanced ECM deposition (COL5A1/2, TNC, THBS1)\n2. BMP antagonism (GREM1) promoting fibroblast activation\n3. Matrix remodeling (MMP2, SERPINE1)\n4. Inflammatory signaling (PTGS2/COX-2)\n5. Keratinocyte growth factor production (FGF7) driving epithelial changes\n\nFINDING 3: EPITHELIAL CELLS SHOW FIBROTIC/EMT-LIKE TRANSFORMATION\n-----------------------------------------------------------------\n\nDifferential Expression in Epithelial Cells (FISTULA vs HC):\n  Upregulated:\n  - COL5A2: log2FC = +8.12  (0.5% -> 37.1%)\n  - COL5A1: log2FC = +7.79  (0.7% -> 43.3%)\n  - THY1:   log2FC = +7.82  (0.3% -> 33.0%)\n  - MMP2:   log2FC = +7.49  (1.5% -> 42.1%)\n  - TNC:    log2FC = +7.07  (0.6% -> 29.1%)\n  - COL4A1: log2FC = +6.68  (1.0% -> 28.8%)\n  - SERPINE1: log2FC = +5.01 (2.4% -> 32.3%)\n\n  Downregulated:\n  - KRT20:  log2FC = -3.14  (39.6% -> 3.8%) - enterocyte differentiation marker\n  - ANPEP:  log2FC = -2.83  (60.8% -> 24.1%) - brush border enzyme\n  - MAOA:   log2FC = -2.62  (41.2% -> 4.6%) - enterocyte marker\n\nCell Type Proportion Changes:\n  Enterocytes:  11.05% (HC)  ->  0.10% (FISTULA)   [log2FC = -6.75]\n  Goblets:      12.14% (HC)  ->  1.94% (FISTULA)   [log2FC = -2.65]\n  BEST4:         2.18% (HC)  ->  0.31% (FISTULA)   [log2FC = -2.83]\n  Stem/Undiff:   3.25% (HC)  ->  0.87% (FISTULA)   [log2FC = -1.91]\n  TAs:           7.50% (HC)  ->  1.87% (FISTULA)   [log2FC = -2.00]\n\nInterpretation: Loss of differentiated enterocytes and goblet cells with\nupregulation of fibrotic/ECM genes IN epithelial cells themselves, suggesting\nEMT-like transformation.\n\nFINDING 4: IL11+ CELLS EMERGE AS A DISTINCT FISTULA-ASSOCIATED POPULATION\n-------------------------------------------------------------------------\n\n  IL11+ cells:  0.08% (HC)  ->  8.58% (FISTULA)   [log2FC = +6.78]\n\nThis population is virtually absent in healthy colon but represents nearly 9%\nof all cells in fistula tissue. IL11 is a known pro-fibrotic cytokine that\nactivates STAT3 signaling and promotes fibroblast activation and ECM deposition.\n\nFINDING 5: VALIDATION IN 480-PLEX DATA (EPI_STATUS ANALYSIS)\n------------------------------------------------------------\n\nCell Type Proportions by EPI_STATUS:\n  Cell Type          COLUMNAR    SQUAMOUS    Non-Epi\n  ---------------------------------------------------------\n  Myeloid            5.27%       11.65%      10.01%\n  Plasma             17.98%      23.81%      19.93%\n  Stromal 1           5.55%       3.66%       1.79%\n  IL11+               3.52%       6.20%       9.87%\n\n- Plasma cells enriched in SQUAMOUS areas (chronic inflammation)\n- IL11+ cells enriched in Non-Epi areas (fibrotic fistula tract environment)\n\nFINDING 6: ENDOTHELIAL ACTIVATION\n---------------------------------\n  Endothelium:  3.52% (HC)  ->  5.20% (FISTULA)   [log2FC = +0.56]\n  Suggests angiogenesis accompanies fistula formation.\n\n================================================================================\nSUMMARY: THE FISTULA EPITHELIALISATION CASCADE\n================================================================================\n\n1. IMMUNE PHASE: Massive neutrophil and myeloid infiltration drives inflammatory\n   signaling (IL1B, CXCL8) that recruits more immune cells and activates stromal\n   fibroblasts.\n\n2. FIBROTIC PHASE: Stromal cells (particularly Stromal 3+4) become activated,\n   upregulating ECM genes (COL5A1/2, TNC), BMP antagonists (GREM1), and\n   pro-fibrotic factors (SERPINE1, THBS1, THY1).\n\n3. EPITHELIAL TRANSFORMATION: Native colonic epithelium (enterocytes, goblet cells)\n   is replaced by squamous epithelium. Epithelial cells themselves upregulate\n   fibrotic/EMT genes (COL5A1, TNC, MMP2), suggesting partial EMT.\n\n4. IL11+ CELL EXPANSION: A novel pro-fibrotic IL11+ population emerges\n   (0.08% -> 8.58%).\n\n5. FEEDBACK LOOP: FGF7 from stromal cells drives epithelial changes, while\n   epithelial-derived signals further activate stromal fibrosis.\n\n================================================================================\nTHERAPEUTIC IMPLICATIONS\n================================================================================\n\n1. IL-1beta inhibition - blocks neutrophil recruitment and inflammatory signaling\n2. CXCL8/CXCR2 axis inhibition - reduces neutrophil infiltration\n3. IL-11 signaling blockade - targets the novel IL11+ cell population\n4. TGF-beta pathway modulation - addresses stromal fibrosis\n5. GREM1/BMP pathway - targets pro-fibrotic signaling\n6. COX-2/PTGS2 inhibitors - reduces inflammatory prostaglandin production\n\n================================================================================\n"}, "semantic": {"executive_summary_x": {"bullets": ["Fistula tissue has 21-39% higher fibrotic and 114-122% higher inflammatory scores", "Squamous epithelium associated with 49-59% higher fibrotic/inflammatory scores than columnar", "Myofibroblasts show highest fibrotic-to-inflammatory ratio (1.80) among cell types", "Colon shows higher fibrotic scores; ileum shows higher inflammatory scores", "Quantitative scoring approach comparing tissue types and cell types"]}, "executive_summary_y": {"bullets": ["Epithelialisation drives coordinated immune activation, stromal fibrosis, and epithelial transformation", "Massive immune infiltration: neutrophils 32x, myeloid 3.3x increase in fistula", "Epithelial cells undergo EMT-like transformation with loss of differentiated enterocytes/goblets", "Novel IL11+ population expands from 0.08% to 8.58% in fistula tissue", "Proposes mechanistic cascade: immune phase, fibrotic phase, epithelial transformation, IL11+ expansion"]}, "shared_points": [{"topic": "Fistula tissue has elevated fibrotic and inflammatory signatures", "x_text": "Quantifies fibrotic scores 21-39% higher and inflammatory scores 114-122% higher in fistula vs HC/ulcer", "y_text": "Shows massive upregulation of fibrotic genes (TNC, COL5A1/2, SERPINE1) and inflammatory genes (IL1B, CXCL8) in fistula"}, {"topic": "Squamous epithelium is associated with greater tissue remodeling than columnar", "x_text": "Squamous areas show 49% higher fibrotic and 59% higher inflammatory scores vs columnar", "y_text": "Validates in 480-plex data showing plasma cells and IL11+ enriched in squamous/non-epi regions"}, {"topic": "Stromal cells are primary drivers of fibrosis in fistula", "x_text": "Stromal subsets show fibrotic/inflammatory ratios >1.0 indicating fibrotic dominance; myofibroblasts highest at 1.80", "y_text": "Stromal 3+4 expand 7.6-fold in fistula and upregulate ECM genes (COL5A1/2, TNC, THBS1, GREM1, SERPINE1)"}, {"topic": "Myofibroblasts are key effectors of fistula-associated fibrosis", "x_text": "Myofibroblasts have highest fibrotic/inflammatory ratio (1.80), respond to epithelial-derived TGF-beta/CTGF", "y_text": "Stromal cells adopt activated pro-fibrotic phenotype with enhanced ECM deposition and BMP antagonism"}, {"topic": "TGF-beta pathway as therapeutic target", "x_text": "Targeting fibrotic pathways (TGF-beta, CTGF) in stromal cells could prevent fistula formation", "y_text": "TGF-beta pathway modulation listed as key therapeutic approach to address stromal fibrosis"}, {"topic": "Epithelial-mesenchymal crosstalk drives remodeling", "x_text": "Columnar-to-squamous transition associated with increased fibrotic/inflammatory activity in surrounding stroma; squamous cells secrete factors activating fibroblasts", "y_text": "Epithelial cells themselves upregulate fibrotic/EMT genes (COL5A1, TNC, MMP2); FGF7 from stroma drives epithelial changes in feedback loop"}], "unique_x": [{"topic": "Quantitative fibrotic-to-inflammatory ratio scoring across cell types", "text": "Provides systematic scoring of fibrotic vs inflammatory dominance per cell type, revealing immune cells (T/B/myeloid) have ratios <0.2 while stromal cells >1.0"}, {"topic": "Location-specific differences between colon and ileum", "text": "Colon shows 19% higher fibrotic scores than ileum; ileum shows 13% higher inflammatory scores, reflecting tissue architecture differences"}, {"topic": "Fibrotic/inflammatory scores as quantitative disease biomarkers", "text": "Proposes composite fibrotic and inflammatory scores could serve as quantitative biomarkers for fistulising disease severity"}], "unique_y": [{"topic": "Massive neutrophil and myeloid immune infiltration quantified", "text": "Neutrophils increase 32-fold (0.15% to 4.87%) and myeloid cells 3.3-fold (7.24% to 24.10%) in fistula, with specific upregulation of IL1B, CXCL8, SPP1, MMP9"}, {"topic": "Loss of differentiated epithelial cell types", "text": "Enterocytes decrease from 11.05% to 0.10% (107-fold reduction), goblet cells from 12.14% to 1.94%, indicating loss of normal epithelial differentiation"}, {"topic": "Epithelial cells undergo EMT-like transformation", "text": "Epithelial cells upregulate mesenchymal/fibrotic markers (COL5A2 log2FC=+8.12, THY1 log2FC=+7.82, MMP2 log2FC=+7.49) while losing differentiation markers (KRT20, ANPEP)"}, {"topic": "IL11+ cells emerge as novel fistula-associated population", "text": "IL11+ cells expand from 0.08% to 8.58% in fistula (107-fold); IL11 is a pro-fibrotic cytokine that activates STAT3 signaling and fibroblast activation"}, {"topic": "FGF7 stromal-epithelial feedback loop", "text": "Stromal cells produce FGF7 (keratinocyte growth factor, log2FC=+2.25) which drives epithelial changes, while epithelial-derived signals further activate stromal fibrosis"}, {"topic": "Endothelial activation and angiogenesis", "text": "Endothelium expands from 3.52% to 5.20% in fistula, suggesting angiogenesis accompanies fistula formation"}, {"topic": "Multi-phase mechanistic cascade model", "text": "Proposes sequential model: immune phase (neutrophil/myeloid infiltration) -> fibrotic phase (stromal activation) -> epithelial transformation (EMT) -> IL11+ expansion -> feedback loop"}, {"topic": "Specific anti-inflammatory therapeutic targets", "text": "Proposes IL-1beta inhibition, CXCL8/CXCR2 axis blockade, IL-11 signaling inhibition, and COX-2/PTGS2 inhibitors as targeted interventions"}]}, "neutral_summary": {"X": "BIOLOGICAL FINDINGS SUMMARY\n\nSpatial transcriptomics analysis of Crohn's disease fistula tissue across two platforms (5100-plex: 1.86M cells; 480-plex: 6.33M cells) and a single-cell RNA-seq reference (24,094 cells, 32 cell types) demonstrates that epithelialisation of fistula tracts is strongly associated with elevated fibrotic and inflammatory activity in surrounding tissue, with myofibroblasts acting as the primary drivers of the fibrotic response.\n\nKey Findings:\n\n- Fistula tissue has 21% higher fibrotic scores and 122% higher inflammatory scores compared to healthy controls (p<0.001, Mann-Whitney U)\n- Fistula tissue has 39% higher fibrotic scores and 114% higher inflammatory scores compared to ulcerated tissue\n- Squamous epithelium shows 49% higher fibrotic scores and 59% higher inflammatory scores than columnar epithelium\n- Myofibroblasts exhibit the highest fibrotic-to-inflammatory ratio (1.80), followed by Stromal 3+4 (1.43), Stromal 2 (1.42), and IL11+ cells (1.36)\n- All stromal subsets show fibrotic/inflammatory ratios >1.0 (fibrotic dominance)\n- All immune cells show ratios <0.2 (inflammatory dominance): Myeloid (0.20), T-cells (0.16), B-cells (0.12)\n- Colon tissue shows 19% higher fibrotic scores than ileum\n- Ileum shows 13% higher inflammatory scores than colon\n- Non-epithelial tissue also shows elevated scores (fibrotic: 3.67e-05; inflammatory: 3.22e-05), consistent with stromal involvement\n\nBiological Interpretation:\n\nThe transition from columnar to squamous epithelium during fistula formation fundamentally alters the signaling environment within the tissue. Squamous epithelium, which lines the fistula tract, creates a microenvironment that promotes both fibrosis and inflammation in surrounding cells, but with a critical distinction: stromal cells respond primarily with fibrotic programs while immune cells respond primarily with inflammatory programs.\n\nMyofibroblasts emerge as the most important effector cell in this process, with a fibrotic score nearly twice their inflammatory score (ratio 1.80). These cells likely respond to epithelial-derived signals such as TGF-beta and CTGF to produce extracellular matrix components that form and maintain the structural integrity of the fistula tract. The IL11+ cell population (ratio 1.36) represents another important pro-fibrotic population that may serve as an intermediate between the epithelial signal and myofibroblast activation.\n\nThe location-dependent difference (colon more fibrotic, ileum more inflammatory) suggests that tissue-intrinsic properties modulate the response to epithelialisation, potentially reflecting differences in the resident stromal cell populations or the density of immune cell aggregates at each anatomical site.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nIn Crohn's Disease, epithelialization of the fistula tract does not represent healing but rather sustains and amplifies a chronic inflammatory and fibrotic niche. The epithelial cells lining fistula tracts function as an active secretory hub, releasing chemokines and cytokines that recruit and activate both fibroblasts (driving fibrosis) and immune cells (maintaining inflammation), creating a self-perpetuating pathological microenvironment.\n\nKey Findings:\n\n- Fistula-associated epithelial cells exhibit enteric metaplasia with activation markers (REG3A, REG3B, S100A8/A9) and Wnt/Notch dysregulation (AXIN2, MYC, HES1)\n- Epithelial CXCL8 (IL-8) secretion drives neutrophil recruitment, with spatial co-localization of CXCL8-positive epithelial cells and S100A8/A9-positive neutrophils in adjacent stroma\n- TGF-beta1 from epithelial cells is the master regulator activating fibroblasts into alpha-SMA-positive myofibroblasts\n- PDGFA/B secretion from epithelial cells recruits fibroblast progenitors and stimulates proliferation\n- Pro-fibrotic fibroblasts upregulate ACTA2, TAGLN, COL1A1, COL3A1, FAP with a spatial gradient increasing from epithelial layer into deeper stroma\n- Inflammatory fibroblasts produce CXCL12, CXCL14, IL6, PTGS2 (COX-2) to recruit additional immune cells\n- Macrophage polarization: M1-like (IL1B, TNF) and M2-like (CD163, TGFB1) co-exist; epithelial-derived CSF2 and IL-1beta drive polarization; M2 macrophages produce TGF-beta feeding back into fibrosis\n- IL-23/IL-17 vicious cycle: epithelial IL-23 drives Th17 differentiation, Th17-derived IL-17 stimulates more epithelial CXCL8 and IL-6\n- TNF-alpha from macrophages and T-cells activates NF-kappaB in both epithelial and stromal cells\n\nBiological Interpretation:\n\nThe epithelialized fistula tract creates a three-way pathological interaction between epithelial, stromal, and immune compartments. Epithelial cells secrete profibrotic factors (TGF-beta1, PDGF) that activate fibroblasts along a spatial gradient, with the most intensely activated myofibroblasts nearest to the epithelial layer. Simultaneously, epithelial chemokines (CXCL8, CCL20) recruit neutrophils and Th17 cells, which in turn produce cytokines that stimulate further epithelial activation.\n\nThe IL-23/IL-17/CXCL8 positive feedback loop is particularly damaging: epithelial IL-23 drives Th17 differentiation, Th17-derived IL-17 stimulates epithelial CXCL8 and IL-6 production, and these chemokines recruit more neutrophils that cause tissue damage, perpetuating the cycle. M2 macrophages add another feedback mechanism by producing TGF-beta that amplifies the fibrotic program while failing to resolve inflammation.\n\nThis contrasts sharply with healthy tissue where epithelium is quiescent (low CXCL8, TGFB1), fibroblasts are inactive (low ACTA2), and immune cells are sparse and homeostatic. Even in non-fistulizing Crohn's disease, fibrosis is less organized and lacks the continuous epithelial tract that serves as the persistent signaling source in fistulizing disease."}}, {"id": "Q8", "type": "comparison", "text": "What is the adaptive immune response you get in fistula?", "responses": {"X": "================================================================================\nADAPTIVE IMMUNE RESPONSE IN CROHN'S DISEASE FISTULA FORMATION\n================================================================================\n\nEXECUTIVE SUMMARY\nAnalysis of 6.3 million cells from spatial transcriptomics data reveals distinct\nadaptive immune signatures in fistulising Crohn's disease compared to non-fistulising\ndisease and diverticular disease.\n\n================================================================================\nKEY FINDINGS\n================================================================================\n\n1. ADAPTIVE IMMUNE CELL INFILTRATION\n-------------------------------------\n- T Cell Score: Highest in Active Fistulising (0.145) vs Non-Fistulising (0.101)\n- B Cell Score: Markedly elevated in Active Fistulising (0.227) vs Non-Fistulising (0.097)\n- Plasma Cell Score: Elevated in Active Fistulising (0.831) vs Non-Fistulising (0.693)\n- Adaptive Immune Score: 1.39x higher in Active Fistulising vs Non-Fistulising\n\n2. INFLAMMATORY SIGNATURE\n--------------------------\n- Inflammation Score: 4.8x higher in Active Fistulising (0.263) vs Non-Fistulising (0.055)\n- Myeloid Score: 1.27x higher in Active Fistulising (0.548) vs Non-Fistulising (0.431)\n- Checkpoint Molecules: Elevated in Active Fistulising (0.061) vs Non-Fistulising (0.040)\n\n3. T CELL SUBSET POLARIZATION\n-------------------------------\n- Th1 Signature: Moderate elevation in Deep/Stabilised Fistula (0.112) vs Active (0.078)\n- Th17 Signature: Low across all groups, suggesting non-Th17 pathogenesis\n\n4. TISSUE REMODELING\n---------------------\n- Stromal Score: Highest in Active Fistulising (2.68) vs Non-Fistulising (1.31)\n- Epithelial Score: Lowest in Active Fistulising (0.39) vs Non-Fistulising (0.97)\n- Indicates epithelial disruption and stromal activation in active fistulising disease\n\n5. DIFFERENTIAL GENE EXPRESSION\n---------------------------------\nTop upregulated genes in Active Fistulising vs Non-Fistulising:\n- KRT17 (1.06 log2FC): Epithelial stress marker\n- CXCL8 (0.92 log2FC): Neutrophil chemoattractant\n- LUM (0.88 log2FC): Stromal activation marker\n- MMP2 (0.88 log2FC): Tissue remodeling\n- POSTN (0.86 log2FC): Fibrosis marker\n- ANXA1 (0.84 log2FC): Inflammatory mediator\n- THBS1 (0.79 log2FC): TGF-beta activation\n- SOCS3 (0.79 log2FC): JAK-STAT regulation\n- CXCL5 (0.73 log2FC): Neutrophil recruitment\n- DMKN (0.67 log2FC): Epithelial differentiation\n\nTop downregulated genes:\n- PIGR (-1.09 log2FC): Secretory IgA transport\n- SLC26A3 (-0.98 log2FC): Ion transport\n- FABP1 (-0.95 log2FC): Hepatic/intestinal fatty acid binding\n- EPCAM (-0.94 log2FC): Epithelial marker\n- HMGCS2 (-0.72 log2FC): Mitochondrial function\n\n================================================================================\nCONCLUSION\n================================================================================\n\nFistulising Crohn's disease exhibits a distinct adaptive immune response:\n1. Enhanced B cell and plasma cell infiltration\n2. Elevated T cell infiltration with Th1/Th17 polarization\n3. Strong inflammatory signature with myeloid activation\n4. Epithelial disruption and stromal activation\n5. Upregulation of tissue remodeling and fibrosis markers\n\nThese findings suggest that fistula formation is driven by a complex interplay\nbetween adaptive immune cells, inflammatory mediators, and tissue remodeling\nprocesses.\n\n================================================================================\n", "Y": "================================================================================\nADAPTIVE IMMUNE RESPONSE IN FISTULA: INFLAMMATORY VS STABILISED IBD\n================================================================================\n\nEXECUTIVE SUMMARY\n=================\nAnalysis of two spatial transcriptomics datasets (Xenium 5100-plex: 1,860,368 cells;\nXenium 480-plex: 6,334,604 cells) reveals that the adaptive immune response in fistula\nis characterized by a dominance of plasma cells and reduced T-cell representation\ncompared to healthy tissue. When comparing inflammatory fistula directly to stabilised\n(non-fistulising) IBD tissue, differences are more subtle and dataset-dependent.\n\n================================================================================\nKEY FINDINGS\n================================================================================\n\n1. ADAPTIVE IMMUNE CELL COMPOSITION\n------------------------------------\n\nXenium 480-plex:\n  Condition                T-cells   B-cells   Plasma   Lymphatic\n  ---------------------------------------------------------------\n  Inflammatory Fistula     24.7%     25.4%     41.4%    8.5%\n  Not Fistulising (Stab)   27.5%     24.4%     41.2%    7.0%\n  Diverticular (Control)   23.4%     24.4%     47.0%    5.3%\n\nXenium 5100-plex:\n  Condition                      T-cells   B-cells   Plasma   Lymphatic\n  ---------------------------------------------------------------\n  Inflammatory Fistula           30.9%     9.1%      53.3%    6.7%\n  Ulcerative (Non-Fistulising)   29.7%     13.1%     52.6%    4.7%\n  Healthy Control                47.3%     9.8%      34.9%    8.0%\n\n2. KEY DIFFERENTIATING FEATURES\n-------------------------------\n\na) PLASMA CELL DOMINANCE IN FISTULA (5100-plex):\n   - Fistula: 53.3% (significantly higher than healthy 34.9%)\n   - Suggests robust B-cell differentiation and antibody production\n\nb) T-CELL DEPLETION IN FISTULA (5100-plex):\n   - Healthy: 47.3% T-cells of adaptive immune\n   - Fistula: 30.9% T-cells (35% reduction)\n\nc) MYELOID ENRICHMENT IN INFLAMMATORY FISTULA (480-plex):\n   - Inflammatory Fistula: 15.6% myeloid cells\n   - Not Fistulising: 6.4% myeloid cells\n   - Diverticular: 10.9% myeloid cells\n\nd) ADAPTIVE IMMUNE PROPORTIONS SIMILAR (480-plex):\n   - T-cells: 24.7% vs 27.5% (p = 0.157, NS)\n   - B-cells: 25.4% vs 24.4% (p = 0.941, NS)\n   - Plasma: 41.4% vs 41.2% (p = 0.602, NS)\n   - At tissue-level, overall adaptive immune composition is similar between\n     inflammatory and stabilised states\n\n3. STATISTICAL VALIDATION (480-PLEX, PER-SLIDE ANALYSIS)\n---------------------------------------------------------\n  Cell Type       Fistula Mean   Stabilised Mean   p-value\n  ---------------------------------------------------------------------------\n  T-cells         23.5% +/- 6.7%   30.4% +/- 5.4%      0.157\n  B-cells         24.4% +/- 5.5%   23.6% +/- 1.3%      0.941\n  Plasma          43.6% +/- 9.8%   39.2% +/- 3.6%      0.602\n  Lymphatic       8.5% +/- 3.6%    6.7% +/- 0.4%       0.502\n\nNote: Small sample size for stabilised condition (n=2 slides) limits statistical power.\n\n4. EPITHELIAL STATUS STRATIFICATION\n------------------------------------\n  EPI_STATUS    Fistula Status          T-cells   B-cells   Plasma   Lymphatic\n  ---------------------------------------------------------------------------\n  COLUMNAR      Diverticular            24.2%     22.9%     47.9%    4.95%\n  COLUMNAR      Not Fistulising         27.5%     24.3%     41.2%    6.95%\n  COLUMNAR      Inflammatory Fistula    25.6%     25.6%     43.7%    7.05%\n  SQUAMOUS      Inflammatory Fistula    23.9%     25.2%     40.2%    8.40%\n\nColumnar epithelium regions show the most pronounced differences, suggesting\nadaptive immune cells are enriched in areas with preserved epithelium.\n\n5. ABSOLUTE CELL COUNTS (480-PLEX)\n-----------------------------------\n  Condition                T-cells    B-cells    Plasma     Myeloid    Lymphatic\n  ---------------------------------------------------------------------------\n  Inflammatory Fistula     534,469    549,834    896,352    400,114    183,214\n  Not Fistulising          123,934    109,618    185,390    30,853     31,288\n  Diverticular             58,155     60,683     117,002    30,377     13,098\n\nInflammatory fistula has dramatically higher absolute numbers of all adaptive\nimmune cells (5-10x), reflecting tissue-level immune infiltration.\n\n================================================================================\nINTERPRETATION\n================================================================================\n\n1. WHAT IS THE ADAPTIVE IMMUNE RESPONSE IN FISTULA?\n   - Massive infiltration of adaptive immune cells (5-10x absolute counts)\n   - Plasma cell dominance (40-53% of adaptive compartment)\n   - Reduced T-cell representation relative to healthy tissue\n   - Elevated myeloid infiltration (innate-adaptive cross-talk)\n   - Consistent with chronic antigen stimulation driving B-cell differentiation\n\n2. CAN YOU DIFFERENTIATE INFLAMMATORY FISTULA FROM STABILISED IBD?\n   YES, but with nuances:\n   a) ABSOLUTE CELL DENSITY: Most robust differentiator (5-10x more cells)\n   b) MYELOID ENRICHMENT: Clear in 480-plex (15.6% vs 6.4%)\n   c) PLASMA CELL NUMBERS: Dramatically higher in fistula (896K vs 185K)\n   d) T:PLASMA RATIO: Lower in fistula (0.60) vs stabilised (0.67)\n   e) SPATIAL ORGANIZATION: Per-slide analysis reveals heterogeneity\n\n3. CLINICAL IMPLICATIONS\n   - Plasma cell dominance may represent a targetable mechanism\n   - Myeloid enrichment suggests combination therapy (innate + adaptive)\n   - T-cell preservation in some regions suggests potential for T-cell therapies\n   - Heterogeneity suggests spatially-resolved treatment strategies\n\n================================================================================\n"}, "semantic": {"executive_summary_x": {"bullets": ["Reports elevated B cell, plasma cell, and T cell scores in active fistulising disease", "Identifies 4.8x higher inflammation score with myeloid activation in fistula", "Notes Th1 elevation in deep/stabilised fistula but low Th17 across groups", "Highlights epithelial disruption and stromal activation as hallmarks", "Lists differentially expressed genes including CXCL8, MMP2, POSTN upregulated"]}, "executive_summary_y": {"bullets": ["Plasma cells dominate adaptive compartment in fistula (40-53% vs 35% healthy)", "T-cell proportion reduced 35% in fistula versus healthy tissue", "Absolute immune cell counts 5-10x higher in inflammatory fistula vs stabilised", "Adaptive immune proportions similar between inflammatory and stabilised states", "Statistical validation shows myeloid enrichment best differentiates fistula states"]}, "shared_points": [{"topic": "Plasma cell enrichment in fistula", "x_text": "Plasma Cell Score elevated in Active Fistulising (0.831) vs Non-Fistulising (0.693)", "y_text": "Plasma cell dominance 53.3% in fistula vs 34.9% healthy; 40-53% of adaptive compartment"}, {"topic": "Enhanced B cell presence in fistula", "x_text": "B Cell Score markedly elevated in Active Fistulising (0.227) vs Non-Fistulising (0.097)", "y_text": "B-cells present at 25.4% in inflammatory fistula; absolute counts dramatically higher (549K vs 110K)"}, {"topic": "Myeloid/innate immune enrichment in fistula", "x_text": "Myeloid Score 1.27x higher in Active Fistulising (0.548) vs Non-Fistulising (0.431)", "y_text": "Myeloid enrichment clear in inflammatory fistula: 15.6% vs 6.4% in non-fistulising"}, {"topic": "Overall massive immune infiltration in fistula tissue", "x_text": "Adaptive Immune Score 1.39x higher in Active Fistulising vs Non-Fistulising", "y_text": "5-10x higher absolute cell counts of all adaptive immune cells in inflammatory fistula"}, {"topic": "T cell involvement in fistula", "x_text": "T Cell Score highest in Active Fistulising (0.145) vs Non-Fistulising (0.101)", "y_text": "T-cells at 24.7-30.9% in fistula; reduced relative proportion compared to healthy (47.3%)"}, {"topic": "Strong inflammatory signature in active fistulising disease", "x_text": "Inflammation Score 4.8x higher in Active Fistulising (0.263) vs Non-Fistulising (0.055)", "y_text": "Inflammatory fistula shows dramatically higher absolute immune infiltration consistent with chronic antigen stimulation"}], "unique_x": [{"topic": "Th1/Th17 polarization assessment", "text": "Reports moderate Th1 elevation in deep/stabilised fistula (0.112 vs 0.078 active) and low Th17 across all groups, suggesting non-Th17 pathogenesis"}, {"topic": "Stromal activation and epithelial disruption scores", "text": "Stromal Score highest in active fistulising (2.68 vs 1.31) with lowest epithelial score (0.39 vs 0.97), indicating tissue architectural disruption"}, {"topic": "Differential gene expression analysis", "text": "Lists specific upregulated genes (KRT17, CXCL8, LUM, MMP2, POSTN, THBS1, SOCS3) and downregulated genes (PIGR, SLC26A3, FABP1, EPCAM) with log2FC values"}, {"topic": "Immune checkpoint molecule elevation", "text": "Reports elevated checkpoint molecules in active fistulising (0.061) vs non-fistulising (0.040)"}, {"topic": "Loss of secretory IgA transport", "text": "PIGR downregulated (-1.09 log2FC) in active fistulising, suggesting impaired mucosal IgA secretion"}], "unique_y": [{"topic": "Cross-dataset validation with two Xenium platforms", "text": "Compares findings between 5100-plex (1.86M cells) and 480-plex (6.33M cells) datasets, showing dataset-dependent differences in adaptive immune proportions"}, {"topic": "T-cell relative depletion in fistula vs healthy", "text": "T-cells reduced from 47.3% in healthy to 30.9% in fistula (35% reduction in 5100-plex), a proportional shift not highlighted by Response X"}, {"topic": "Statistical validation with p-values and per-slide analysis", "text": "Performs per-slide statistical testing showing adaptive immune proportions are NOT significantly different between inflammatory and stabilised states (p>0.15 for all)"}, {"topic": "Inflammatory vs stabilised distinction is primarily absolute density", "text": "Concludes that proportional composition is similar between fistula states; absolute cell density (5-10x) and myeloid enrichment are the true differentiators"}, {"topic": "Epithelial status stratification of immune composition", "text": "Stratifies adaptive immune cells by columnar vs squamous epithelium regions, finding immune enrichment correlates with preserved columnar epithelium"}, {"topic": "T:Plasma cell ratio as a metric", "text": "Calculates T:Plasma ratio lower in fistula (0.60) vs stabilised (0.67) as a potential distinguishing biomarker"}, {"topic": "Lymphatic endothelial cell quantification", "text": "Includes lymphatic cells in adaptive immune compartment analysis (5.3-8.5% across conditions)"}]}, "neutral_summary": {"X": "BIOLOGICAL FINDINGS SUMMARY\n\nAnalysis of 6.3 million cells from spatial transcriptomics data reveals a distinct adaptive immune response in active fistulising Crohn's disease, characterized by enhanced B-cell and plasma cell infiltration, elevated inflammatory signaling, and coordinated epithelial disruption with stromal activation.\n\nKey Findings:\n\n- B Cell Score is 2.34x higher in active fistulising (0.227) compared to non-fistulising tissue (0.097)\n- Plasma Cell Score is elevated 1.20x in active fistulising (0.831) vs non-fistulising (0.693)\n- T Cell Score is 1.44x higher in active fistulising (0.145) vs non-fistulising (0.101)\n- Overall adaptive immune score is 1.39x higher in active fistulising tissue\n- Inflammation score is 4.8x higher in active fistulising (0.263) vs non-fistulising (0.055)\n- Myeloid score is 1.27x higher in active fistulising (0.548 vs 0.431)\n- Immune checkpoint molecules are elevated in active fistulising (0.061 vs 0.040)\n- Th1 signature shows moderate elevation in deep/stabilised fistula (0.112) versus active (0.078)\n- Th17 signature is low across all groups\n- Stromal score is 2.05x higher in active fistulising (2.68) vs non-fistulising (1.31)\n- Epithelial score is 2.49x lower in active fistulising (0.39) vs non-fistulising (0.97)\n- Top upregulated genes: KRT17 (log2FC=1.06), CXCL8 (0.92), LUM (0.88), MMP2 (0.88), POSTN (0.86), ANXA1 (0.84), THBS1 (0.79), SOCS3 (0.79)\n- Top downregulated genes: PIGR (log2FC=-1.09), SLC26A3 (-0.98), FABP1 (-0.95), EPCAM (-0.94)\n\nBiological Interpretation:\n\nThe adaptive immune response in fistulising Crohn's disease is dominated by B-cell and plasma cell expansion, with a 2.34-fold increase in B-cell markers representing the most dramatic adaptive immune change. This suggests robust humoral immunity activation at fistula sites, potentially involving autoantibody production or immune complex-mediated tissue damage. The concurrent elevation of immune checkpoint molecules indicates that regulatory mechanisms are engaged but insufficient to control the inflammatory response.\n\nThe near 5-fold increase in inflammation score, combined with the 2-fold stromal activation and reciprocal 2.5-fold epithelial reduction, reveals the tissue-level consequence of adaptive immune engagement. The upregulation of tissue remodeling genes (MMP2, POSTN, THBS1, LUM) alongside neutrophil chemoattractants (CXCL8, CXCL5) indicates that adaptive immune activation drives both tissue destruction and aberrant repair simultaneously.\n\nNotably, the Th1 signature is moderately higher in deep/stabilised fistulas compared to active ones, while Th17 signatures remain low throughout. This suggests that fistula chronicity may involve a shift from acute neutrophilic inflammation (driven by CXCL8) toward a Th1-mediated chronic inflammatory state, with the B-cell/plasma cell expansion representing a consistent feature across fistula stages.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nThe adaptive immune response in Crohn's disease fistulas is characterized by a chronic, compartmentalized, and structurally organized inflammatory milieu that differs fundamentally between strongly inflammatory and stabilized fistulas. These two states can be distinguished by T-cell subset polarization, B-cell follicle organization, spatial architecture, and epithelial-mesenchymal crosstalk patterns.\n\nKey Findings:\n\n- Strongly inflammatory fistulas are dominated by Th1/Th17 cells (TBX21+, RORC+) with high cytotoxic T-cells (GZMB+, PRF1+), neutrophils (ELANE+, MPO+), and M1 macrophages (IL1B+, TNF+, NOS2+)\n- Stabilized fistulas show increased Tregs (FOXP3+, IL10+), Tfh cells (BCL6+), organized B-cell follicles with germinal center-like structures, and M2 macrophages (CD163+, MRC1+, TGFB1+)\n- IFN-gamma/JAK-STAT1 signaling (STAT1, CXCL9, CXCL10, CXCL11) is high in inflammatory fistulas\n- IL-23/IL-17 axis (IL23A, IL17A, IL17F, CCL20) drives inflammation in active disease\n- TGF-beta/SMAD signaling (TGFB1, SMAD3, ACTA2, COL1A1) is elevated in stabilized fistulas\n- IL-10/STAT3 signaling indicates anti-inflammatory activity in stabilized tissue\n- CXCL13/CXCR5 (lymphoid neogenesis markers) are elevated in stabilized fistulas with organized B-cell follicles\n- Inflammatory fistulas show disorganized immune cell infiltration with immune cells directly adjacent to damaged epithelium\n- Stabilized fistulas show compartmentalized immune cells in distinct niches with dense fibrotic capsule (COL1A1+, ACTA2+) surrounding the tract\n- Epithelial cells in fistulas produce CXCL8 and CCL20 recruiting adaptive immune cells; fibroblasts (ACTA2+, COL1A1+, COL3A1+) are activated by T-cell-derived IFN-gamma and TGF-beta\n\nBiological Interpretation:\n\nThe distinction between inflammatory and stabilized fistulas reflects a fundamental shift in immune organization rather than simply more or less inflammation. In actively inflammatory fistulas, the Th1/Th17 axis drives a diffuse, destructive pattern where immune cells infiltrate tissue without clear organization, directly contacting damaged epithelium and producing cytokines (IFN-gamma, IL-17) that perpetuate barrier breakdown and neutrophil recruitment. The strong CXCL9/CXCL10/CXCL11 chemokine signature indicates active IFN-gamma-dependent immune recruitment.\n\nStabilized fistulas represent an immunological reorganization rather than resolution. The shift toward Treg dominance (FOXP3+, IL10+) and M2 macrophage polarization (CD163+, TGFB1+) reflects active immune suppression, but the persistence of organized ectopic lymphoid structures (marked by CXCL13/CXCR5 gradients and germinal center B-cells) indicates ongoing chronic antigen presentation. The formation of a dense fibrotic capsule (COL1A1, COL3A1, ACTA2) around the tract acts as a physical barrier containing inflammation but also perpetuating the structural abnormality.\n\nThe spatial architecture is the most reliable distinguishing feature: inflammatory fistulas show immune cell gradient patterns from lumen outward, while stabilized fistulas show concentric organization with fibrotic barriers separating inflammatory cores from surrounding tissue."}}, {"id": "Q9", "type": "comparison", "text": "Why do you not get healing in many fistula? Is it due to immune over-activity or lack of immune activity?", "responses": {"X": "=================================================================\nSPATIAL TRANSCRIPTOMICS ANALYSIS: WHY FISTULAS FAIL TO HEAL\n=================================================================\n\nDATA SOURCES:\n- Xenium 5100-plex: 1.86M cells (Fistulising n=389K, Non-Fistulising n=1.01M, Healthy n=460K)\n- Xenium 480-plex: 6.33M cells (Fistulising n=4.67M, Non-Fistulising CD n=430K, Diverticular n=618K)\n- scRNA-seq reference: 24K cells (CD n=8,443, Healthy n=1,525)\n\n=================================================================\nKEY FINDINGS - CD Fistulising vs Non-Fistulising (Xenium 480)\n=================================================================\n\n1. CHEMOKINE EXPRESSION: 1.74x HIGHER in fistulising\n   Mean: 5.86 (fistulising) vs 3.37 (non-fistulising)\n   Genes: CXCL1, CXCL2, CXCL8, CXCL9, CXCL10, CXCL11, CCL2, CCL3, CCL4, CCL5\n   Interpretation: Massive immune cell recruitment to fistula tissue\n\n2. CYTOKINE EXPRESSION: 1.89x HIGHER in fistulising\n   Mean: 2.26 (fistulising) vs 1.20 (non-fistulising)\n   Genes: TNF, IFNG, IL17A, IL17F, IL6, IL1B, IL10, IL11, IL16, IL22, IL23A, IL23R, IL26, IL33\n   Interpretation: Sustained, amplified pro-inflammatory signaling\n\n3. TH17 SIGNATURE: 1.67x HIGHER in fistulising\n   Mean: 0.24 (fistulising) vs 0.14 (non-fistulising)\n   Genes: RORC, IL17A, IL17F, IL23R, IL6, IL22, IL26\n   Interpretation: Th17 skewing drives tissue inflammation and barrier disruption\n\n4. TH1/TH17 RATIO: 2.08 (Fistulising) vs 4.49 (Non-Fistulising)\n   - Fistulising tissue has RELATIVELY MORE Th17 compared to Th1\n   - Th17 skewing is critical for fistula pathogenesis\n\n5. TREG EXPRESSION: SIMILAR between groups (ratio ~0.98)\n   - Treg levels very low in both groups (mean ~0.03)\n   - Treg/Cytokine ratio: 0.014 (Fistulising) vs 0.028 (Non-Fistulising)\n   - Regulatory response is HALF as strong relative to inflammation in fistulising tissue\n\n6. CHECKPOINT EXPRESSION: 1.22x HIGHER in fistulising\n   Genes: PDCD1 (PD-1), LAG3, HAVCR2 (TIM-3), CTLA4, ICOS\n   Interpretation: T cell exhaustion in fistulising tissue\n\n7. EPI_STATUS FINDING:\n   - Fistulising CD: Has COLUMNAR (43%), SQUAMOUS & COLUMNAR (8%), Non-Epi (38%), SQUAMOUS (11%)\n   - Non-Fistulising CD: ONLY has COLUMNAR epithelium (100%)\n   - Fistulising tissue shows squamous metaplasia and loss of normal epithelium\n\n=================================================================\nCONCLUSION\n=================================================================\n\nFistula non-healing is caused by a COMBINATION of factors:\n\nA) OVERREACTIVE PRO-INFLAMMATORY RESPONSE (PRIMARY DRIVER):\n   - 1.7-1.9x higher chemokine and cytokine expression\n   - Sustained Th17 skewing (Th1/Th17 ratio 2.08 vs 4.49)\n   - Creates persistent inflammatory environment preventing healing\n\nB) INADEQUATE REGULATORY RESPONSE (SECONDARY FACTOR):\n   - Treg expression is very low and similar between groups\n   - Treg-to-cytokine ratio is HALF in fistulising vs non-fistulising\n   - Regulatory brake is overwhelmed by inflammatory drive\n\nC) T CELL EXHAUSTION:\n   - Elevated checkpoint markers (PD-1, LAG3, TIM-3, CTLA4)\n   - T cells become exhausted despite persistent inflammation\n\nD) TISSUE ARCHITECTURE DISRUPTION:\n   - Squamous metaplasia and loss of normal epithelium\n   - Complex tissue remodeling in fistula tracts\n\nTHERAPEUTIC IMPLICATIONS:\n1. Suppress Th17/cytokine response (anti-TNF, anti-IL-12/23, anti-IL-23)\n2. Restore regulatory T cell function\n3. Address tissue microenvironment to allow epithelial regeneration\n", "Y": "================================================================================\nWHY DO FISTULAS NOT HEAL IN MANY IBD PATIENTS?\nA Spatial Transcriptomics Analysis of Crohn's Disease Fistula Formation\n================================================================================\n\nEXECUTIVE SUMMARY\n=================\n\nBased on comprehensive spatial transcriptomics analysis of Xenium\ndata (480-plex, 6.3 million cells) from 41 IBD patients across CD, diverticular,\nand healthy tissues, this study provides direct evidence that fistula non-healing\nis NOT primarily due to lack of regulatory T cells, but rather to a persistent,\noveractive pro-inflammatory immune response.\n\nKEY FINDINGS:\n1. T-regulatory markers (FOXP3, CTLA4) are ACTUALLY ELEVATED in CD vs healthy\n2. Massive pro-inflammatory signatures in Myeloid cells (IL1B, CXCL1, MMP9)\n3. T-cells show exhausted phenotype (PD-1+, LAG3+, HAVCR2+) with pro-inflammatory activity\n4. Myeloid cell infiltration is 4.5x higher in CD than healthy tissue\n5. The inflammatory environment persists despite apparent immune regulation\n\n================================================================================\n1. CELL TYPE COMPOSITION BY DISEASE STATE\n================================================================================\n\nDataset: Xenium 480-plex, 6,334,604 cells, 41 patients\nDisease groups: CD (n=5,101,463 cells), Diverticular (n=618,039), Healthy (n=615,102)\n\nCell Type Proportions (% of total cells):\n┌─────────────────┬──────────┬──────────────┬──────────┐\n│ Cell Type       │ CD       │ Diverticular │ Healthy  │\n├─────────────────┼──────────┼──────────────┼──────────┤\n│ Myeloid         │ 8.2%     │ 4.9%         │ 1.8%     │\n│ Plasma          │ 19.2%    │ 18.9%        │ 16.3%    │\n│ T-cells         │ 11.5%    │ 9.4%         │ 11.5%    │\n│ B-cells         │ 11.7%    │ 9.8%         │ 10.2%    │\n│ Stem/Undiff     │ 10.2%    │ 9.4%         │ 15.6%    │\n│ Enterocytes     │ 7.4%     │ 8.2%         │ 5.8%     │\n│ IL11+           │ 6.4%     │ 4.9%         │ 0.6%     │\n│ Goblets         │ 4.8%     │ 10.7%        │ 8.9%     │\n│ Stromal 1       │ 3.9%     │ 4.2%         │ 9.3%     │\n└─────────────────┴──────────┴──────────────┴──────────┘\n\nKEY OBSERVATION: Myeloid cells are 4.5x more abundant in CD than healthy tissue,\nand 1.7x higher than diverticular controls. This suggests chronic myeloid\ninfiltration is a hallmark of CD pathogenesis.\n\n================================================================================\n2. T-REGULATORY MARKERS: EVIDENCE AGAINST \"LACK OF Tregs\" HYPOTHESIS\n================================================================================\n\nIf fistula non-healing were due to insufficient Tregs, we would expect LOWER\nFOXP3 and CTLA4 expression in CD tissue. The opposite is true.\n\nFOXP3 (canonical Treg marker) in T-cells:\n  CD:      4.0% of T-cells expressing (mean=0.219)\n  Healthy: 1.5% of T-cells expressing (mean=0.080)\n  → 2.7x HIGHER in CD tissue\n\nCTLA4 (Treg/exhaustion marker) in T-cells:\n  CD:      12.3% of T-cells expressing (mean=0.701)\n  Healthy: 5.1% of T-cells expressing (mean=0.279)\n  → 2.4x HIGHER in CD tissue\n\nAdditional exhaustion/regulatory markers in T-cells:\n  LAG3:    CD 5.9% vs Healthy 6.6% (similar)\n  HAVCR2:  CD 5.5% vs Healthy 3.3% (elevated in CD)\n  PDCD1:   CD 1.6% vs Healthy 1.2% (similar)\n\nINTERPRETATION: The immune system IS attempting regulation. Elevated FOXP3,\nCTLA4, and HAVCR2 indicate active Treg responses and T-cell exhaustion.\nThe problem is NOT insufficient regulation—it is that regulatory mechanisms\nare overwhelmed or dysfunctional.\n\n================================================================================\n3. PRO-INFLAMMATORY SIGNATURES: THE DRIVING FORCE\n================================================================================\n\n3A. T-Cell Pro-Inflammatory Gene Expression\n────────────────────────────────────────────\n\nGene          CD (%)    Diverticular (%)  Healthy (%)   Fold Change (CD vs Healthy)\n────────────  ────────  ────────────────  ───────────   ───────────────────────────\nIL6           5.6%      2.5%              1.0%          5.6x\nIL1B          3.3%      1.5%              0.5%          6.6x\nCXCL1         5.8%      3.9%              1.8%          3.2x\nMMP9          3.8%      2.2%              0.8%          4.8x\nIFNG          1.8%      1.3%              1.2%          1.5x\nTNF           2.0%      1.3%              2.5%          0.8x\n\nKEY FINDING: IL6, IL1B, CXCL1, and MMP9 are all significantly elevated in CD\nT-cells compared to healthy tissue (3-7x increase).\n\n3B. Myeloid Cell Pro-Inflammatory Gene Expression (CRITICAL FINDING)\n─────────────────────────────────────────────────────────────────────\n\nGene          CD (%)    Diverticular (%)  Healthy (%)   Fold Change (CD vs Healthy)\n────────────  ────────  ────────────────  ───────────   ───────────────────────────\nIL1B          52.1%     35.9%             1.8%          29x !!!\nCXCL1         24.7%     17.4%             1.6%          15x !!!\nMMP9          22.0%     20.3%             2.3%          10x !!!\nIL6            9.7%      4.0%             1.4%           7x !!!\nSTAT1          41.7%     28.7%             22.7%         1.8x\nSTAT3          43.2%     42.0%             36.6%         1.2x\n\nKEY FINDING: Myeloid cells in CD tissue show DRAMATIC upregulation of pro-inflammatory\ngenes. IL1B is expressed in 52% of myeloid cells in CD vs only 1.8% in healthy tissue—\na 29-fold increase. CXCL1 (a potent neutrophil chemoattractant) shows a 15-fold increase.\n\nThis creates a self-reinforcing inflammatory loop:\n1. Myeloid cells produce IL1B, IL6, CXCL1\n2. These attract more myeloid cells and neutrophils\n3. T-cells become activated and produce additional IL6, IL1B\n4. The inflammatory environment persists despite Treg activity\n\n================================================================================\n4. T-CELL EXHAUSTION PHENOTYPE\n================================================================================\n\nT-cells in CD fistulas show markers of exhaustion alongside pro-inflammatory activity:\n\nExhaustion Markers in T-cells:\n  PDCD1 (PD-1):  CD 1.6% vs Healthy 1.2%\n  LAG3:          CD 5.9% vs Healthy 6.6%\n  HAVCR2 (TIM-3): CD 5.5% vs Healthy 3.3%\n\nCombined Exhaustion/Regulatory Profile:\n  CTLA4+FOXP3+ T-cells are ELEVATED in CD, suggesting the immune system is\n  attempting to compensate for chronic inflammation. However, the persistence\n  of pro-inflammatory signatures (IL6, IL1B, CXCL1) alongside exhaustion markers\n  suggests these T-cells are in a dysfunctional state—capable of producing\n  inflammatory cytokines but unable to fully resolve inflammation.\n\n================================================================================\n5. FISTULA TYPE ANALYSIS\n================================================================================\n\nT-cell proportions across fistula classifications:\n  EXTERNAL: ENTERO/COLOCUTANEOUS:   8.0% T-cells (n=74,656)\n  INTERNAL/SMALL/LARGE INTESTINE:  12.8% T-cells (n=401,187)\n  NOT FISTULISING:                 11.9% T-cells (n=123,934)\n  DIVERTICULAR:                     9.4% T-cells (n=58,155)\n  EXTERNAL: PERI-ANAL:              9.7% T-cells (n=58,626)\n\nOBSERVATION: T-cell proportions do not dramatically differ between fistula types,\nsuggesting that the immune dysregulation is a feature of CD pathogenesis itself\nrather than specifically driving fistula formation.\n\n================================================================================\n6. MOLECULAR MECHANISMS OF NON-HEALING\n================================================================================\n\nBased on the data, fistula non-healing is driven by:\n\nA. PERSISTENT MYELOID ACTIVATION\n   - 29x increase in IL1B+ myeloid cells in CD vs healthy\n   - 15x increase in CXCL1+ myeloid cells (neutrophil recruitment)\n   - 10x increase in MMP9+ myeloid cells (tissue remodeling/destruction)\n\nB. T-CELL DYSFUNCTION\n   - Elevated pro-inflammatory cytokines (IL6, IL1B) alongside exhaustion markers\n   - Suggests T-cells are unable to transition to a resolving phenotype\n   - Continuous antigen exposure prevents immune resolution\n\nC. INFLAMMASOME ACTIVATION\n   - High IL1B expression in both T-cells and myeloid cells\n   - Suggests NLRP3 inflammasome activation driving chronic inflammation\n   - IL1B is a master regulator of tissue-destructive inflammation\n\nD. MATRIX REMODELING DISRUPTION\n   - Elevated MMP9 in both T-cells and myeloid cells\n   - Excessive tissue degradation prevents proper wound healing\n   - Imbalance between matrix destruction and deposition\n\nE. CHEMOKINE-MEDIATED CELL RECRUITMENT\n   - CXCL1 drives neutrophil and myeloid cell recruitment\n   - Creates a self-sustaining inflammatory loop\n   - Prevents transition from inflammatory to proliferative healing phase\n\n================================================================================\n7. CLINICAL IMPLICATIONS\n================================================================================\n\n1. Treg therapy alone is unlikely to succeed—the problem is not lack of regulation\n   but overwhelming inflammation that outpaces regulatory capacity.\n\n2. Targeted IL1B inhibition (e.g., anakinra, canakinumab) may be particularly\n   effective given the 29x elevation in myeloid IL1B.\n\n3. CXCL1/CXCR2 axis blockade could reduce neutrophil/myeloid recruitment.\n\n4. MMP9 inhibitors could reduce tissue destruction and allow proper healing.\n\n5. Combination therapy targeting both myeloid (IL1B, CXCL1) and T-cell (IL6)\n   pathways may be necessary to break the inflammatory cycle.\n\n6. The exhaustion phenotype suggests that checkpoint blockade (anti-PD-1)\n   is NOT appropriate—this would likely worsen inflammation.\n\n================================================================================\n9. CONCLUSION\n================================================================================\n\nFistula non-healing in Crohn's disease is primarily due to an OVERACTIVE\nimmune response characterized by:\n\n1. Massive myeloid infiltration (4.5x higher than healthy)\n2. Dramatic pro-inflammatory gene expression (IL1B 29x, CXCL1 15x, MMP9 10x)\n3. T-cell exhaustion with continued pro-inflammatory activity\n4. Self-sustaining inflammatory loops via chemokine recruitment\n\nThe data clearly demonstrate that this is NOT due to lack of regulatory T cells\n(FOXP3 and CTLA4 are elevated in CD). Instead, the inflammatory drive is so\noverwhelming that regulatory mechanisms are insufficient to achieve resolution.\n\nThe key therapeutic target is breaking the myeloid-driven inflammatory cycle,\nparticularly through IL1B and CXCL1/CXCR2 axis inhibition.\n\n================================================================================\n"}, "semantic": {"executive_summary_x": {"bullets": ["Fistula non-healing driven by 1.7-1.9x higher chemokine/cytokine overexpression", "Th17 skewing is critical (Th1/Th17 ratio 2.08 vs 4.49 in non-fistulising)", "Tregs present but overwhelmed; Treg/cytokine ratio halved in fistulising tissue", "T cell exhaustion markers (PD-1, LAG3, TIM-3) elevated in fistula", "Squamous metaplasia and epithelial architecture disruption in fistula tracts"]}, "executive_summary_y": {"bullets": ["Overactive immune response, NOT lack of Tregs, drives non-healing", "Myeloid cells show dramatic activation: IL1B 29x, CXCL1 15x, MMP9 10x vs healthy", "FOXP3/CTLA4 actually elevated 2.4-2.7x in CD, refuting Treg deficiency hypothesis", "Self-reinforcing myeloid-T cell inflammatory loop prevents resolution", "Myeloid infiltration 4.5x higher in CD than healthy tissue"]}, "shared_points": [{"topic": "Primary driver is immune over-activity, not lack of immune activity", "x_text": "Overreactive pro-inflammatory response is the primary driver (1.7-1.9x higher chemokines/cytokines)", "y_text": "Overactive immune response drives non-healing; NOT due to lack of regulatory T cells"}, {"topic": "Regulatory T cells are present but insufficient to control inflammation", "x_text": "Treg expression is very low but similar between groups; Treg/cytokine ratio halved in fistulising", "y_text": "FOXP3 and CTLA4 are 2.4-2.7x elevated in CD; regulatory mechanisms are overwhelmed by inflammation"}, {"topic": "T cell exhaustion phenotype in fistulising tissue", "x_text": "Checkpoint markers PD-1, LAG3, TIM-3, CTLA4, ICOS are 1.22x higher in fistulising", "y_text": "HAVCR2 (TIM-3) elevated, PDCD1 and LAG3 present; exhausted T cells produce cytokines but cannot resolve"}, {"topic": "Elevated pro-inflammatory cytokines and chemokines", "x_text": "TNF, IFNG, IL17A, IL6, IL1B, CXCL1, CXCL2, CXCL8, CCL2-5 all elevated in fistulising tissue", "y_text": "IL1B, IL6, CXCL1, MMP9 dramatically elevated (3-29x) in CD T cells and myeloid cells"}, {"topic": "Self-reinforcing inflammatory loop prevents healing", "x_text": "Sustained amplified pro-inflammatory signaling creates persistent environment preventing healing", "y_text": "Myeloid cells produce IL1B/CXCL1 attracting more myeloid cells; T cells add IL6/IL1B creating self-sustaining loop"}, {"topic": "Therapeutic implication: suppress inflammatory cytokine response", "x_text": "Anti-TNF, anti-IL-12/23, anti-IL-23 therapies to suppress Th17/cytokine response", "y_text": "Targeted IL1B inhibition (anakinra, canakinumab) and CXCL1/CXCR2 axis blockade"}], "unique_x": [{"topic": "Th17 skewing as critical mechanism", "text": "Th1/Th17 ratio is 2.08 in fistulising vs 4.49 in non-fistulising; fistula tissue has relatively more Th17 which drives barrier disruption (RORC, IL17A, IL17F, IL23R, IL22, IL26)"}, {"topic": "Squamous metaplasia and epithelial architecture disruption", "text": "Fistulising tissue shows squamous metaplasia (11% squamous, 8% squamous+columnar, 38% non-epithelial) vs 100% columnar in non-fistulising; loss of normal epithelium prevents healing"}, {"topic": "Direct fistulising vs non-fistulising CD comparison", "text": "Compares expression specifically between fistulising and non-fistulising Crohn's tissue (not CD vs healthy), showing 1.74x chemokine and 1.89x cytokine elevation in fistulising"}, {"topic": "Therapeutic target: restore Treg function", "text": "Suggests restoring regulatory T cell function as a therapeutic strategy alongside anti-inflammatory approaches"}], "unique_y": [{"topic": "Myeloid cell infiltration quantified as 4.5x higher in CD", "text": "Myeloid cells comprise 8.2% of CD tissue vs 1.8% in healthy (4.5x); this chronic myeloid infiltration is identified as a hallmark of CD pathogenesis"}, {"topic": "Cell-type-specific gene expression breakdown (myeloid vs T cell)", "text": "Separates pro-inflammatory signatures by cell type: myeloid IL1B 52% vs 1.8% healthy (29x), myeloid CXCL1 15x, myeloid MMP9 10x; T cell IL6 5.6x, IL1B 6.6x"}, {"topic": "Directly tests and refutes the lack-of-Tregs hypothesis with quantitative data", "text": "Explicitly frames hypothesis testing: if Treg deficiency caused non-healing, FOXP3/CTLA4 should be lower in CD; instead they are 2.7x and 2.4x higher, proving regulatory cells are present"}, {"topic": "Inflammasome activation (NLRP3) as mechanism", "text": "High IL1B in both T cells and myeloid cells suggests NLRP3 inflammasome activation as a driver of chronic tissue-destructive inflammation"}, {"topic": "MMP9-mediated tissue destruction prevents wound healing", "text": "MMP9 elevated 10x in myeloid cells and 4.8x in T cells; excessive matrix degradation prevents proper wound closure and healing"}, {"topic": "Checkpoint blockade (anti-PD-1) explicitly contraindicated", "text": "Warns that checkpoint inhibitor therapy would worsen inflammation given the exhaustion phenotype alongside active inflammatory signaling"}, {"topic": "Cell composition table across disease states", "text": "Provides full cell type proportion breakdown (myeloid, plasma, T cells, B cells, stromal, etc.) across CD, diverticular, and healthy tissue"}, {"topic": "Fistula type sub-analysis shows immune dysregulation is CD-wide", "text": "T-cell proportions similar across entero/colocutaneous, internal, peri-anal, and non-fistulising CD, suggesting immune dysregulation is a general CD feature not fistula-specific"}]}, "neutral_summary": {"X": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n- Chemokine expression is 1.74x higher in fistulising vs non-fistulising Crohn's disease tissue (mean 5.86 vs 3.37), with elevated CXCL1, CXCL2, CXCL8, CXCL9, CXCL10, CXCL11, CCL2, CCL3, CCL4, and CCL5\n- Cytokine expression is 1.89x higher in fistulising tissue (mean 2.26 vs 1.20), including TNF, IFNG, IL17A, IL17F, IL6, IL1B, IL10, IL11, IL16, IL22, IL23A, IL23R, IL26, and IL33\n- Th17 signature genes (RORC, IL17A, IL17F, IL23R, IL6, IL22, IL26) are 1.67x higher in fistulising tissue (mean 0.24 vs 0.14)\n- The Th1/Th17 ratio is markedly shifted toward Th17 in fistulising tissue (2.08 vs 4.49 in non-fistulising)\n- Regulatory T cell expression is equivalently low in both groups (mean ~0.03), but the Treg-to-cytokine ratio is halved in fistulising tissue (0.014 vs 0.028)\n- Immune checkpoint markers (PD-1, LAG3, TIM-3, CTLA4, ICOS) are 1.22x elevated in fistulising tissue\n- Fistulising tissue shows squamous metaplasia with only 43% columnar epithelium and 11% squamous, whereas non-fistulising tissue retains 100% columnar epithelium\n\nBiological Interpretation:\n\nSpatial transcriptomic profiling of 8.19 million cells across fistulising Crohn's disease, non-fistulising Crohn's disease, and healthy intestinal tissue reveals that fistula non-healing is driven primarily by an overreactive pro-inflammatory immune response. Fistulising tissue demonstrates a 1.7-1.9-fold increase in both chemokine and cytokine expression compared to non-fistulising Crohn's tissue. This sustained inflammatory milieu, characterized by elevated TNF, IFNG, IL17A, IL6, and IL1B alongside broad chemokine upregulation, creates a tissue microenvironment that actively prevents wound closure and epithelial regeneration.\n\nA critical finding is the skewing of the T helper cell response toward Th17 polarization in fistulising tissue. The Th1/Th17 ratio drops from 4.49 in non-fistulising to 2.08 in fistulising tissue, indicating that Th17-mediated inflammation predominates at fistula sites. This Th17 skewing, evidenced by elevated RORC, IL17A, IL17F, and IL23R, promotes barrier disruption and neutrophil recruitment, perpetuating tissue damage. Simultaneously, regulatory T cell function is insufficient to counterbalance this inflammation - while absolute Treg levels are comparably low across both disease states, the ratio of regulatory to inflammatory signaling is halved in fistulising tissue, indicating an overwhelmed immunosuppressive response.\n\nThe presence of elevated immune checkpoint molecules (PD-1, LAG3, TIM-3, CTLA4) suggests that T cells in fistulising tissue become exhausted despite persistent antigenic stimulation, further impairing effective immune resolution. Combined with the architectural disruption of the epithelium - evidenced by squamous metaplasia replacing normal columnar epithelium in fistula tracts - these findings establish that fistula persistence results from a self-reinforcing cycle of excessive Th17-driven inflammation, regulatory failure, T cell exhaustion, and tissue remodeling. Therapeutic strategies targeting IL-23/Th17 axis suppression, restoration of Treg function, and promotion of epithelial regeneration represent rational approaches to breaking this pathological cycle.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n- Fistula healing failure in Crohn's Disease represents a pathological equilibrium driven by chronic immune activation, tissue remodeling defects, and architectural disruption rather than a single causative factor\n- Fistula tissue is dominated by IFN-γ (Th1) and IL-17/IL-22 (Th17) producing T cells, with the IL-23/IL-17 axis serving as a central inflammatory driver\n- Neutrophil E
