%).\n- TWIST1-high fibroblasts show dramatic upregulation of ECM genes: COL1A1 (log2FC=1.67, p=5.4e-64), CTHRC1 (log2FC=1.94, p=2.0e-49), COL3A1 (log2FC=1.34, p=5.0e-36), CPXM1 (log2FC=1.77, p=1.2e-59).\n- Fibroblast activation protein FAP (log2FC=1.77, p=2.5e-49) and SERPINE1/PAI-1 (log2FC=1.44, p=1.4e-58) mark the activated pro-fibrotic state.\n- Inflammatory signaling through CXCL2 (log2FC=1.06, p=7.3e-37) and pro-survival signaling via IGFBP2 (log2FC=2.63, p=2.1e-30) and IGF1 (log2FC=1.25, p=2.8e-30) are upregulated.\n- ADAM12 metalloprotease (log2FC=1.93, p=1.6e-31) and SPHK1 sphingosine kinase (log2FC=1.10, p=4.1e-32) indicate enhanced invasive and survival capacity.\n- Pathway enrichment: ECM Organization (2.72-fold, p=1.7e-5), Inflammation (2.39-fold, p=2.0e-4), TGF-beta Signaling (1.95-fold, p=6.5e-3), Cell Migration (1.80-fold, p=3.2e-2), Angiogenesis (1.99-fold, p=3.6e-2).\n- TWIST1-high cells are distributed across multiple stromal clusters rather than forming a single lineage, indicating TWIST1 marks a functional activation state.\n\nBiological Interpretation:\nTWIST1-overexpressing fibroblasts in the gut represent a specialized pro-fibrotic population that integrates ECM remodeling, inflammation, and tissue invasion into a coordinated pathological program. The 9-fold enrichment of these cells in fistula tissue compared to healthy controls establishes a clear disease association. Their molecular signature is dominated by collagen production (COL1A1, COL3A1, COL14A1) and collagen maturation enzymes (CPXM1, PCOLCE, CTHRC1), creating the dense fibrotic matrix that characterizes fistula tract walls. FAP expression enables ECM degradation at the invasion front while SERPINE1 inhibits fibrinolysis behind, creating a net pro-fibrotic environment.\n\nThe TWIST1 transcriptional program confers enhanced motility through vimentin upregulation, FAK/PTK2 signaling, and ADAM12-mediated substrate cleavage. This migratory capacity allows fibroblasts to actively invade surrounding tissue, extending fistula tracts rather than passively responding to existing tissue damage. Growth factor signaling through IGF1/IGFBP2 and sphingosine kinase (SPHK1) promotes survival and proliferation of these activated cells, while midkine (MDK) provides additional mitogenic and angiogenic support.\n\nCritically, TWIST1-high fibroblasts simultaneously maintain inflammation through CXCL2-mediated neutrophil recruitment and NF-kB activation, creating a feed-forward loop where fibroblast-driven inflammation recruits immune cells whose products (TGF-beta, ROS) further activate fibroblasts. The co-expression of EMT transcription factors (TWIST1 with downstream SNAI1/2, ZEB1/2) confers cellular plasticity and apoptosis resistance, making this population resistant to resolution signals and maintaining chronic fibrotic activity. This dual fibrotic-inflammatory character distinguishes TWIST1-high fibroblasts from purely contractile myofibroblasts and positions them as key therapeutic targets in fistulising Crohn's disease.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n- TWIST1-overexpressing fibroblasts represent a distinct pathogenic subpopulation in fistulising Crohn's disease, enriched in the lamina propria adjacent to ulcerated epithelium and within fistulous tract walls.\n- These fibroblasts co-express EMT markers (VIM, SNAI1, ZEB1, FN1), myofibroblast markers (ACTA2, COL1A1, COL3A1), and matrix metalloproteinases (MMP2, MMP9, MMP13).\n- TWIST1+ fibroblasts produce immune-modulatory factors CXCL12 (SDF-1), CCL2, IL-6, and TGFB1, creating sustained immune cell recruitment and chronic inflammation.\n- TNF-alpha and IL-1beta (elevated in CD) directly induce TWIST1 expression, creating a feed-forward inflammatory loop.\n- TWIST1 interacts with beta-catenin to enhance WNT transcriptional activity, driving proliferation and fibrosis.\n- HIF-1alpha upregulates TWIST1 in hypoxic fistulous tracts, promoting angiogenesis through VEGF production.\n- Paracrine TGF-beta and WNT from TWIST1+ fibroblasts induces EMT in adjacent epithelial cells, causing loss of E-cadherin and gain of migratory properties that enable epithelialization of fistula tracts.\n- TWIST1+ fibroblasts form a continuous layer within fistula tract walls while being most active at ulcer margins where tissue invasion originates.\n\nBiological Interpretation:\nTWIST1-overexpressing fibroblasts function as a central pathogenic hub in fistula formation, integrating inflammatory, fibrotic, and angiogenic signaling into a coordinated tissue-invasive program. Their defining characteristic is the ability to simultaneously degrade existing tissue (via MMP2/9/13) and deposit new fibrotic matrix (COL1A1, COL3A1, FN1), creating the paradoxical tissue architecture of fistula tracts -- channels lined by organized fibrosis rather than simple tissue destruction. ACTA2 expression adds contractile force that physically distorts tissue architecture.\n\nThe paracrine induction of EMT in adjacent epithelial cells represents the most clinically significant function of TWIST1+ fibroblasts. By secreting TGF-beta and WNT ligands, these fibroblasts cause neighboring epithelial cells to lose their polarity and cell-cell adhesion (E-cadherin downregulation), gaining migratory and invasive properties. This enables epithelial cells to line the fistula tract -- a hallmark feature that prevents spontaneous closure and distinguishes chronic fistulas from simple abscesses. The spatial localization of TWIST1+ fibroblasts at ulcer margins positions them precisely where this epithelial-to-mesenchymal transition initiates.\n\nThe feed-forward inflammatory cycle is self-perpetuating: TNF-alpha and IL-1beta from the inflammatory microenvironment induce TWIST1 expression, which drives IL-6 and CXCL12 production, recruiting more immune cells whose cytokines further upregulate TWIST1. Hypoxia within established fistula tracts adds an additional activation layer through HIF-1alpha, promoting VEGF-mediated angiogenesis that sustains the metabolically active fistula tissue. This multi-layered activation mechanism explains why fistulas resist healing even when systemic inflammation is controlled, and identifies TWIST1 pathway disruption as a potential strategy for breaking the cycle of chronic fistulisation."}}, {"id": "Q4", "type": "comparison", "text": "What changes do you observe in epithelium in fistula formation?", "responses": {"X": "================================================================================\nEPITHELIAL CHANGES IN CROHN'S DISEASE FISTULA FORMATION\nSpatial Transcriptomics Analysis\n================================================================================\n\nOVERVIEW\n--------\nAnalysis of 1,827,460 cells from 19 tissue samples across 3 conditions:\n  - Healthy Control (HC): 8 samples, 449,094 cells\n  - Ulcer (non-fistulising IBD): 7 samples, 999,124 cells\n  - Fistula (fistulising Crohn's): 4 samples, 379,242 cells\n\nThree epithelial subtypes identified at Level 2 annotation:\n  - Enterocytes (absorptive)\n  - EECs (Enteroendocrine cells)\n  - TAs (Transit-amplifying cells / progenitors)\n\n================================================================================\nKEY FINDING 1: DRAMATIC LOSS OF EPITHELIAL CELLS IN FISTULA\n================================================================================\n\n  Condition    Total Cells    Epithelial Cells    % Epithelial\n  ---------    -----------    ----------------    ------------\n  HC           449,094        165,687             36.9%\n  ULCER        999,124        143,877             14.4%\n  FISTULA      379,242        24,740               6.5%\n\nStatistical significance: chi-squared = 149,229, p < 2.2e-16\n\nInterpretation: Fistulising CD shows ~6-fold reduction in epithelial cells\ncompared to healthy tissue, suggesting extensive epithelial loss, sloughing,\nor failure of epithelial regeneration.\n\n================================================================================\nKEY FINDING 2: COMPLETE REPROGRAMMING OF EPITHELIAL SUBTYPE COMPOSITION\n================================================================================\n\n  Condition    Enterocytes    EECs    TAs (Progenitors)\n  ---------    -----------    ----    -----------------\n  HC           36.1%          20.9%   43.0%\n  ULCER        28.4%          37.8%   33.8%\n  FISTULA       0.5%          72.7%   26.8%\n\nStatistical significance: chi-squared = 32,487, p < 2.2e-16\n\nInterpretation:\n- HEALTHY: Balanced epithelium with ~43% progenitors, 36% enterocytes, 21% EECs\n- ULCER: EECs expand to 38%, enterocytes decline (stress-induced secretory shift)\n- FISTULA: Near-total loss of enterocytes (0.5%), massive EEC expansion to 73%\n  representing profound dedifferentiation or metaplastic shift\n\n================================================================================\nKEY FINDING 3: ENTEROCYTE LOSS IS THE DRIVING FEATURE\n================================================================================\n\nEnterocytes undergo near-complete depletion in fistula:\n  - HC: 59,841 enterocytes (36.1%)\n  - ULCER: 40,880 enterocytes (28.4%)\n  - FISTULA: Only 130 enterocytes (0.5%)\n\nDE in rare remaining fistula enterocytes vs HC:\n  - CUBN (cubilin): log2FC = 11.48 - endocytic receptor\n  - KHK (ketohexokinase): log2FC = 11.22 - fructose metabolism\n  - ENPEP (aminopeptidase N): log2FC = 6.54 - brush border enzyme\n  - APOB (apolipoprotein B): log2FC = 6.14 - lipid transport\n  - MME: log2FC = 4.90 - brush border\n  - MGAM: log2FC = 3.69 - brush border enzyme\n\nThese cells may represent a stressed, hyperactive state or a distinct\nhighly specialized subset.\n\n================================================================================\nKEY FINDING 4: EEC EXPANSION DRIVES FISTULA EPITHELIAL CHANGES\n================================================================================\n\nEECs undergo 5-fold absolute expansion and 3.5-fold relative expansion:\n  - HC: 34,673 EECs (20.9%)\n  - FISTULA: 17,977 EECs (72.7%)\n\nDE in FISTULA EECs vs HC EECs:\n  Gene      log2FC    Function\n  REG4       2.54     Regenerating islet-derived protein 4\n  MUC2       2.17     Mucin 2 - gut luminal barrier\n  ITLN1      2.08     Intelectin-1 - immune modulation\n  KRT20      1.85     Cytokeratin 20 - epithelial marker\n  REG1A      1.84     Regenerating protein 1A\n  GFPT1      1.56     Glutamine-fructose-6-phosphate transaminase\n  FCGBP      1.49     IgA-binding protein - mucosal immunity\n  MYO1D      1.40     Myosin ID - secretion-related\n\nKey themes: Enhanced mucin production (MUC2, FCGBP), regenerative response\n(REG4, REG1A), immune modulation (ITLN1), metabolic reprogramming.\n\n================================================================================\nKEY FINDING 5: TA CELLS SHOW STRESS/INFLAMMATORY PROGRAM\n================================================================================\n\nTA cells in fistula show upregulation of inflammatory/stress genes:\n  Gene       log2FC    Function\n  CD177       5.00     Neutrophil marker - myeloid activation\n  CDHR1       4.20     Cadherin-related - barrier function\n  ITLN1       2.78     Intelectin-1 - immune modulation\n  SGK1        2.61     Serum/glucocorticoid regulated kinase\n  CYP27A1     2.41     Sterol 27-hydroxylase\n  ALDH1B1     2.23     Aldehyde dehydrogenase\n  STAT1       1.59     Interferon signaling\n  CFTR        1.43     Cystic fibrosis transmembrane regulator\n  STAT3       1.43     IL-6/JAK-STAT signaling\n\nKey themes: STAT1/STAT3 activation (interferon/IL-6 signaling), SGK1 stress\nresponse, CD177 myeloid marker expression.\n\n================================================================================\nKEY FINDING 6: ULCER SHOWS INTERMEDIATE PHENOTYPE\n================================================================================\n\nUlcer (non-fistulising IBD) shows intermediate epithelial state:\n  - Epithelial proportion: 14.4% (between HC 36.9% and FISTULA 6.5%)\n  - EEC expansion: 37.8% (between HC 20.9% and FISTULA 72.7%)\n\nDE in ULCER vs HC:\n  - CUBN: log2FC = 6.24, CDHR1: 5.45, SLC26A2: 4.44, CEACAM7: 4.24\n  - PADI2: 4.15, TRPM6: 3.75, SLC26A3: 3.57, CA12: 2.50\n\n================================================================================\nKEY FINDING 7: FISTULA VS ULCER EPITHELIAL DIFFERENCES\n================================================================================\n\nDirect comparison of FISTULA vs ULCER:\n  Gene       log2FC    Function\n  APOB        8.40     Lipid transport\n  MME         6.68     Membrane metallo-endopeptidase\n  CPS1        6.63     Carbamoyl phosphate synthetase\n  CCL25       6.29     Chemokine - gut homing\n  REG1B       3.98     Regenerating protein\n  REG1A       3.70     Regenerating protein\n  ACE2        2.73     Angiotensin-converting enzyme 2\n  NOS2        2.69     Inducible nitric oxide synthase\n  REG4        2.58     Regenerating protein\n  HLA-DRA     2.40     MHC class II antigen\n\nKey themes: REG family (regenerative response), CCL25 (gut homing chemokine),\nNOS2 (iNOS inflammation), HLA-DRA (antigen presentation).\n\n================================================================================\nBIOLOGICAL INTERPRETATION\n================================================================================\n\n1. EPITHELIAL DEPLETION AS DISEASE SEVERITY MARKER\n   Progressive loss from HC (37%) to ULCER (14%) to FISTULA (7%) suggests\n   epithelial integrity is key determinant of fistula formation. Near-complete\n   enterocyte loss may allow bacterial translocation and fistula tract formation.\n\n2. ENDOCRINE METAPLASIA\n   EEC expansion from 21% to 73% represents extreme endocrine metaplasia,\n   reflecting dedifferentiation, selective EEC survival under stress, or\n   progenitor reprogramming toward endocrine lineage.\n\n3. LOSS OF ABSORPTIVE FUNCTION\n   Near-complete enterocyte loss (36% to 0.5%) implies severe malabsorption.\n   Few remaining enterocytes show extreme upregulation of absorptive genes\n   (compensatory hyperactive state).\n\n4. INFLAMMATORY REPROGRAMMING OF PROGENITORS\n   TA cells upregulate STAT1, STAT3, SGK1, CD177 indicating the progenitor\n   compartment is reprogrammed by inflammatory microenvironment rather than\n   supporting normal renewal.\n\n5. DISEASE CONTINUUM\n   HC -> ULCER (partial EEC expansion, moderate loss) -> FISTULA (near-complete\n   enterocyte loss, massive EEC expansion, inflammatory TA reprogramming)\n\n================================================================================\nEND OF ANALYSIS\n================================================================================\n", "Y": "================================================================================\nEPITHELIAL CHANGES IN FISTULA FORMATION IN CROHN'S DISEASE\n================================================================================\n\nDATA OVERVIEW:\n- 480-plex dataset: 6,334,604 cells (CD=5,101,463, DIVERTICULAR=618,039, HEALTHY=615,102)\n- 5100-plex dataset: 1,860,368 cells (HC, ULCER/non-fistulising, FISTULA)\n- 8 epithelial cell types: BEST4, EECs, Enterocytes, Goblets, IL11+, Stem/Undiff, TAs, Tuft\n\n================================================================================\nFINDING 1: UNIVERSAL WNT PATHWAY ACTIVATION ACROSS ALL EPITHELIAL TYPES\n================================================================================\n\nWNT signaling activated in ALL 8 epithelial types during fistulising disease:\n\n  Gene          BEST4    EECs    Enterocytes    Goblets    IL11+    Stem/Undiff    TAs    Tuft\n  WNT2          Up       Up      Up             Up         Up       Up             Up     Up\n  GREM1         Up       Up      Up             Up         Up       Up             Up     Up\n  PRRX1         Up       Up      Up             Up         Up       Up             Up     Up\n  TWIST1        Up       Up      Up             Up         Up       Up             Up     Up\n  WNT5A         -        Up      -              -          Up       -              -      -\n\nKey statistics (FISTULISING vs HEALTHY):\n  - EECs: WNT2 avg_log2FC = 3.76, GREM1 avg_log2FC = 3.62, PRRX1 avg_log2FC = 3.22\n  - GREM1 expression in EECs: HEALTHY=0.28, NON_FISTULISING=3.02, FISTULISING=2.38\n  - PRRX1 expression in EECs: HEALTHY=0.25, NON_FISTULISING=1.70, FISTULISING=2.05\n\nInterpretation: Coordinated EMT-like program driven by WNT/beta-catenin signaling.\nGREM1 antagonizes BMP (promoting stemness), PRRX1 and TWIST1 drive EMT and fibrosis.\n\n================================================================================\nFINDING 2: ECM REMODELING AND FIBROTIC ACTIVATION\n================================================================================\n\nMMPs and ECM components universally upregulated:\n\nKey statistics (FISTULISING vs HEALTHY):\n  - BEST4: MMP2 avg_log2FC = 5.51, LUM avg_log2FC = 6.01, POSTN avg_log2FC = 4.56\n  - IL11+: MMP1 avg_log2FC = 6.13, MMP3 avg_log2FC = 4.84, CXCL13 avg_log2FC = 4.82\n  - MMP2 expression in EECs: HEALTHY=0.96, NON_FISTULISING=5.48, FISTULISING=5.51\n  - MMP1 expression in IL11+: HEALTHY=0.19, NON_FISTULISING=1.49, FISTULISING=1.51\n\nInterpretation: Coordinated MMPs/TIMPs upregulation indicates active ECM turnover.\nLUM, POSTN, COL6A3, DCN are pro-fibrotic ECM components, showing epithelial cells\ndirectly contribute to fibrotic microenvironment.\n\n================================================================================\nFINDING 3: INFLAMMATORY CYTOKINE ACTIVATION\n================================================================================\n\nKey statistics (FISTULISING vs HEALTHY):\n  - BEST4: CXCL13 avg_log2FC = 6.27, CXCL1 avg_log2FC = 6.03\n  - Goblets: CXCL5 avg_log2FC = 6.07, MMP1 avg_log2FC = 6.04, IL11 avg_log2FC = 5.29\n  - IL11+: CXCL5 avg_log2FC = 4.57, MMP9 avg_log2FC = 4.27, IL6 avg_log2FC = 4.14\n\nInterpretation:\n- CXCL13/CCL11: Lymphoid chemokines recruiting B cells and Th2 cells\n- CXCL1/2/5: Neutrophil chemoattractants\n- IL1B/IL6: NF-kappaB and JAK/STAT pathway activation\n- SOCS3: Negative feedback regulator of JAK/STAT\n\n================================================================================\nFINDING 4: ENTEROCYTE DIFFERENTIATION DEFECTS\n================================================================================\n\n  Gene          Enterocytes (F vs H)    BEST4 (F vs H)\n  DUOX2         avg_log2FC = -3.79      avg_log2FC = -4.39\n  PI3           avg_log2FC = -3.31      avg_log2FC = -4.05\n  MUC4          avg_log2FC = -2.26      -\n\nInterpretation: DUOX2 downregulation indicates impaired enterocyte differentiation\nand mucosal barrier function in fistulising disease.\n\n================================================================================\nFINDING 5: GOBLET CELL DYSFUNCTION\n================================================================================\n\nGoblet cells show inflammatory reprogramming:\n  Upregulated: CXCL5 (FC=6.07), MMP1 (FC=6.04), IL11 (FC=5.29), G0S2 (FC=4.87)\n  Downregulated: MUC2 (FC=-2.09 in NON_FISTULISING vs HEALTHY)\n\nGoblet cell proportion: HEALTHY=19.0%, NON_FISTULISING=17.3%, FISTULISING=12.1%\n\nInterpretation: Goblet cells lose mucin-producing function (MUC2 down) and\nacquire inflammatory phenotype (CXCL5, MMP1, IL11 up). Proportion decrease\nindicates depletion or transdifferentiation.\n\n================================================================================\nFINDING 6: CELL TYPE COMPOSITION SHIFTS\n================================================================================\n\n  Cell Type       HEALTHY    NON_FISTULISING    FISTULISING\n  BEST4            3.8%           0.7%            0.4%\n  EECs             3.3%           9.9%           11.3%\n  Enterocytes     12.5%          17.8%           18.0%\n  Goblets         19.0%          17.3%           12.1%\n  IL11+            1.3%           8.6%           16.7%\n  Stem/Undiff     33.3%          22.4%           24.9%\n  TAs             26.5%          23.0%           16.3%\n  Tuft             0.4%           0.3%            0.3%\n\nKey observations:\n  1. IL11+ cells expand 13-fold from healthy (1.3%) to fistulising (16.7%)\n  2. EECs expand 3.4-fold from healthy (3.3%) to fistulising (11.3%)\n  3. Goblets decrease 36% from healthy (19.0%) to fistulising (12.1%)\n  4. TAs decrease from healthy (26.5%) to fistulising (16.3%)\n  5. BEST4 cells decrease from healthy (3.8%) to fistulising (0.4%)\n\n================================================================================\nFINDING 7: IL11+ STROMAL-LIKE EPITHELIAL POPULATION\n================================================================================\n\nIL11+ cells show most dramatic expansion:\n  Proportion: HEALTHY=1.3% -> NON_FISTULISING=8.6% -> FISTULISING=16.7%\n\nKey DE genes (FISTULISING vs HEALTHY):\n  - MMP1: avg_log2FC = 6.13, pct.1 = 64.7%, pct.2 = 1.8%\n  - MMP3: avg_log2FC = 4.84, pct.1 = 36.5%, pct.2 = 2.2%\n  - CXCL13: avg_log2FC = 4.82, pct.1 = 35.5%, pct.2 = 2.1%\n  - MME: avg_log2FC = 4.76, pct.1 = 32.7%, pct.2 = 1.2%\n  - CXCL5: avg_log2FC = 4.57, pct.1 = 53.8%, pct.2 = 3.3%\n  - MMP9: avg_log2FC = 4.27, pct.1 = 20.8%, pct.2 = 0.9%\n  - WNT5A: avg_log2FC = 4.27, pct.1 = 39.1%, pct.2 = 1.9%\n  - IL6: avg_log2FC = 4.14, pct.1 = 11.2%, pct.2 = 0.6%\n  - PRRX1: avg_log2FC = 4.12, pct.1 = 49.2%, pct.2 = 2.6%\n\nInterpretation: IL11+ represents a novel highly activated epithelial-like\npopulation driving ECM remodeling, inflammation, and WNT signaling. Their\n13-fold expansion suggests a key role in fistula pathogenesis.\n\n================================================================================\nFINDING 8: CROSS-PLATFORM CONSISTENCY\n================================================================================\n\nBoth 480-plex (6.3M cells) and 5100-plex (1.86M cells) show consistent patterns:\n- All DE genes show consistent direction of change\n- Proportional shifts match between platforms\n- EMT markers (PRRX1, TWIST1) confirmed in fistulising samples\n\n================================================================================\nSUMMARY: THREE MAJOR PATHOLOGICAL PATHWAYS\n================================================================================\n\n1. WNT/EMT PATHWAY ACTIVATION\n   - Universal across all epithelial types\n   - Key genes: WNT2, GREM1, PRRX1, TWIST1\n\n2. INFLAMMATORY CYTOKINE PRODUCTION\n   - Epithelial cells become major chemokine sources\n   - Key genes: CXCL1, CXCL2, CXCL5, CXCL13, IL1B, IL6\n\n3. EPITHELIAL REPROGRAMMING AND DYSFUNCTION\n   - Loss of differentiated function (DUOX2, MUC2 down)\n   - Gain of inflammatory/stromal-like phenotype (IL11+ expansion)\n   - ECM remodeling and fibrosis (MMPs, LUM, POSTN)\n\n================================================================================\nEND OF ANALYSIS\n================================================================================\n"}, "semantic": {"executive_summary_x": {"bullets": ["Fistula shows 6-fold epithelial cell loss vs healthy", "Near-complete enterocyte depletion with massive EEC expansion to 73%", "TA progenitors reprogrammed by inflammatory signaling (STAT1/STAT3)", "Disease continuum: HC to Ulcer to Fistula with progressive changes", "Remaining enterocytes show compensatory hyperactive absorptive state"]}, "executive_summary_y": {"bullets": ["Universal WNT/EMT pathway activation across all 8 epithelial types", "IL11+ stromal-like epithelial population expands 13-fold in fistula", "Epithelial cells become major inflammatory chemokine sources", "Goblet cells lose mucin function and gain inflammatory phenotype", "ECM remodeling genes (MMPs, POSTN, LUM) upregulated in epithelium"]}, "shared_points": [{"topic": "Loss of epithelial cells in fistula", "x_text": "6-fold reduction in epithelial proportion (36.9% HC to 6.5% fistula); chi-squared p<2.2e-16", "y_text": "Multiple cell types depleted: BEST4 from 3.8% to 0.4%, goblets from 19% to 12.1%, TAs from 26.5% to 16.3%"}, {"topic": "EEC/enteroendocrine cell expansion in fistula", "x_text": "EECs expand from 20.9% to 72.7% of epithelium in fistula, representing endocrine metaplasia", "y_text": "EECs expand 3.4-fold from 3.3% to 11.3% in fistulising tissue"}, {"topic": "Inflammatory reprogramming of epithelial cells", "x_text": "TA cells upregulate STAT1, STAT3, CD177, SGK1 indicating inflammatory microenvironment reprogramming", "y_text": "Epithelial cells become chemokine sources with CXCL1/2/5/13, IL1B, IL6 upregulation across multiple subtypes"}, {"topic": "Enterocyte differentiation and functional loss", "x_text": "Near-complete enterocyte loss (36.1% to 0.5%) implies severe malabsorption; remaining cells are hyperactive", "y_text": "DUOX2 downregulation (log2FC=-3.79) indicates impaired enterocyte differentiation and barrier function"}, {"topic": "Disease severity continuum (HC to ulcer to fistula)", "x_text": "Ulcer is intermediate phenotype: epithelial 14.4% (between HC 36.9% and fistula 6.5%)", "y_text": "IL11+ cells show graded expansion: healthy 1.3%, non-fistulising 8.6%, fistulising 16.7%"}, {"topic": "Regenerative response genes upregulated", "x_text": "Fistula EECs upregulate REG4 (log2FC=2.54) and REG1A (log2FC=1.84) indicating regenerative response", "y_text": "Fistula vs ulcer comparison shows REG1B (log2FC=3.98) and REG1A (log2FC=3.70) upregulation"}], "unique_x": [{"topic": "Quantification of global epithelial depletion", "text": "Provides precise cell counts: 165,687 epithelial cells in HC vs only 24,740 in fistula, with chi-squared statistics for significance"}, {"topic": "Rare remaining enterocytes show compensatory hyperactivation", "text": "130 surviving fistula enterocytes massively upregulate absorptive genes: CUBN (log2FC=11.48), KHK (log2FC=11.22), ENPEP (log2FC=6.54), suggesting a hyperactive state"}, {"topic": "EEC-specific mucin and immune modulation program", "text": "Fistula EECs upregulate MUC2 (log2FC=2.17), ITLN1 (log2FC=2.08), FCGBP (log2FC=1.49) indicating enhanced mucosal barrier and immune modulation"}, {"topic": "Fistula vs ulcer direct differential expression", "text": "Provides direct fistula-vs-ulcer DE showing APOB (log2FC=8.40), CCL25 (log2FC=6.29), ACE2 (log2FC=2.73), NOS2 (log2FC=2.69), and HLA-DRA (log2FC=2.40)"}, {"topic": "Endocrine metaplasia interpretation", "text": "Interprets 73% EEC dominance as extreme endocrine metaplasia from dedifferentiation, selective survival, or progenitor reprogramming toward endocrine lineage"}], "unique_y": [{"topic": "Universal WNT/EMT pathway activation across all epithelial types", "text": "WNT2, GREM1, PRRX1, TWIST1 coordinately upregulated in all 8 epithelial subtypes, indicating a universal EMT-like program in fistulising disease"}, {"topic": "IL11+ stromal-like epithelial population expansion", "text": "Novel IL11+ population expands 13-fold (1.3% to 16.7%) with MMP1 (log2FC=6.13), MMP3 (log2FC=4.84), CXCL13 (log2FC=4.82), WNT5A (log2FC=4.27) -- a key fistula driver"}, {"topic": "Goblet cell dysfunction and inflammatory reprogramming", "text": "Goblet cells lose mucin production (MUC2 down) and acquire inflammatory phenotype with CXCL5 (log2FC=6.07), MMP1 (log2FC=6.04), IL11 (log2FC=5.29)"}, {"topic": "ECM remodeling driven by epithelial cells", "text": "Epithelial cells directly contribute to fibrotic microenvironment via MMP2 (log2FC=5.51), LUM (log2FC=6.01), POSTN (log2FC=4.56) in BEST4 cells"}, {"topic": "BEST4 cell depletion", "text": "BEST4 cells reduced 10-fold (3.8% to 0.4%) and show dramatic CXCL13 (log2FC=6.27) and CXCL1 (log2FC=6.03) upregulation in remaining cells"}, {"topic": "Cross-platform validation (480-plex and 5100-plex consistency)", "text": "Explicitly validates findings across both Xenium platforms (6.3M and 1.86M cells), showing consistent DE direction and proportional shifts"}, {"topic": "GREM1 as BMP antagonist promoting stemness", "text": "Identifies GREM1 upregulation as BMP pathway antagonism that promotes stemness and prevents differentiation across all epithelial types"}]}, "neutral_summary": {"X": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n- Epithelial cells undergo dramatic depletion from healthy (36.9% of total cells, 165,687 cells) to ulcer (14.4%, 143,877 cells) to fistula (6.5%, 24,740 cells), a 6-fold reduction (chi-squared=149,229, p<2.2e-16).\n- Enterocytes are nearly completely eliminated in fistula: from 36.1% of epithelium (59,841 cells) in healthy to 0.5% (130 cells) in fistula, while EECs expand from 20.9% (34,673 cells) to 72.7% (17,977 cells).\n- The rare surviving fistula enterocytes show extreme upregulation of brush border/absorptive genes: CUBN (log2FC=11.48), KHK (log2FC=11.22), ENPEP (log2FC=6.54), APOB (log2FC=6.14).\n- Fistula EECs upregulate regenerating proteins (REG4 log2FC=2.54, REG1A log2FC=1.84), mucin barrier genes (MUC2 log2FC=2.17), and immune modulators (ITLN1 log2FC=2.08, FCGBP log2FC=1.49).\n- Transit-amplifying cells in fistula activate inflammatory programs: CD177 (log2FC=5.00), STAT1 (log2FC=1.59), STAT3 (log2FC=1.43), SGK1 (log2FC=2.61).\n- Fistula vs ulcer comparison reveals CCL25 (log2FC=6.29, gut homing chemokine), NOS2 (log2FC=2.69, iNOS), HLA-DRA (log2FC=2.40, antigen presentation), and REG family upregulation.\n- All comparisons reach genome-wide significance with chi-squared values of 15,885 to 149,229 (all p<2.2e-16).\n\nBiological Interpretation:\nThe epithelial compartment in fistulising Crohn's disease undergoes a profound compositional transformation that represents far more than simple cell loss. The near-complete elimination of absorptive enterocytes (from 36.1% to 0.5%) destroys the intestinal absorptive barrier, while the compensatory expansion of enteroendocrine cells to 72.7% of remaining epithelium suggests a fundamental lineage reprogramming. This shift likely reflects selective survival advantage of EECs under severe inflammatory stress, or active redirection of progenitor cell differentiation away from absorptive fate toward secretory/endocrine lineages.\n\nThe functional consequences are striking. The 130 surviving enterocytes in fistula tissue display extreme upregulation of absorptive genes (CUBN log2FC=11.48, KHK log2FC=11.22), suggesting these rare cells represent a hyperactive compensatory state or a uniquely resistant subpopulation. The expanded EECs acquire additional functions beyond endocrine secretion -- upregulating mucin production (MUC2), regenerating proteins (REG4, REG1A), and immune mediators (ITLN1, FCGBP) -- indicating these cells attempt to compensate for lost barrier and antimicrobial functions normally provided by enterocytes and goblet cells.\n\nThe progenitor compartment (transit-amplifying cells) provides critical insight into why normal epithelial renewal fails. Rather than differentiating into replacement enterocytes, TAs activate inflammatory signaling programs (STAT1/STAT3 interferon and IL-6 pathways) and acquire myeloid-like features (CD177 expression). This inflammatory reprogramming of the stem/progenitor niche creates a self-perpetuating cycle: inflammation redirects progenitors away from absorptive differentiation, maintaining barrier dysfunction that permits continued bacterial translocation and sustained inflammation. The ulcer condition represents an intermediate state in this continuum, establishing that fistula formation involves progressive escalation of epithelial reprogramming rather than a sudden catastrophic change.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n- Fistulising Crohn's disease epithelium undergoes transformation from organized crypt architecture to irregular \"epithelial islands\" within fibrotic stroma, with loss of absorptive differentiation markers (FABP2, SLC5A1, MUC2) and gain of progenitor/metaplastic markers (KRT7, KRT19).\n- Stem cell-like (ISC-like) populations expressing LGR5, OLFM4, AXIN2, and HES1 expand beyond the crypt base in fistulising tissue, exhibiting high proliferation and apoptosis resistance.\n- EMT markers are specifically elevated in fistulising (not non-fistulising) disease: SNAI1, TWIST1, ZEB1, and VIM are upregulated in epithelial cells, conferring migratory and invasive properties.\n- Non-fistulising CD shows an intermediate state with NF-kappaB activation, IL-23/Th17 axis engagement, JAK/STAT (STAT1/3) signaling, and oxidative stress response (HMOX1, NQO1, SOD2), but EMT markers remain low.\n- Hedgehog signaling (SHH) is upregulated in fistulising epithelium, acting in paracrine fashion on fibroblasts (via PTCH1) to promote fibrosis and angiogenesis.\n- HIF-1alpha targets (VEGFA, GLUT1) are activated in fistula tract epithelium indicating hypoxic adaptation and angiogenic drive.\n- Tuft cells (POU2F3+, IL25+) increase in fistulising tissue, contributing to type 2 immunity and tissue remodeling through IL-13 production.\n- Goblet cell depletion (reduced MUC2, SPDEF) characterizes non-fistulising CD, while foveolar metaplasia (MUC5AC/MUC6) appears specifically in fistulising disease.\n- Basement membrane integrity is compromised with downregulation of COL4A1, LAMA5, and LAMB1 in fistulising epithelium.\n\nBiological Interpretation:\nThe epithelial transformation in fistulising Crohn's disease represents a progressive three-stage deterioration from homeostatic barrier to invasive, mesenchymal-like state. In healthy tissue, the epithelium maintains organized crypt-villus architecture through balanced Wnt/Notch signaling, with clearly zoned stem cells at the crypt base supporting continuous renewal of absorptive enterocytes and secretory cells. Non-fistulising CD disrupts this balance through inflammatory pathway activation (NF-kappaB, IL-23/Th17, JAK/STAT), causing goblet cell depletion, enterocyte dedifferentiation, and progenitor expansion -- but critically, the EMT program remains inactive and crypt architecture, while distorted, is preserved.\n\nThe transition to fistulising disease involves a qualitative shift: activation of the TGF-beta/EMT program (SNAI1, TWIST1, ZEB1, VIM) transforms epithelial cells from stationary barrier cells into migratory, invasive populations. Simultaneous Wnt hyperactivation (high AXIN2, MYC) expands the progenitor pool while blocking differentiation, and Hedgehog signaling (SHH) activates surrounding fibroblasts in a paracrine loop. The result is formation of \"epithelial islands\" -- irregular epithelial strands within the fibrotic stroma that are in intimate contact with FAP+/COL1A1+/ACTA2+ myofibroblasts.\n\nThis epithelial-fibroblast crosstalk creates a self-sustaining pathological circuit: epithelial TGF-beta1 activates fibroblasts via TGFBR2, epithelial SHH signals through fibroblast PTCH1, while fibroblast FGF2 acts back on epithelial FGFR2 promoting survival and proliferation. The loss of basement membrane components (COL4A1, LAMA5, LAMB1) removes the physical barrier between compartments, while neutrophil-derived ROS and proteases (from S100A8/A9+ cells in direct epithelial contact) create additional tissue damage. This bidirectional signaling between altered epithelium and activated stroma represents the fundamental mechanism of fistula tract formation and chronicity."}}, {"id": "Q5", "type": "comparison", "text": "On the colon samples, compare the difference between Crohn's disease (CD) vs diverticular disease fistula.", "responses": {"X": "================================================================================\nCOMPARISON OF CROHN'S DISEASE FISTULA VS DIVERTICULAR DISEASE IN COLON EPITHELIUM\nUsing Xenium 480-plex Spatial Transcriptomics\n================================================================================\n\n1. DATA OVERVIEW\n--------------------------------------------------------------------------------\n- Xenium 480-plex spatial transcriptomics dataset: 6.33M total cells\n- Colon samples: 2.66M cells (42% of total)\n- Epithelial cells in colon: 2.14M cells (EPI_STATUS in COLUMNAR + SQUAMOUS & COLUMNAR)\n  - CD (fistulising): 1.28M epithelial cells\n  - Diverticular: 478K epithelial cells\n  - Healthy: 386K epithelial cells\n- Subsampled analysis: 120K epithelial cells (40K per group)\n- 541 genes in the Xenium 480-plex panel\n\n2. KEY DIFFERENTIAL GENE EXPRESSION FINDINGS\n--------------------------------------------------------------------------------\n\n2.1 Genes UPREGULATED in CD Fistula (vs Diverticular) - Immune/Inflammatory\n\n  Gene      Log2FC  CD%   Div%   Function\n  --------  ------  ----  -----  ---------------------------\n  PTGDS     1.65    26.6  14.8   Prostaglandin D2 synthase\n  CCL11     1.54    10.9  4.5    Eotaxin-1 (chemokine)\n  CD69      1.54    11.2  4.9    Activation marker (immune)\n  ISG15     1.60    10.7  5.5    Interferon-stimulated gene\n  GREM1     0.65    27.2  19.2   BMP antagonist (Wnt pathway)\n  GBP4      0.93    11.5  6.7    Guanylate-binding protein\n  STAT1     0.80    30.1  21.3   Transcription factor (IFN)\n  EGR1      0.93    39.9  31.7   Early growth response\n  CXCL2     0.82    15.8  10.5   Neutrophil chemoattractant\n  CXCL1     0.78    13.1  8.7    Neutrophil chemoattractant\n  ITGA4     0.82    14.9  10.4   Integrin alpha-4 (adhesion)\n  CCL2      0.80    12.0  7.6    Monocyte chemoattractant\n  MMP1      1.04    10.4  6.4    Matrix metalloproteinase\n  ATM       0.78    21.0  15.4   DNA damage response\n  IGFBP5    0.60    32.2  25.4   IGF binding protein\n\n2.2 Genes DOWNREGULATED in CD Fistula (UP in Diverticular) - Epithelial Differentiation\n\n  Gene      Log2FC  CD%   Div%   Function\n  --------  ------  ----  -----  ---------------------------\n  KDM5D    -5.90    0.3   19.2   Histone demethylase\n  MUC12    -1.84    12.9  27.0   Mucin (goblet cell)\n  SLC26A3  -1.71    5.1   14.5   Chloride/bicarbonate exchanger\n  PI3      -1.66    3.9   10.6   Proline iminopeptidase\n  CEACAM7  -1.50    4.5   11.3   Carcinoembryonic antigen\n  EMP1     -1.42    25.5  45.9   Epithelial membrane protein\n  MMP19    -1.41    8.9   18.6   Matrix metalloproteinase\n  ANXA1    -0.84    20.9  32.3   Annexin A1\n  EPCAM    -0.88    17.5  27.2   Epithelial cell adhesion molecule\n  MUC2     -0.95    10.5  19.2   Mucin 2 (goblet cell)\n  CCN2     -1.08    25.2  43.7   Connective tissue growth factor\n  THBS1    -0.69    38.0  52.0   Thrombospondin-1\n  FKBP5    -0.54    25.3  43.4   Glucocorticoid receptor regulator\n  S100A10  -0.68    44.0  60.7   Calcium-binding protein\n  PLA2G2A  -1.11    11.7  20.6   Phospholipase A2\n\n3. PATHWAY ENRICHMENT ANALYSIS\n--------------------------------------------------------------------------------\n\n3.1 CD Fistula Upregulated Pathways (Hallmark gene sets):\n\n  Pathway                                    padj\n  -----------------------------------------  ------\n  HALLMARK_INTERFERON_GAMMA_RESPONSE         0.0057\n  HALLMARK_TNFA_SIGNALING_VIA_NFKB           0.0057\n\n  Interpretation: Strong interferon-gamma and TNF-alpha/NF-kB signaling\n  characterizes the CD fistula epithelial microenvironment, consistent\n  with Th1-mediated inflammation in Crohn's disease.\n\n3.2 Diverticular Upregulated Pathways (Hallmark gene sets):\n\n  Pathway                                    padj    Note\n  -----------------------------------------  ------  --------\n  HALLMARK_EPITHELIAL_MESENCHYMAL_TRANSITION 0.103   Trend\n  HALLMARK_COAGULATION                       0.103   Trend\n  HALLMARK_ESTROGEN_RESPONSE_EARLY           0.103   Trend\n  HALLMARK_ESTROGEN_RESPONSE_LATE            0.103   Trend\n  HALLMARK_APOPTOSIS                         0.210\n  HALLMARK_HYPOXIA                           0.233\n  HALLMARK_TGF_BETA_SIGNALING                0.309\n  HALLMARK_IL6_JAK_STAT3_SIGNALING           0.477\n\n  Interpretation: Diverticular shows trends toward EMT, coagulation, and\n  estrogen response pathways, but none reached significance at FDR < 0.05.\n\n4. CLUSTER ANNOTATION AND COMPOSITION\n--------------------------------------------------------------------------------\n\n17 clusters identified by Leiden clustering (resolution=0.5):\n\n  Cluster  Major Markers                Cell Type\n  -------  -------------------------    ------------------\n  0        CCDC80, DCN, LUM, MMP2       Fibroblasts/Stromal\n  1        EPCAM, GPX2, PIGR, MUC4      Columnar Epithelium\n  2        LYZ, CD163, C1QB, C1QA       Myeloid/Macrophages\n  3        SLC26A3, CEACAM7, FABP1      Enterocytes\n  4        CD74, MEIS1, IGFBP7          Mixed (immune+stromal)\n  5        MZB1, CD79A, PRDM1           B-cells/Plasma\n  6        PTPRC, CD3D, IL7R, SPOCK2    T-cells\n  7        CXCL14, PDGFRA, POSTN        Fibroblasts\n  8        PECAM1, VWF, ENG, AQP1       Endothelium\n  9        MUC2, FCGBP, ITLN1, TFF3     Goblet Cells\n  10       CXCL5, MMP1, MMP2, LUM       Inflammatory fibroblasts\n  11       FCGR3B, CXCL8, IL1B          Neutrophils/Myeloid\n  12       MS4A1, CD19, IL16            B-cells\n  13       NOTCH3, RGS5, COL4A1         Pericytes/Vascular\n  14       S100B, PLP1, SOX10           Glial/Schwann\n  15       CPA3, KIT, MS4A2             Mast Cells\n  16       FABP1, GZMA, ITGAE           IELs/NK cells\n\n5. CELLULAR COMPOSITION DIFFERENCES\n--------------------------------------------------------------------------------\n\nThe clustering reveals that CD Fistula and Diverticular epithelial samples\nhave MIXED cellular compositions rather than purely epithelial populations.\nBoth contain significant proportions of:\n- Immune cells (T-cells, B-cells, myeloid, neutrophils)\n- Stromal/fibroblast cells\n- Endothelial cells\n\nThis reflects the tissue architecture of colon biopsies containing lamina propria.\n\n6. INTERPRETATION AND BIOLOGICAL SIGNIFICANCE\n--------------------------------------------------------------------------------\n\n6.1 CD Fistula Epithelium Shows:\n- STRONG INTERFERON-GAMMA RESPONSE: Upregulation of ISG15, STAT1, GBP4\n- TNF-ALPHA/NF-kB ACTIVATION: Key inflammatory pathway in Crohn's disease\n- CHEMOKINE PRODUCTION: CCL11 (eotaxin), CXCL1/2 (neutrophil recruitment)\n- ACTIVATION MARKERS: CD69 indicates locally activated immune cells\n- WNT/BMP MODULATION: GREM1 upregulation affects stem cell niche\n- REDUCED EPITHELIAL DIFFERENTIATION: Loss of absorptive (SLC26A3) and\n  secretory (MUC2) epithelial programs\n\n6.2 Diverticular Epithelium Shows:\n- PRESERVED EPITHELIAL DIFFERENTIATION: Higher expression of:\n  * Absorptive markers: SLC26A3, CEACAM7\n  * Secretory markers: MUC2, MUC12, FCGBP\n  * General epithelial: EPCAM, EMP1\n- TISSUE REPAIR SIGNALING: CCN2, THBS1, GREM1\n- COAGULATION PATHWAY: May reflect tissue remodeling\n\n6.3 KEY DISTINCTION:\nCD Fistula epithelium is characterized by an INFLAMMATORY MICROENVIRONMENT\nwith active immune signaling (IFN-gamma, TNF-alpha) and LOSS of normal\nepithelial differentiation programs. This contrasts with Diverticular disease,\nwhich shows PRESERVED epithelial differentiation with tissue remodeling\nsignatures.\n\nThis pattern is consistent with CD fistula representing an active inflammatory\nprocess that disrupts normal epithelial function, while diverticular disease\nin the colon (without fistula) maintains more normal epithelial architecture.\n\n================================================================================\n", "Y": "================================================================================\nCOMPARATIVE ANALYSIS: CROHN'S FISTULA VS DIVERTICULAR FISTULA IN COLON SAMPLES\n================================================================================\n\n1. DATASET OVERVIEW\n================================================================================\n\nTwo spatial transcriptomics platforms were used:\n- Xenium 5100-plex: 1,860,368 cells, 5,100 genes\n- Xenium 480-plex: 6,334,604 cells, 471 genes\n\nColon sample composition:\n- 5100-plex COLON: 428,538 cells\n  - Crohn's FISTULA: 175,475 cells (40.9%)\n  - Healthy (HC): 253,063 cells (59.1%)\n\n- 480-plex COLON: 2,663,486 cells\n  - CD (Crohn's Disease): 1,709,005 cells (64.2%)\n  - DIVERTICULAR: 568,444 cells (21.3%)\n  - HEALTHY: 386,037 cells (14.5%)\n\nCD colon in 480-plex includes both fistulising (EXTERNAL: ENTERO/COLOCUTANEOUS: 374,698 cells)\nand non-fistulising (INTERNAL/SMALL/LARGE INTESTINE: 1,334,307 cells) patients.\n\nStatistical test (Chi-square): Crohn's fistula vs Diverticular proportions differ significantly\n(p < 2.2e-16), confirming distinct cellular architectures.\n\n2. CELL TYPE COMPOSITION DIFFERENCES\n================================================================================\n\n2.1 Major Differences in Cell Type Proportions (Crohn's Fistula vs Diverticular)\n\nCELL TYPE              Crohn's Fistula    Diverticular    Fold Change    Direction\n---------------------  ----------------   --------------  -----------    ------------------\nSquamous Epi2          2.44%              0.00%           244x           Enriched in Fistula\nErythroid              14.52%             0.00%           1452x          Enriched in Fistula\nNeutrophils            3.06%              0.00%           306x           Enriched in Fistula\nEndothelium            6.78%              0.00%           678x           Enriched in Fistula\nPericytes              3.89%              0.00%           389x           Enriched in Fistula\nMast cells             1.32%              0.00%           132x           Enriched in Fistula\nMyofibroblasts         1.07%              0.00%           107x           Enriched in Fistula\nPlatelets              0.97%              0.00%           97x            Enriched in Fistula\nGlia                   0.69%              0.00%           69x            Enriched in Fistula\nStromal 3 C7+          1.10%              0.00%           110x           Enriched in Fistula\nIL11+ cells            10.80%             5.18%           2.08x          Enriched in Fistula\nMyeloid                9.66%              4.80%           2.01x          Enriched in Fistula\nStromal 3 + 4          1.43%              0.44%           3.28x          Enriched in Fistula\nLymphatic              1.31%              2.11%           0.62x          Enriched in Diverticular\nStem/Undiff            1.82%              9.11%           0.20x          Enriched in Diverticular\nT-cells                6.47%              9.26%           0.70x          Enriched in Diverticular\nB-cells                2.49%              9.29%           0.27x          Enriched in Diverticular\nGoblets                3.64%              11.16%          0.33x          Enriched in Diverticular\nEnterocytes            0.22%              7.73%           0.03x          Enriched in Diverticular\nBEST4+ cells           0.67%              0.58%           1.14x          Similar\nPlasma cells           14.30%             18.79%          0.76x          Enriched in Diverticular\nStromal 1              1.41%              4.40%           0.32x          Enriched in Diverticular\nEECs                   0.10%              6.43%           0.02x          Enriched in Diverticular\nTuft cells             0.002%             0.08%           0.03x          Enriched in Diverticular\n\n2.2 Key Observations\n\nA. INFLAMMATORY INFILTRATE IN CROHN'S FISTULA:\n   - Markedly elevated Erythroid (14.5% vs 0%) - indicates hemorrhage/blood vessel disruption\n   - Neutrophils enriched 306x (3.1% vs 0%) - acute inflammation hallmark\n   - Mast cells enriched 132x (1.3% vs 0%) - immune activation\n   - Platelets enriched 97x (1.0% vs 0%) - coagulation/angiogenesis\n\nB. STROMAL REMODELING IN CROHN'S FISTULA:\n   - Myofibroblasts enriched 107x (1.1% vs 0%) - fibrosis signature\n   - Endothelium enriched 678x (6.8% vs 0%) - angiogenesis\n   - Pericytes enriched 389x (3.9% vs 0%) - vascular stabilization\n   - Stromal 3 C7+ enriched 110x (1.1% vs 0%) - inflammatory stromal population\n   - IL11+ cells enriched 2x (10.8% vs 5.2%) - IL11 signaling (fibrosis/inflammation)\n\nC. EPITHELIAL ARCHITECTURE IN DIVERTICULAR:\n   - Goblets enriched 3x in Diverticular (11.2% vs 3.6%)\n   - Enterocytes enriched 33x in Diverticular (7.7% vs 0.2%)\n   - EECs (Enteroendocrine cells) enriched 50x in Diverticular (6.4% vs 0.1%)\n   - Tuft cells enriched 33x in Diverticular (0.08% vs 0.002%)\n\nD. IMMUNE COMPOSITION:\n   - T-cells: Similar in Fistula (6.5%), higher in CD colon (12.4%), highest in Diverticular (9.3%)\n   - B-cells: Lower in Fistula (2.5%) vs Diverticular (9.3%)\n   - Plasma cells: Lower in Fistula (14.3%) vs Diverticular (18.8%)\n\n3. DIFFERENTIAL GENE EXPRESSION ANALYSIS\n================================================================================\n\n3.1 Crohn's Fistula vs Healthy Colon (5100-plex, whole tissue)\n\nTOP UPREGULATED GENES IN FISTULA:\n  Gene      Log2FC   p_val_adj    Function\n  MMP1      10.24    <2.2e-16     Matrix metalloproteinase (tissue remodeling)\n  COL5A2     7.74    <2.2e-16     Collagen type V alpha 2 chain\n  COL5A1     7.53    <2.2e-16     Collagen type V alpha 1 chain\n  THY1       7.42    <2.2e-16     Thy-1 cell surface antigen (fibroblast marker)\n  COL4A1     7.08    <2.2e-16     Collagen type IV alpha 1 (basement membrane)\n  MMP2       7.70    <2.2e-16     Matrix metalloproteinase 2 (collagen degradation)\n  GREM1      2.69    <2.2e-16     Gremlin 1 (BMP antagonist, fibrosis)\n  HOXB7      2.41    <2.2e-16     Homeobox gene (development/stemness)\n\nTOP DOWNREGULATED GENES IN FISTULA:\n  Gene      Log2FC   p_val_adj    Function\n  SELENBP1  -2.86    <2.2e-16     Selenium binding protein (epithelial)\n  KRT20     -3.01    <2.2e-16     Keratin 20 (enterocyte marker)\n  EPCAM     -1.04    <2.2e-16     Epithelial cell adhesion molecule\n  FCGBP     -1.00    <2.2e-16     Fc binding protein (goblet marker)\n  ACTN4     -2.16    <2.2e-16     Alpha-actinin 4 (epithelial)\n  PYGB      -2.33    <2.2e-16     Glycogen phosphorylase (epithelial)\n\n3.2 Stromal Cell DE (Fistula vs HC, 5100-plex)\n\nTOP UPREGULATED IN FISTULA:\n  Gene      Log2FC    Function\n  THY1      2.73      Fibroblast/myofibroblast marker\n  GREM1     2.69      BMP antagonist (fibrogenic)\n  HOXB7     2.29      Homeobox gene (development)\n\nTOP DOWNREGULATED IN FISTULA:\n  Gene       Log2FC    Function\n  C7        -3.24     Complement component 7\n  PER1      -3.19     Circadian clock gene\n  PTCH1     -2.05     Hedgehog pathway receptor\n  CSRP1     -1.84      Cysteine and glycine-rich protein\n  TNXB      -1.77      Tenascin XB (EC protein)\n\n3.3 Epithelial Cell DE (Fistula vs HC, 5100-plex)\n\nTOP UPREGULATED IN FISTULA:\n  Gene      Log2FC    Function\n  MMP1     10.24     Matrix metalloproteinase 1 (tissue remodeling)\n  MMP2      7.70     Matrix metalloproteinase 2\n  COL5A2    7.74     Collagen type V\n  THY1      7.42     Thy-1 (fibroblast contamination in epithelial subset)\n  COL5A1    7.53     Collagen type V\n  COL4A1    7.08     Collagen type IV (basement membrane)\n  MMP14     4.60     Matrix metalloproteinase 14\n\nTOP DOWNREGULATED IN FISTULA:\n  Gene      Log2FC    Function\n  KRT20    -3.01     Keratin 20 (enterocyte differentiation)\n  SELENBP1 -2.65     Selenium binding protein\n  ACTN4    -2.16     Alpha-actinin 4 (epithelial structure)\n  MVP      -2.16     Multidrug resistance-associated protein\n  PYGB     -2.33     Glycogen phosphorylase\n\n3.4 CD Colon vs Diverticular Colon (480-plex, whole tissue)\n\nKey findings:\n- STAT1 upregulated in CD (1.17 log2FC) - interferon signaling\n- CCL2 upregulated in CD (1.35 log2FC) - chemokine, monocyte recruitment\n- GBP4 upregulated in CD (1.47 log2FC) - guanylate binding protein (immune)\n- EGR1 upregulated in CD (1.07 log2FC) - early growth response\n\n4. PATHWAY AND BIOLOGICAL INTERPRETATION\n================================================================================\n\n4.1 CROHN'S FISTULA IS CHARACTERIZED BY:\n\nA. FIBROSIS AND TISSUE REMODELING:\n   - Upregulation of MMP1, MMP2, MMP14 (matrix degradation)\n   - Upregulation of COL5A1, COL5A2, COL4A1 (collagen deposition)\n   - GREM1 upregulation (BMP antagonism leading to fibrosis)\n   - THY1 upregulation (myofibroblast activation)\n   - Myofibroblast enrichment (107x vs diverticular)\n\nB. ANGIOGENESIS AND VASCULAR REMODELING:\n   - Endothelium enriched 678x vs diverticular\n   - Pericytes enriched 389x vs diverticular\n   - Platelets enriched 97x vs diverticular\n   - COL4A1 (basement membrane collagen) upregulated\n\nC. ACUTE INFLAMMATION:\n   - Neutrophils enriched 306x vs diverticular\n   - Mast cells enriched 132x vs diverticular\n   - Erythroid cells enriched 1452x (hemorrhage)\n   - CCL2, GBP4, STAT1 upregulated (CD vs diverticular)\n\nD. STROMAL ACTIVATION:\n   - IL11+ cells enriched 2x (IL11 signaling leading to fibrosis)\n   - Stromal 3 + 4 enriched 3x\n   - Stromal 3 (1) enriched 217x (inflammatory stromal)\n\n4.2 DIVERTICULAR IS CHARACTERIZED BY:\n\nA. PRESERVED EPITHELIAL DIFFERENTIATION:\n   - Goblets enriched 3x (mucus production)\n   - Enterocytes enriched 33x (absorptive epithelium)\n   - EECs enriched 50x (hormone-producing cells)\n   - Tuft cells enriched 33x (chemosensory)\n\nB. DIVERSIFIED IMMUNE RESPONSE:\n   - B-cells enriched 3.5x (humoral immunity)\n   - Plasma cells enriched 1.3x (antibody production)\n   - Lymphatic enriched 1.6x (lymphoid architecture)\n\nC. METABOLIC EPITHELIUM:\n   - BEST4+ cells enriched 2x (electrolyte transport)\n   - Stem/Undiff enriched 5x (regenerative capacity)\n\n5. SPATIAL AND BIOLOGICAL IMPLICATIONS\n================================================================================\n\n5.1 FISTULA PATHOGENESIS MECHANISM:\n\nThe data support a model where Crohn's fistula formation involves:\n1. Epithelial barrier disruption (loss of KRT20, EPCAM, goblet markers)\n2. Stromal activation (myofibroblasts, IL11+, GREM1)\n3. Fibrogenic signaling (MMPs, collagens, BMP antagonism)\n4. Angiogenesis (endothelium, pericytes, platelets)\n5. Acute inflammation (neutrophils, mast cells, erythroid)\n\n5.2 DIVERTICULAR VS CROHN'S FISTULA:\n\nDiverticular disease shows preserved colonic epithelial architecture with\nfunctional differentiation (goblets, enterocytes, EECs, tuft cells).\nImmune response is more balanced with B-cell/plasma cell involvement.\n\nIn contrast, Crohn's fistula shows:\n- Loss of epithelial differentiation\n- Dominance of stromal/fibrotic programs\n- Acute inflammatory infiltrate\n- Vascular proliferation\n- This is consistent with fistula pathology involving chronic inflammation,\n  tissue destruction, and aberrant wound healing.\n\n5.3 CLINICAL IMPLICATIONS:\n\nTargetable pathways in Crohn's fistula:\n- IL11 signaling (enriched IL11+ cells, GREM1)\n- MMP activity (MMP1, MMP2, MMP14 upregulated)\n- TGF-beta/BMP pathways (GREM1, PTCH1)\n- Angiogenesis (endothelium, pericytes enriched)\n\n================================================================================\nEND OF REPORT\n================================================================================\n"}, "semantic": {"executive_summary_x": {"bullets": ["Epithelial-focused DE analysis (480-plex, 120K subsampled cells)", "CD fistula defined by IFN-gamma and TNF-alpha/NF-kB pathway activation", "Diverticular retains epithelial differentiation (MUC2, SLC26A3, EPCAM)", "CD fistula upregulates chemokines (CCL11, CXCL1/2, CCL2) and ISGs", "Identifies 17 cell clusters but focuses on gene-level differences"]}, "executive_summary_y": {"bullets": ["Multi-platform analysis (5100-plex and 480-plex) with cell composition focus", "CD fistula shows massive stromal/vascular remodeling (endothelium 678x enriched)", "Diverticular preserves full epithelial lineage (goblets, enterocytes, EECs, tuft)", "Acute inflammation in fistula: neutrophils, mast cells, erythroid cells", "Proposes mechanistic fistula model: barrier breach to fibrosis to angiogenesis"]}, "shared_points": [{"topic": "CD fistula shows inflammatory/immune activation vs diverticular", "x_text": "IFN-gamma response, TNF-alpha/NF-kB signaling pathways significantly enriched in CD fistula epithelium", "y_text": "STAT1, CCL2, GBP4 upregu ": "Cell type composition analysis with fold-change enrichments", "text": "Quantitative cell type proportion comparison showing massive enrichments in CD fistula: endothelium (678x), pericytes (389x), neutrophils (306x), erythroid (1452x), myofibroblasts (107x), mast cells (132x), platelets (97x)"}, {"topic": "Angiogenesis and vascular remodeling in fistula", "text": "Endothelium enriched 678x, pericytes 389x, platelets 97x in CD fistula vs diverticular, indicating active neovascularization and vascular stabilization as key fistula features"}, {"topic": "Erythroid cells indicate hemorrhage in fistula", "text": "Erythroid cells constitute 14.5% in fistula vs 0% in diverticular (1452x enrichment), indicating blood vessel disruption and hemorrhage"}, {"topic": "IL11+ cells enriched in CD fistula (pro-fibrotic signaling)", "text": "IL11+ cells enriched 2.08x in fistula (10.8% vs 5.2%), linking IL11 signaling to fibrosis and inflammation in fistula pathogenesis"}, {"topic": "Dual-platform comparison (5100-plex and 480-plex)", "text": "Uses both Xenium 5100-plex (428K colon cells, 5100 genes) and 480-plex (2.66M colon cells) for complementary analyses with different gene coverage"}, {"topic": "Collagen deposition signature (COL5A1, COL5A2, COL4A1)", "text": "Massive upregulation of collagen genes (COL5A2: 7.74, COL5A1: 7.53, COL4A1: 7.08 log2FC) in fistula vs healthy, showing active ECM deposition alongside degradation"}, {"topic": "THY1 as myofibroblast activation marker", "text": "THY1 (Thy-1) upregulated 7.42 log2FC in fistula vs healthy and 2.73 in stromal cells, marking myofibroblast activation"}, {"topic": "Enteroendocrine and tuft cell depletion in fistula", "text": "EECs depleted 50x and tuft cells 33x in fistula vs diverticular, indicating loss of chemosensory and hormonal epithelial lineages beyond just absorptive/secretory"}, {"topic": "B-cell and plasma cell enrichment in diverticular", "text": "B-cells 3.5x enriched and plasma cells 1.3x enriched in diverticular vs fistula, suggesting more organized humoral/adaptive immune response rather than innate"}, {"topic": "Stem/undifferentiated cells preserved in diverticular", "text": "Stem/Undiff cells 5x enriched in diverticular (9.1% vs 1.8%), indicating preserved regenerative capacity in diverticular vs depleted stem cell niche in fistula"}, {"topic": "Mechanistic model of fistula pathogenesis (5-step)", "text": "Proposes sequential model: (1) epithelial barrier disruption, (2) stromal activation, (3) fibrogenic signaling, (4) angiogenesis, (5) acute inflammation"}, {"topic": "Stromal cell-specific DE analysis (fistula vs healthy)", "text": "Separate DE for stromal compartment showing C7 downregulation (-3.24), PER1 circadian clock loss (-3.19), and PTCH1 Hedgehog receptor loss (-2.05) in fistula"}, {"topic": "Circadian clock disruption (PER1) in fistula stroma", "text": "PER1 downregulated -3.19 log2FC in fistula stromal cells, suggesting circadian rhythm disruption in the fibrotic microenvironment"}, {"topic": "HOXB7 developmental gene upregulated in fistula", "text": "HOXB7 upregulated 2.41 log2FC in fistula indicating reactivation of developmental/stemness programs in the diseased tissue"}]}, "neutral_summary": {"X": "BIOLOGICAL FINDINGS SUMMARY\n\nAnalysis of 6.33 million cells from Xenium 480-plex spatial transcriptomics data, focusing on 2.14 million epithelial cells in colon samples, reveals fundamental differences between Crohn's disease fistula and diverticular disease at the molecular level.\n\nKey Findings:\n\n- CD fistula epithelium shows strong upregulation of interferon-gamma response genes: PTGDS (log2FC=1.65, 26.6% vs 14.8%), ISG15 (log2FC=1.60), STAT1 (log2FC=0.80, 30.1% vs 21.3%), and GBP4 (log2FC=0.93)\n- Neutrophil chemoattractants CXCL1 (log2FC=0.78) and CXCL2 (log2FC=0.82) are elevated in CD fistula, along with monocyte chemoattractant CCL2 (log2FC=0.80)\n- The immune activation marker CD69 is upregulated (log2FC=1.54, 11.2% vs 4.9%) in CD fistula\n- BMP antagonist GREM1 (log2FC=0.65, 27.2% vs 19.2%) affects stem cell niche regulation\n- Matrix metalloproteinase MMP1 (log2FC=1.04) indicates active tissue remodeling\n- Diverticular epithelium preserves differentiation markers: MUC12 (log2FC=-1.84, 12.9% vs 27.0%), SLC26A3 (log2FC=-1.71), EPCAM (log2FC=-0.88, 17.5% vs 27.2%), MUC2 (log2FC=-0.95)\n- Pathway enrichment confirms IFN-gamma response (padj=0.0057) and TNF-alpha/NF-kB signaling (padj=0.0057) as significantly upregulated in CD fistula\n\nBiological Interpretation:\n\nThe CD fistula epithelial microenvironment is dominated by active Th1-mediated inflammatory signaling, with coordinated interferon-gamma and TNF-alpha/NF-kB pathway activation. This drives chemokine production that recruits neutrophils and monocytes to the tissue, creating a self-amplifying inflammatory loop. The simultaneous upregulation of GREM1, an antagonist of BMP signaling, suggests disruption of the normal epithelial stem cell niche, which may impair regenerative capacity.\n\nIn contrast, diverticular disease maintains a fundamentally intact epithelial differentiation program. The preservation of absorptive markers (SLC26A3, CEACAM7), secretory markers (MUC2, MUC12), and general epithelial adhesion molecules (EPCAM, EMP1) indicates that the basic tissue architecture remains functional. The trend-level enrichment of EMT and coagulation pathways in diverticular tissue (padj=0.103) suggests tissue remodeling activity but without the destructive inflammatory cascade seen in CD fistula.\n\nThe key biological distinction is that CD fistula represents an active inflammatory process that fundamentally disrupts normal epithelial differentiation and function, while diverticular disease preserves colonic epithelial architecture despite ongoing structural changes. This difference has direct implications for understanding why fistula formation occurs specifically in Crohn's disease rather than in other colonic pathologies.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nComprehensive spatial transcriptomics analysis across two platforms (5100-plex: 1.86M cells; 480-plex: 6.33M cells) reveals that Crohn's disease fistula and diverticular disease represent fundamentally different pathological processes in the colon, distinguished by dramatic differences in cellular composition, gene expression, and tissue architecture.\n\nKey Findings:\n\n- Crohn's fistula shows massive enrichment of inflammatory and stromal cell types: erythroid cells (14.5% vs 0%, 1452x enrichment), neutrophils (3.1% vs 0%, 306x), endothelium (6.8% vs 0%, 678x), myofibroblasts (1.1% vs 0%, 107x), and pericytes (3.9% vs 0%, 389x)\n- IL11+ cells are enriched 2-fold in fistula (10.8% vs 5.2%), representing a pro-fibrotic signaling population\n- Matrix metalloproteinases are dramatically upregulated in fistula: MMP1 (log2FC=10.24), MMP2 (log2FC=7.70), MMP14 (log2FC=4.60)\n- Collagen deposition genes are highly expressed: COL5A2 (log2FC=7.74), COL5A1 (log2FC=7.53), COL4A1 (log2FC=7.08)\n- Fibroblast activation marker THY1 shows log2FC=7.42; BMP antagonist GREM1 shows log2FC=2.69\n- Diverticular disease preserves epithelial architecture: enterocytes enriched 33x, goblets 3x, enteroendocrine cells 50x, tuft cells 33x relative to fistula\n- Enterocyte marker KRT20 is strongly downregulated in fistula (log2FC=-3.01)\n\nBiological Interpretation:\n\nThe data reveal that Crohn's fistula pathogenesis follows a coordinated multi-step process: epithelial barrier disruption (loss of KRT20, EPCAM, goblet cell markers), followed by stromal activation involving myofibroblasts and IL11+ cells, then fibrogenic signaling through MMPs and collagens with simultaneous BMP antagonism via GREM1. This is accompanied by active angiogenesis (endothelium and pericyte expansion) and acute inflammatory infiltration (neutrophils, mast cells).\n\nThe concurrent upregulation of both matrix-degrading enzymes (MMPs) and collagen deposition indicates active tissue remodeling rather than simple destruction. The GREM1/BMP axis antagonism and THY1-positive myofibroblast activation point toward a self-sustaining fibrotic loop that maintains the fistula tract structure.\n\nDiverticular disease, by contrast, maintains all major epithelial lineages including functional absorptive, secretory, chemosensory, and enteroendocrine cell populations. The immune response is more balanced with B-cell and plasma cell involvement rather than the neutrophilic/stromal dominance seen in fistula. This preservation of tissue architecture explains why diverticular disease typically does not progress to fistula formation despite localized structural changes."}}, {"id": "Q6", "type": "comparison", "text": "How does the location of fistula affect the inflammatory signature?", "responses": {"X": "================================================================================\nANALYSIS: How Does Fistula Location Affect the Inflammatory Signature?\n================================================================================\n\n1. DATASET OVERVIEW\n================================================================================\n\n- Xenium 480-plex spatial transcriptomics: 6,334,604 cells, 541 genes\n  (subsampled to 250,000: 50,000 per fistula type)\n- Xenium 5100-plex spatial transcriptomics: 1,860,368 cells, 5,100 genes\n- Fistula types: DIVERTICULAR (618K), EXTERNAL: ENTERO/COLOCUTANEOUS (932K),\n  EXTERNAL: PERI-ANAL (603K), INTERNAL/SMALL/LARGE INTESTINE (3.1M),\n  NOT FISTULISING (1.0M)\n- Tissue locations: COLON (2.7M), ILEUM (2.5M), ILEUM/COLON (330K),\n  JEJUNAL (232K), PERIANAL (603K)\n\n================================================================================\n2. KEY FINDINGS: INFLAMMATORY SIGNATURE BY FISTULA LOCATION\n================================================================================\n\n2.1 MYELOID INFLAMMATION\n------------------------\n  Fistula Location        | Avg Myeloid Expression | Relative Level\n  ------------------------|-----------------------|----------------\n  Enterocutaneous         | 31,280                | HIGHEST\n  Internal                | 27,555                | HIGH\n  Diverticular            | 26,525                | HIGH\n  Peri-anal               | 25,108                | MODERATE\n  Non-fistulising         | 18,635                | LOWEST\n\nFistulising disease (especially enterocutaneous fistulas) shows markedly elevated\nmyeloid inflammatory signatures (~1.7x higher than non-fistulising CD).\n\nIndividual myeloid markers:\n- LYZ (Lysozyme): Highest in Diverticular (105,748), followed by Internal (97,967)\n- CD14: Highest in Internal (15,926), followed by Enterocutaneous (13,752)\n- FCGR3A: Highest in Enterocutaneous (12,988) and Internal (11,483)\n- MMP9: Highest in Enterocutaneous (15,625) and Internal (11,757)\n\n2.2 LYMPHOID SIGNATURE\n----------------------\n  Fistula Location        | Avg Lymphoid Expression | Relative Level\n  ------------------------|------------------------|----------------\n  Peri-anal               | 14,233                 | HIGHEST\n  Internal                | 6,703                  | HIGH\n  Enterocutaneous         | 6,562                  | HIGH\n  Non-fistulising         | 5,238                  | MODERATE\n  Diverticular            | 4,673                  | LOWEST\n\nPeri-anal fistulas show a dramatically elevated lymphoid signature (~2.7x higher\nthan Diverticular), with prominent T-cell and B-cell involvement.\n\nIndividual lymphoid markers:\n- CD4 (Helper T cells): Highest in Peri-anal (12,074), Internal (8,311)\n- CD8A (Cytotoxic T cells): Highest in Peri-anal (5,638) and Internal (4,005)\n- CD3D (Pan-T cell): Highest in Peri-anal (11,366)\n- CD79A (B cell): Dramatically elevated in Peri-anal (44,316) - 4x higher\n- MS4A1 (CD20, B cell): Highest in Peri-anal (17,919)\n\n2.3 CYTOTOXIC/NK CELL SIGNATURE\n-------------------------------\n  Fistula Location        | Avg Cytotoxic Expression | Relative Level\n  ------------------------|------------------------|----------------\n  Peri-anal               | 2,979                  | HIGHEST\n  Internal                | 2,061                  | HIGH\n  Non-fistulising         | 1,932                  | MODERATE\n  Enterocutaneous         | 1,653                  | MODERATE\n  Diverticular            | 1,318                  | LOWEST\n\n2.4 INNATE IMMUNITY\n-------------------\n  Fistula Location        | Avg Innate Expression | Relative Level\n  ------------------------|----------------------|----------------\n  Enterocutaneous         | 35,057               | HIGHEST\n  Internal                | 31,707               | HIGH\n  Diverticular            | 31,160               | HIGH\n  Peri-anal               | 29,235               | MODERATE\n  Non-fistulising         | 22,584               | LOWEST\n\n================================================================================\n3. DIFFERENTIAL EXPRESSION ANALYSIS\n================================================================================\n\nTop markers for each fistula location group (vs. all others):\n\nEnterocutaneous: SOCS3, CXCL8, CXCL5, EGR1, MMP1\n  - CXCL8 (IL-8): Strong neutrophil chemoattractant\n  - CXCL5: Neutrophil recruitment\n  - SOCS3: JAK/STAT pathway regulation\n\nPeri-anal: STAT1, THBS1, S100A4, PIGR, CXCL14\n  - STAT1: Interferon response, adaptive immunity\n  - S100A4: Fibroblast activation\n  - PIGR: Polymeric Ig receptor (mucosal immunity)\n\nInternal: SOCS3, MMP1, CXCL5, CXCL8, S100A4\n  - Similar to Enterocutaneous but with higher S100A4\n\nDiverticular: THBS1, STAT1, FKBP5, MUC12, EMP1\n  - THBS1: Thrombospondin-1 (angiogenesis, tissue remodeling)\n  - FKBP5: Stress response\n\nNon-fistulising: ANXA2, S100A10, EMP1, CXCL14, PIGR\n  - ANXA2: Annexin A2 (membrane dynamics, inflammation resolution)\n\n================================================================================\n4. CLUSTER PROPORTIONS BY FISTULA TYPE\n================================================================================\n\n17 clusters identified. Key observations:\n\nCluster 14:\n  - Peri-anal: 13.9% (STRONGLY ENHANCED)\n  - All other locations: 0.1-1.7%\n\nCluster 3:\n  - Peri-anal: 15.2% (ENHANCED)\n  - Other locations: 5.9-7.7%\n\n================================================================================\n5. SYNTHESIS: INFLAMMATORY SIGNATURE GRADIENT\n================================================================================\n\n1. ENTEROCUTANEOUS FISTULAS:\n   - MOST MYELOID: Highest neutrophil/macrophage signature\n   - Strong CXCL8/CXCL5 expression leading to neutrophil recruitment\n   - High MMP9 for tissue remodeling/degradation\n   - Signature: \"Neutrophilic/Myeloid-dominant inflammation\"\n\n2. INTERNAL FISTULAS:\n   - High myeloid and lymphoid signatures\n   - Mixed innate and adaptive immune response\n   - High CD14+ monocyte infiltration\n   - Signature: \"Mixed myeloid-lymphoid inflammation\"\n\n3. PERI-ANAL FISTULAS:\n   - MOST LYMPHOID: Dramatic B-cell (CD79A, MS4A1) and T-cell (CD3D, CD4) enrichment\n   - Highest cytotoxic/NK cell activity\n   - STAT1-driven interferon response\n   - PIGR elevation for mucosal immune activation\n   - Signature: \"Lymphoid/cytotoxic-dominant inflammation\"\n\n4. NON-FISTULISING CD:\n   - LOWEST overall inflammatory signatures\n   - Most \"resolved\" or less active disease state\n   - Signature: \"Quiescent/low-grade inflammation\"\n\n5. DIVERTICULAR DISEASE:\n   - Intermediate myeloid signatures\n   - Lowest lymphoid and cytotoxic signatures\n   - THBS1/FKBP5 enrichment for tissue remodeling/stress\n   - Signature: \"Metabolic/stress-dominant profile\"\n\n================================================================================\n6. CONCLUSIONS\n================================================================================\n\n1. Myeloid signature is HIGHEST in fistulising disease (Enterocutaneous > Internal\n   > Diverticular) and LOWEST in non-fistulising disease.\n\n2. Lymphoid signature is HIGHEST in Peri-anal fistulas (2.7x higher than\n   Diverticular), suggesting a distinct immune mechanism with prominent B-cell\n   and T-cell involvement.\n\n3. Cytotoxic/NK cell activity follows a similar pattern to lymphoid markers,\n   with Peri-anal fistulas showing the highest levels.\n\n4. The inflammatory gradient:\n   NON-FISTULISING < DIVERTICULAR < ENTEROCUTANEOUS ~ INTERNAL < PERI-ANAL\n\n5. Fistula type-specific therapeutic targets:\n   - Enterocutaneous: Target neutrophil recruitment (CXCL8/CXCL5 axis)\n   - Peri-anal: Target B-cell/T-cell interactions and cytotoxic pathways\n   - Internal: Mixed approach targeting both myeloid and lymphoid pathways\n\n================================================================================\n", "Y": "================================================================================\nANSWER: How does the location of fistula affect the inflammatory signature?\n================================================================================\n\nEXECUTIVE SUMMARY\n=================\nFistula location profoundly shapes the inflammatory microenvironment in Crohn's\ndisease. Perianal fistulas exhibit a distinctly MORE MYELOID and MORE PLASMA-\nCELL-RICH inflammatory signature compared to internal fistulas. External fistulas\n(entero/colocutaneous) also show elevated myeloid infiltration compared to\ninternal fistulas. Internal fistulas are more lymphoid-dominant with higher\nT-cell and B-cell proportions. This myeloid bias is statistically significant\n(p < 2.2e-16) and consistent across both the 480-plex Visium (6.3M cells) and\n5100-plex Xenium (1.9M cells) datasets.\n\n================================================================================\nKEY FINDINGS\n================================================================================\n\n1. PERIANAL FISTULAS ARE MYELOID-ENRICHED\n-----------------------------------------\nPerianal fistulas show the highest myeloid cell infiltration among all fistula\nlocations, with a ~1.4-fold increase in myeloid+plasma cells compared to\ninternal fistulas.\n\n  Myeloid (Level 3: Myeloid) proportions:\n  - Perianal:          10.33%\n  - Internal fistula:   7.51%\n  - External fistula:  10.96%\n  - Diverticular:       4.92%\n  - Not fistulising:    2.95%\n\n  Plasma cell proportions:\n  - Perianal:          24.18%\n  - Internal fistula:  19.49%\n  - External fistula:  14.94%\n  - Diverticular:      18.93%\n  - Not fistulising:   17.73%\n\n  Combined Myeloid+Plasma (myeloid-like signature):\n  - Perianal:          34.51%\n  - Internal fistula:  27.00%\n  - External fistula:  25.90%\n  - Diverticular:      23.85%\n  - Not fistulising:   20.68%\n\n  Statistical significance:\n  Chi-square test: Myeloid-like vs FISTULA_TYPE2\n  Chi-square = 40839.06, p < 2.2e-16 (highly significant)\n\n2. PERIANAL FISTULAS SHOW ELEVATED LYMPHATIC INFILTRATION\n---------------------------------------------------------\n  Lymphatic proportions:\n  - Perianal:          5.12%\n  - Internal fistula:  4.12%\n  - External fistula:  2.49%\n  - Diverticular:      2.12%\n  - Not fistulising:   2.99%\n\n3. INTERNAL FISTULAS ARE MORE LYMPHOID-DOMINANT\n------------------------------------------------\n  T-cell proportions:\n  - Internal fistula:  12.79% (HIGHEST)\n  - Not fistulising:   11.85%\n  - Perianal:           9.72%\n  - External fistula:   8.01% (LOWEST)\n\n  B-cell proportions:\n  - Internal fistula:  12.37% (HIGHEST)\n  - Perianal:          10.64%\n  - External fistula:  10.47%\n\n4. MYELOID/LYMPHOID RATIO VARIES DRAMATICALLY BY FISTULA TYPE\n-------------------------------------------------------------\n  Fistula Type                    Myeloid%  Lymphoid%  ML Ratio\n  ---------------------------------------------------------------\n  Perianal                         34.51     49.66     0.695\n  Internal (small/large intestine) 27.00     48.77     0.554\n  External (entero/colocutaneous)  25.90     35.91     0.721\n  Diverticular                     23.85     40.28     0.592\n  Not fistulising                  20.68     43.06     0.480\n\n5. ANATOMICAL LOCATION ALSO MATTERS (COLON vs ILEUM vs PERIANAL)\n----------------------------------------------------------------\n  Myeloid proportions by anatomical location:\n  - Perianal:     10.33% (HIGHEST)\n  - Jejunum:       9.18%\n  - Ileum/COLON:  10.03%\n  - Ileum:         7.64%\n  - Colon:         5.75% (LOWEST)\n\n  Chi-square test: Myeloid-like vs LOCATION\n  Chi-square = 29703.54, p < 2.2e-16 (highly significant)\n\n6. 5100-PLEX XENIUM DATA CONFIRMS MYELOID ENRICHMENT IN FISTULA TISSUE\n----------------------------------------------------------------------\n  Myeloid + Plasma + Neutrophils proportions:\n  - FISTULA:    39.28% (HIGHEST - myeloid dominant)\n  - ULCER:      26.52%\n  - HC:         12.84% (LOWEST - lymphoid dominant)\n\n  Myeloid/Lymphoid ratio:\n  - FISTULA:    1.622 (MYELOID DOMINANT)\n  - ULCER:      0.879\n  - HC:         0.814 (LYMPHOID DOMINANT)\n\n================================================================================\nDIFFERENTIAL GENE EXPRESSION: PERIANAL vs INTERNAL FISTULAS (480-plex)\n================================================================================\n\nTop genes UP in Perianal fistulas (myeloid-enriched):\n  THBS1: log2FC = 1.46, pct.1 = 40.2%, pct.2 = 22.4%\n  EGR1: log2FC = 1.33, pct.1 = 29.1%, pct.2 = 17.5%\n  C7: log2FC = 4.34, pct.1 = 11.5%, pct.2 = 1.0%\n  FOSB: log2FC = 1.68, pct.1 = 19.7%, pct.2 = 9.2%\n  GREM1: log2FC = 1.43, pct.1 = 26.1%, pct.2 = 15.7%\n  CXCL2: log2FC = 1.84, pct.1 = 14.2%, pct.2 = 6.1%\n  FCGR3B: log2FC = 1.03, pct.1 = 24.3%, pct.2 = 15.6%\n  ITGAX: log2FC = 1.05, pct.1 = 21.8%, pct.2 = 13.5%\n  FCGR3A: log2FC = 1.20, pct.1 = 17.1%, pct.2 = 10.0%\n  CD14: log2FC = 0.87, pct.1 = 22.7%, pct.2 = 15.5%\n  CD163: log2FC = 0.83, pct.1 = 25.8%, pct.2 = 19.0%\n  CCL2: log2FC = 0.97, pct.1 = 14.2%, pct.2 = 9.5%\n\nTop genes UP in Internal fistulas (lymphoid/enriched):\n  CD79A: log2FC = -1.25, pct.1 = 14.4%, pct.2 = 28.0%\n  CD27: log2FC = -1.48, pct.1 = 10.1%, pct.2 = 24.2%\n  MZB1: log2FC = -1.08, pct.1 = 15.9%, pct.2 = 29.5%\n  KRT17: log2FC = -6.09, pct.1 = 0.7%, pct.2 = 14.0%\n  WNT5A: log2FC = -2.01, pct.1 = 4.2%, pct.2 = 16.5%\n  ANXA2: log2FC = -1.21, pct.1 = 39.0%, pct.2 = 61.9%\n\nKnown immune marker gene expression (Perianal vs Internal):\n\nMyeloid markers (all UP in Perianal):\n  CXCL2: log2FC = 1.84, padj = 0\n  FCGR3A: log2FC = 1.20, padj = 0\n  CD14: log2FC = 0.87, padj = 0\n  MMP9: log2FC = 0.59, padj = 0\n  LYZ: log2FC = 0.32, padj = 0\n\nLymphoid markers (all DOWN in Perianal):\n  CD27: log2FC = -1.48, padj = 0\n  CD79A: log2FC = -1.25, padj = 0\n  CD3D: log2FC = -0.50, padj = 0\n  CD4: log2FC = -0.20, padj = 2.96e-291\n\nCytotoxic markers: None detected as differentially expressed\n\n================================================================================\nCOMPLETE CELL TYPE PROPORTION TABLE (480-plex Visium)\n================================================================================\n\nCell Type               DIVERTICULAR  EXTERNAL-ENTERO  PERIANAL  INTERNAL  NOT-FISTUL  COLON  ILEUM\n----------------------------------------------------------------------------------------------------------------------\nMyeloid                     4.92          10.96         10.33      7.51        2.95    5.75   7.64\nPlasma                     18.93          14.94         24.18     19.49       17.73   18.27  18.38\nT-cells                     9.41           8.01          9.72     12.79       11.85   11.40  11.81\nB-cells                     9.82          10.47         10.64     12.37       10.49   10.33  12.01\nLymphatic                   2.12           2.49          5.12      4.12        2.99    3.30   3.50\nStromal 1                   4.15           4.12          5.79      3.40        7.26    4.65   4.55\nEnterocytes                 8.19           6.60          8.71      7.15        6.99    7.12   7.13\nGoblets                    10.72
