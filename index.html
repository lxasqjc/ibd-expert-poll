xtracellular Traps (NETs) containing citrullinated histones cluster at the epithelial-stromal interface, releasing IL-1β and TNF-α that damage host tissue and activate fibroblasts\n- FoxP3+ Treg frequency is reduced in fistula tissue compared to non-fistulizing CD or healthy mucosa, and remaining Tregs undergo instability conversion to Th17-like cells driven by high IL-6 and IL-1β\n- Macrophages remain in an M1-like or intermediate state producing TNF-α, IL-1β, and IL-6, failing to transition to the M2 pro-repair phenotype\n- Persistent expression of CXCL8 (IL-8), CCL2, and CCL20 maintains chemokine gradients that recruit and retain neutrophils and Th17 cells\n- Fibroblasts activate into α-SMA+ myofibroblasts with excessive collagen deposition, creating rigid avascular scaffolds that impede epithelial migration\n- HIF-1α target genes are upregulated in fistula tract cores, indicating hypoxia that inhibits collagenase activity and impairs healing\n- Spatial organization reveals pro-inflammatory cytokine gradients (IL-17, TNF-α) radiating from the fistula lumen outward, with Tregs sparse or absent in the core\n\nBiological Interpretation:\nThe failure of fistula healing in Crohn's Disease is fundamentally a breakdown of the wound healing cycle at multiple levels. In normal tissue repair, inflammation is transient and transitions through orderly phases of proliferation and remodeling. In fistulizing disease, the immune response becomes self-sustaining and spatially compartmentalized within the fistula tract. The Th1/Th17 polarization, sustained by dendritic cell-derived IL-23, produces cytokines that drive epithelial barrier dysfunction while simultaneously recruiting additional myeloid cells. This creates a feed-forward loop where tissue damage generates danger signals that further amplify inflammation.\n\nThe stromal compartment contributes equally to healing failure. TGF-β-driven myofibroblast activation produces disorganized extracellular matrix rather than functional repair tissue, creating a fibrotic barrier that prevents epithelial cell migration. The fistula epithelium itself is abnormal, lacking proper tight junctions and exhibiting dysplastic features. Continuous bacterial colonization of the tract stimulates epithelial toll-like receptors, preventing the transition to a quiescent reparative state. Hypoxia within the tract further limits the energy-intensive processes required for cell migration and organized angiogenesis.\n\nThe spatial architecture of the fistula tract is itself pathogenic. It creates a biochemical niche isolated from systemic healing signals, maintaining high local concentrations of pro-inflammatory mediators while excluding regulatory cell populations. Strong epithelial-fibroblast crosstalk mediated through TGF-β, WNT, and NOTCH signaling pathways perpetuates the aberrant tissue state. This multi-layered failure involving immune dysregulation, fibrotic remodeling, epithelial dysfunction, and spatial compartmentalization explains why therapies targeting inflammation alone are insufficient, and why combination approaches addressing both immunity and fibrosis are required for fistula closure."}}, {"id": "Q10", "type": "hypothesis", "text": "Each system was asked to propose novel research directions for Crohn's disease fistula from the spatial transcriptomics data. Review their proposals below.", "responses": {"X": "===============================================================================\nANSWER: Novel Research Directions for Fistulizing Crohn's Disease\n===============================================================================\n\nOVERVIEW:\nBased on extensive spatial transcriptomic data (~8M+ cells across two platforms\nand scRNA-seq reference), five concrete research directions are proposed that\nmove beyond the established fibroblast/epithelial/macrophage axes to explore\nmetabolic reprogramming, neuro-immune interactions, vascular remodeling, and\nspatial niche architecture in fistulizing CD pathology.\n\n===============================================================================\n1. METABOLIC COUPLING AND LACTATE-SHARING IN THE FISTULA NICHE\n===============================================================================\n\nRationale:\nFistulizing CD is characterized by chronic hypoxia and intense glycolytic\nactivity. The metabolic microenvironment that sustains inflammatory states\nhas not been explicitly addressed. Mapping metabolic gene expression relative\nto immune and structural cells can reveal critical dependencies.\n\nSpecific Questions:\n- Is there evidence of metabolic symbiosis between highly glycolytic\n  neutrophils/macrophages and oxidative fibroblasts/epithelial cells?\n  Specifically, do fistula-associated fibroblasts upregulate MCT4 (lactate\n  exporter) while adjacent epithelial or endothelial cells upregulate MCT1\n  (lactate importer)?\n- How does the expression of HIF-1a target genes (e.g., LDHA, PKM2, VEGFA)\n  correlate with spatial proximity to necrotic cores or hypoxic zones\n  identified by low oxygenation markers?\n- Are there distinct mitochondrial dysfunction signatures in epithelial cells\n  at the fistula tract interface compared to healthy mucosa, and does this\n  correlate with impaired barrier function markers (TJP1, OCLN)?\n\nKey Markers/Pathways:\n- Glycolysis: LDHA, HK2, PFKL, PKM2\n- Lactate Transport: SLC16A3 (MCT4), SLC16A1 (MCT1)\n- Hypoxia: HIF1A, VEGFA, BNIP3\n- Mitochondria: NDUFA4, COX subunits, TFAM\n\n===============================================================================\n2. NEURO-IMMUNE-ENDOTHELIAL CROSSTALK IN FISTULA INNERVATION\n===============================================================================\n\nRationale:\nFistulizing CD is increasingly recognized as a neuro-immune disorder. Aberrant\ninnervation and neurotrophic signaling drive pain, motility issues, and\npotentially fibrosis. This axis is largely unexplored in standard IBD spatial\nstudies.\n\nSpecific Questions:\n- What is the spatial distribution of enteric nervous system (ENS) components\n  (neurons, glia, Schwann cells) in fistula tracts vs. healthy tissue? Is\n  there denervation or hyperinnervation?\n- Do fistula-associated fibroblasts or macrophages express neurotrophic\n  factors (e.g., NGF, BDNF, GDNF) that spatially co-localize with neuronal\n  markers (SNAP25, SYT1, CHAT)?\n- Is there evidence of neuro-immune synapses where sensory neurons (TRPV1+\n  or CGRP+) are in direct contact with mast cells or macrophages, suggesting\n  direct modulation of inflammation by neural activity?\n\nKey Markers/Pathways:\n- Neuronal: SNAP25, SYT1, CHAT, TH (tyrosine hydroxylase), TPH1 (serotonin)\n- Glial/Schwann: S100B, GFAP, SOX10\n- Neurotrophic: NGF, BDNF, GDNF\n- Sensory: TRPV1, CALCA (CGRP)\n\n===============================================================================\n3. VASCULAR REMODELING AND ANGIOGENIC SIGNALING HUBS\n===============================================================================\n\nRationale:\nFistula formation requires robust angiogenesis to support the high metabolic\ndemand of chronic inflammation and tissue repair. However, the vasculature in\nCD is often leaky and dysfunctional. The molecular drivers of vascular\npathology in fistulizing CD are underexplored.\n\nSpecific Questions:\n- What are the pro-angiogenic signaling hubs in fistula tissue? Do specific\n  fibroblast subtypes (e.g., TWIST1+ or MYH11+?) express VEGFA, PDGFB, or\n  ANGPT2 and spatially interact with endothelial cells?\n- Is there evidence of arteriovenous shunting or abnormal vessel maturation?\n  Do endothelial cells in fistula tracts express markers of immaturity\n  (ACKR1, HEY1) or dysfunction (SELE, ICAM1)?\n- How does the lymphatic system respond? Are there lymphatic endothelial\n  cells (LYVE1, PROX1) in fistula tracts, and do they co-localize with\n  immune cell infiltration sites?\n\nKey Markers/Pathways:\n- Angiogenesis: VEGFA, VEGFC, PDGFB, ANGPT2, TIE2 (TEK)\n- Endothelial Activation: SELE, ICAM1, VCAM1, PECAM1 (CD31)\n- Lymphatics: LYVE1, PROX1, FLT4 (VEGFR3)\n- Pericyte/Smooth Muscle: ACTA2, TAGLN, MYH11\n\n===============================================================================\n4. STROMAL-EPITHELIAL-MESENCHYMAL TRANSITION (SEMT) AND EPITHELIAL PLASTICITY\n===============================================================================\n\nRationale:\nThe concept of SEMT (a hybrid state where epithelial cells retain some\nepithelial markers while gaining mesenchymal traits) is critical in fistula\nformation. This state is associated with tissue repair but can lead to fibrosis\nif unresolved.\n\nSpecific Questions:\n- Can we identify SEMT intermediate states in the epithelium at the fistula\n  margin? Do these cells co-express EPCAM (epithelial) and VIM (vimentin)\n  or ACTA2?\n- What are the inducers of SEMT in the spatial context? Are these epithelial\n  cells in direct contact with TWIST1+ fibroblasts or specific macrophage\n  subsets?\n- Does SEMT correlate with stemness? Do SEMT cells upregulate LGR5, ASCL2,\n  or OLFM4, suggesting a hijacking of regenerative programs that leads to\n  pathological remodeling?\n\nKey Markers/Pathways:\n- Epithelial: EPCAM, KRT8/18, MUC2\n- Mesenchymal: VIM, ACTA2, COL1A1, FN1\n- Stemness: LGR5, ASCL2, SOX9, OLFM4\n- EMT/SEMT Transcription Factors: TWIST1, SNAI1, ZEB1, FOXC2\n\n===============================================================================\n5. SPATIAL ARCHITECTURE OF IMMUNE NICHES AND TERTIARY LYMPHOID STRUCTURES (TLS)\n===============================================================================\n\nRationale:\nThe spatial organization of adaptive immune responses is key. Tertiary Lymphoid\nStructures (TLS) are ectopic lymphoid aggregates that form in chronic\ninflammation and are prognostic markers. Their presence, maturity, and spatial\nrelationship to fistula tracts are underexplored.\n\nSpecific Questions:\n- Are Tertiary Lymphoid Structures (TLS) present in fistula tracts? If so,\n  are they mature (with germinal centers, CD20+, AID+, FOXP3+) or immature?\n- How do TLS spatially relate to fistula tracts? Are they adjacent to the\n  tract (suggesting local antigen presentation) or distant?\n- What is the cellular composition of TLS in fistulizing CD vs.\n  non-fistulizing CD? Are there specific B-cell subsets (e.g., plasma cells,\n  MZB1+) or T-cell zones (CXCL13+, PD1+) that are enriched in\n  fistula-associated TLS?\n\nKey Markers/Pathways:\n- B-cell Zones: CD20 (MS4A1), PAX5, BCL6, AICDA (AID)\n- T-cell Zones: CD3D, CXCL13, PD1, TCF7\n- Follicular Dendritic Cells: FDCS, CCL19, CCL21\n- Plasma Cells: MZB1, JCHAIN, IGKC\n\n===============================================================================\nSUMMARY TABLE\n===============================================================================\n\nDirection | Core Biological Concept       | Relevance to Fistula\n----------|-------------------------------|------------------------------------------\n1         | Lactate sharing, HIF-1a       | Sustains chronic inflammation & hypoxia\n2         | Neurotrophic signaling        | Drives pain, fibrosis, immune modulation\n3         | Angiogenesis & leakiness      | Supports high metabolic demand of fistula\n4         | Hybrid epithelial-mesenchymal | Links repair to pathological fibrosis\n5         | Ectopic lymphoid organization | Local adaptive immune response & prognosis\n", "Y": "# Novel Research Directions for Crohn's Disease Fistula Formation\n# Based on scRNA-seq, Visium, and Xenium Spatial Transcriptomics Data\n# Generated: 2026-08-09\n# Questions Q1-Q11 are EXCLUDED from these proposals\n\n================================================================================\nDATA INVENTORY SUMMARY\n================================================================================\n\nXENIUM 5100-PLEX (1,860,368 cells, 5,100 genes):\n  - 19 samples from RUN1/2/3 across SLIDE1/2\n  - 2 tissue locations: ILEUM, COLON\n  - 32 cell types at Level 3 (T-cells, Myeloid, Stromal subtypes, Plasma,\n    Glia, Mast, Erythroid, Endothelium, Pericytes, Neutrophils, B-cells,\n    Enterocytes, IL11+ fibroblasts, Myofibroblasts, etc.)\n  - 27 clusters (XENIUM_snn)\n  - Spatial coordinates (x, y) for every cell\n  - Predicted cell type scores\n\nXENIUM 480-PLEX (6,334,604 cells, 471 genes):\n  - 41 unique patients\n  - 5 locations: COLON, ILEUM, PERIANAL, JEJUNAL, ILEUM/COLON\n  - 5 fistula types: EXTERNAL (enterocutaneous/perianal), INTERNAL (small/large intestine),\n    DIVERTICULAR, NOT FISTULISING\n  - 4 epithelial statuses: SQUAMOUS & COLUMNAR, COLUMNAR, Non-Epi, SQUAMOUS\n  - Linked VISIUM_SLIDE_ID and VISIUM_PATIENT_ID for cross-modal integration\n  - Cell type annotations at Level 0-3\n\nscRNA-seq REFERENCE (24,094 cells, 17,709 genes):\n  - 24 runs, 26 donors\n  - Disease states: CD (Fistulating, Inflammatory, Strictured), HC (Healthy Control)\n  - 32 cell types\n  - FULL TCR SEQUENCING: t_clonotype_id, t_cdr3s_aa, t_cdr3s_nt, t_inkt_evidence,\n    t_mait_evidence, hasTCR, nChains_TRA, nChains_TRB\n  - HTO antibody hashing for multiplexing\n  - Epithelium + neutrophils included\n\nVISIUM SPATIAL TRANSCRIPTOMICS (93,075 spots, 3,083 genes):\n  - 34 patients\n  - 4 diseases: CD, NON-CD, DIVERTICULAR, HEALTHY\n  - 5 epithelial statuses: Non-Epi, Squamous, Columnar, Columnar + Squamous\n  - 11 FinalBroadClusterGroups: Hemorrhage, Fistula-Associated Stroma 1/2, Stroma,\n    Immune-rich, Lymphoid Follicles, Squamous Epithelium, Neural Plexus, Muscularis,\n    Columnar Epithelium\n  - 15 MetaClusters\n  - Spatial coordinates (row, col)\n  - CD_SUBTYPE: FISTULATING, NON-CD, INFLAMMATORY, STRICTURING\n\n================================================================================\nNOVEL RESEARCH DIRECTIONS (Q12+)\n================================================================================\n\n--------------------------------------------------------------------------------\nQ12: Neural Plexus Remodeling and Enteric Neuropathy in Fistula Formation\n--------------------------------------------------------------------------------\n\n(a) Hypothesis:\n  Fistula formation in Crohn's disease is accompanied by aberrant neural remodeling,\n  where the enteric nervous system undergoes pathological changes including nerve\n  fiber hypertrophy, altered neurotransmitter profiles, and aberrant innervation of\n  fibrotic tissue. The \"Neural Plexus\" cluster in Visium and \"Glia\" cells in Xenium\n  represent a previously unexplored dimension of fistula biology that may drive or\n  respond to fistulisation.\n\n(b) Supporting Data:\n  - Visium has a dedicated \"Neural Plexus\" FinalBroadClusterGroup and \"Neural Plexus\"\n    in BroadClusterGroup, present across multiple patients and fistula types\n  - Xenium 5100-plex has \"Glia\" as a Level 3 cell type annotation\n  - Xenium 480-plex has spatial coordinates enabling neural-stromal-epithelial\n    spatial relationship mapping\n  - The neural plexus annotation is present in both fistulising and non-fistulising\n    samples, allowing comparison\n\n(c) Biological Significance:\n  - Neurogenic inflammation is a recognized but understudied driver of IBD pathogenesis\n  - Enteric neuropathy may explain why fistulas fail to heal (altered motility,\n    sensory feedback, neurotransmitter-mediated immune modulation)\n  - Neural-stromal interactions could reveal novel therapeutic targets beyond\n    immunosuppression\n  - This represents a completely new axis of fistula biology not covered by Q1-Q11\n\n--------------------------------------------------------------------------------\nQ13: T Cell Clonotype Dynamics and Tissue-Resident Memory Formation in Fistula\n--------------------------------------------------------------------------------\n\n(a) Hypothesis:\n  Fistula formation in Crohn's disease is driven by expansion of tissue-resident\n  memory T cell (TRM) clones that accumulate in the fistula tract and resist\n  immunosuppressive therapy. The TCR repertoire in fistulising tissue shows\n  oligoclonal expansion of pathogenic T cell clones that are spatially organized\n  within fistula microenvironments.\n\n(b) Supporting Data:\n  - scRNA-seq reference has COMPLETE TCR sequencing data for every T cell:\n    t_clonotype_id, t_cdr3s_aa, t_cdr3s_nt, t_frequency, t_proportion,\n    t_inkt_evidence, t_mait_evidence, hasTCR, nChains_TRA, nChains_TRB\n  - 24,094 cells with disease states (Fistulating, Inflammatory, Strictured, HC)\n  - Xenium provides single-cell resolution of T cell spatial locations\n  - Visium provides spatial context of T cell-enriched regions\n  - Multiple patients and disease states available for clonal comparison\n\n(c) Biological Significance:\n  - Tissue-resident memory T cells are increasingly recognized as drivers of\n    chronic inflammation and treatment resistance in IBD\n  - Understanding clonal dynamics could explain why some fistulas become chronic\n    while others resolve\n  - TCR clonotype analysis could identify biomarkers for fistulising disease\n  - This leverages the unique TCR data in the scRNA-seq reference, which is\n    completely unexplored in Q1-Q11\n\n--------------------------------------------------------------------------------\nQ14: Lymphoid Neogenesis and Ectopic Lymphoid Structure Organization in Fistula\n--------------------------------------------------------------------------------\n\n(a) Hypothesis:\n  Ectopic lymphoid structures (ELS) form in the fistula tract and serve as\n  organized sites of local immune activation, antigen presentation, and antibody\n  production. The \"Follicular\" and \"Lymphoid Follicles\" clusters in Visium represent\n  structured lymphoid neogenesis that correlates with fistula severity and chronicity.\n\n(b) Supporting Data:\n  - Visium has dedicated \"Follicular\" (BroabClusterGroup) and \"Lymphoid Follicles\"\n    (FinalBroadClusterGroup) annotations\n  - \"Ig++\" cluster in BroadClusterGroup2 suggests Ig-producing plasma cells\n  - Xenium 5100-plex has \"Plasma\" and \"B-cells\" as Level 3 cell types\n  - \"Immune-rich\" cluster in Visium may contain organized lymphoid structures\n  - Multiple patients with varying disease severity allow correlation analysis\n\n(c) Biological Significance:\n  - Ectopic lymphoid structures are increasingly recognized in IBD but their role\n    in fistulisation is unknown\n  - ELS may serve as local factories for pathogenic antibody production\n  - Lymphoid organization could explain regional variation in fistula behavior\n  - This represents a completely unexplored dimension of fistula immunology\n\n--------------------------------------------------------------------------------\nQ15: Cross-Modal Integration of Single-Cell Resolution with Spatial Context\n--------------------------------------------------------------------------------\n\n(a) Hypothesis:\n  Integrating single-cell resolution data with spatial transcriptomics\n  enables reconstruction of complete fistula microenvironments at unprecedented\n  resolution. The VISIUM_SLIDE_ID linkage between the 480-plex and Visium datasets\n  enables direct cross-modal validation and spatial deconvolution of cell type\n  neighborhoods in fistula tissue.\n\n(b) Supporting Data:\n  - Xenium 480-plex has VISIUM_SLIDE_ID and VISIUM_PATIENT_ID linking to Visium\n  - Xenium 480-plex has 6.3M cells with 471 genes (focused panel)\n  - Visium has 93,075 spots with 3,083 genes and spatial coordinates\n  - Both datasets have matching patient metadata (DISEASE, EPI_STATUS, FISTULA_TYPE)\n  - Xenium 5100-plex has 1.86M cells with 5,100 genes for deeper molecular profiling\n\n(c) Biological Significance:\n  - This is a methodological breakthrough that leverages the unique cross-modal\n    data structure\n  - Enables validation of spatial findings across two complementary technologies\n  - Provides the most complete spatial map of fistula microenvironment to date\n  - Not addressed by Q1-Q11 which focus on single-modality analyses\n\n--------------------------------------------------------------------------------\nQ16: Epithelial Metaplasia Trajectory and Squamous Metaplasia in Fistula\n--------------------------------------------------------------------------------\n\n(a) Hypothesis:\n  Fistula epithelialisation follows a trajectory of progressive metaplasia from\n  normal columnar epithelium through intermediate states to squamous epithelium.\n  The \"SQUAMOUS & COLUMNAR\" and \"SQUAMOUS\" epithelial statuses represent distinct\n  metaplastic states with different molecular programs, immune interactions, and\n  healing potentials. Squamous metaplasia in fistula represents a maladaptive\n  response rather than true healing.\n\n(b) Supporting Data:\n  - Xenium 480-plex has 4 EPI_STATUS categories: SQUAMOUS & COLUMNAR, COLUMNAR,\n    Non-Epi, SQUAMOUS - representing a metaplastic continuum\n  - Visium has EPI_STATUS2 with same 4 categories\n  - Visium has \"Squamous Epithelium\" and \"Columnar Epithelium\" as separate\n    FinalBroadClusterGroups\n  - Xenium 5100-plex has \"Enterocytes\" as epithelial cell type\n  - 41 patients with varying epithelial statuses allow trajectory analysis\n\n(c) Biological Significance:\n  - Squamous metaplasia in fistula is a clinical observation with unknown molecular\n    basis\n  - Understanding metaplasia trajectory could identify targets to promote true\n    healing (columnar restoration) vs maladaptive squamous coverage\n  - This builds on Q4/Q7 but focuses specifically on the metaplastic trajectory\n    and its clinical implications\n\n--------------------------------------------------------------------------------\nQ17: Myeloid Cell Heterogeneity and Monocyte-to-Macrophage Differentiation\n     Trajectories in Fistula Microenvironments\n--------------------------------------------------------------------------------\n\n(a) Hypothesis:\n  The myeloid compartment in fistula tissue exhibits extreme heterogeneity with\n  distinct monocyte-derived macrophage subsets that occupy specific spatial niches\n  within the fistula. Pathogenic myeloid subsets in fistula show impaired\n  efferocytosis, altered lipid metabolism, and unique chemokine profiles that\n  sustain chronic inflammation and tissue remodeling.\n\n(b) Supporting Data:\n  - Xenium 5100-plex has \"Myeloid\" as a Level 3 cell type with subtypes\n  - Xenium 480-plex has \"Myeloid\" annotations across 41 patients\n  - Visium \"Immune-rich\" clusters contain myeloid-enriched regions\n  - scRNA-seq reference includes neutrophils\n  - Spatial coordinates enable niche-specific myeloid characterization\n\n(c) Biological Significance:\n  - Myeloid cells are central to fistula pathogenesis but their heterogeneity\n    is poorly understood\n  - Niche-specific myeloid states could explain regional variation in fistula behavior\n  - Targeting specific myeloid subsets could be more effective than broad\n    immunosuppression\n  - This complements Q11 (macrophage state) but provides a broader myeloid\n    perspective including monocytes, dendritic cells, and neutrophils\n\n--------------------------------------------------------------------------------\nQ18: Vascular Remodeling and Angiogenesis in Fistula Formation\n--------------------------------------------------------------------------------\n\n(a) Hypothesis:\n  Fistula formation is accompanied by aberrant angiogenesis and vascular remodeling\n  that creates specialized microvascular niches supporting chronic inflammation.\n  Distinct endothelial and pericyte subsets occupy different vascular niches within\n  the fistula, with pathogenic vascular programs driving sustained inflammation\n  and impaired healing.\n\n(b) Supporting Data:\n  - Xenium 5100-plex has \"Endothelium\" and \"Pericytes\" as Level 3 cell types\n  - Xenium 480-plex has endothelial and pericyte annotations\n  - Visium \"Hemorrhage\" cluster suggests vascular pathology\n  - Spatial coordinates enable vascular architecture analysis\n  - Multiple patients allow comparison of vascular patterns\n\n(c) Biological Significance:\n  - Vascular remodeling in IBD fistula is clinically observed but mechanistically\n    uncharacterized\n  - Aberrant angiogenesis may sustain chronic inflammation by providing sustained\n    immune cell recruitment\n  - Vascular targets could complement immunosuppressive therapy\n  - This represents a completely unexplored dimension of fistula biology\n\n================================================================================\n"}, "neutral_summary": {"X": "BIOLOGICAL FINDINGS SUMMARY\n\nAnalysis of extensive spatial transcriptomic data (~8M+ cells) from fistulizing Crohn's disease tissue identifies five unexplored biological axes that extend beyond the established fibroblast/epithelial/macrophage paradigm, revealing metabolic, neural, vascular, plasticity, and immunological dimensions of fistula pathobiology.\n\nKey Findings:\n\n- Metabolic symbiosis likely sustains the fistula niche: chronic hypoxia drives intense glycolysis in neutrophils and macrophages (LDHA, HK2, PKM2), while adjacent fibroblasts and epithelial cells may import lactate via MCT1/MCT4 coupling, creating a self-reinforcing metabolic microenvironment with mitochondrial dysfunction at the barrier interface\n- Neuro-immune crosstalk represents an underappreciated disease axis: enteric nervous system components (neurons, glia, Schwann cells) may undergo denervation or hyperinnervation in fistula tracts, with fibroblasts and macrophages producing neurotrophic factors (NGF, BDNF, GDNF) that could establish neuro-immune synapses driving pain, fibrosis, and sustained inflammation\n- Vascular remodeling with dysfunctional angiogenesis supports fistula persistence: pro-angiogenic signaling hubs (VEGFA, PDGFB, ANGPT2) from specific fibroblast subtypes may drive immature, leaky vessel formation with impaired pericyte coverage, while lymphatic responses (LYVE1, PROX1) co-localizing with immune infiltrates suggest drainage dysfunction\n- Stromal-epithelial-mesenchymal transition (SEMT) intermediate states at fistula margins represent a pathological hijacking of regeneration: epithelial cells co-expressing EPCAM with VIM/ACTA2 may be induced by contact with TWIST1+ fibroblasts, with concurrent upregulation of stemness markers (LGR5, ASCL2, OLFM4) linking aberrant repair to progressive fibrosis\n- Tertiary lymphoid structures (TLS) of varying maturity likely form within or adjacent to fistula tracts, with specific B-cell (MZB1+ plasma cells) and T-cell (CXCL13+, PD1+) enrichment patterns that may determine whether local adaptive immunity promotes resolution or perpetuates chronicity\n\nBiological Interpretation:\n\nFistulizing Crohn's disease appears to establish a self-sustaining pathological ecosystem driven by interlocking metabolic, neural, and vascular circuits. The chronic hypoxic environment generates a metabolic gradient where glycolytic immune cells export lactate that is consumed by oxidative stromal populations, creating an energy-sharing network that perpetuates inflammation without requiring external metabolic input. Simultaneously, aberrant neurotrophic signaling establishes neuro-immune interfaces that amplify pain perception and inflammatory drive through direct neural modulation of macrophage and mast cell activity, representing a feed-forward loop between tissue damage and neural sensitization.\n\nThe vascular architecture of the fistula tract reflects a state of pathological angiogenesis characterized by immature, leaky vessels that fail to achieve proper stabilization. This vascular dysfunction serves dual pathological roles: it sustains the metabolic demands of chronically activated immune populations while contributing to tissue edema and impaired healing. The lymphatic system's response, potentially co-localized with immune infiltration, may further compromise tissue drainage and antigen clearance.\n\nAt the cellular level, epithelial plasticity through SEMT creates a population of hybrid cells at fistula margins that have activated mesenchymal programs while retaining epithelial identity. This transition, likely induced by direct stromal contact and inflammatory signals, co-opts regenerative stemness pathways toward pathological tissue remodeling and fibrosis. The concurrent formation of tertiary lymphoid structures suggests that the fistula tract generates sufficient antigen stimulation to drive local adaptive immune organization, with the maturity and composition of these structures potentially determining disease trajectory. Together, these five axes define fistulizing CD as a complex multicellular ecosystem where metabolic, neural, vascular, plasticity, and immunological programs converge to create a chronic, self-perpetuating disease state.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n\n- Q12: Enteric neural remodeling accompanies fistula formation in Crohn's disease, with glial cells and neural plexus regions present in both fistulising and non-fistulising tissue, suggesting neurogenic inflammation as a previously unexplored driver of fistula pathogenesis.\n\n- Q13: Tissue-resident memory T cell clones undergo oligoclonal expansion in fistulising tissue, with complete T cell receptor repertoire data revealing clonotype dynamics that may explain treatment resistance and fistula chronicity.\n\n- Q14: Ectopic lymphoid structures form within fistula tracts, with organized follicular regions and immunoglobulin-producing plasma cell clusters suggesting local sites of antigen presentation and pathogenic antibody production that correlate with disease severity.\n\n- Q15: Cross-modal integration of single-cell resolution data (1.86M and 6.3M cells) with spatial transcriptomics (93,075 spots) from linked patient samples enables reconstruction of complete fistula microenvironments at unprecedented cellular and spatial resolution.\n\n- Q16: Epithelial metaplasia in fistula tissue follows a trajectory from columnar through mixed intermediate states to squamous epithelium, with 41 patients showing distinct metaplastic categories that represent a continuum from adaptive healing to maladaptive tissue coverage.\n\n- Q17: The myeloid compartment in fistula tissue shows extreme heterogeneity, with distinct monocyte-derived macrophage subsets occupying specific spatial niches and exhibiting impaired efferocytosis, altered lipid metabolism, and unique chemokine profiles that sustain chronic inflammation.\n\n- Q18: Aberrant angiogenesis and vascular remodeling create specialized microvascular niches in fistula tissue, with distinct endothelial and pericyte subsets occupying different vascular compartments and hemorrhagic regions indicating vascular pathology.\n\nBiological Interpretation:\n\nThese seven research directions collectively reveal that Crohn's disease fistula formation is not merely an immunological phenomenon but a multi-system tissue remodeling process involving the enteric nervous system, adaptive immune memory, organized lymphoid neogenesis, epithelial fate decisions, myeloid differentiation, and vascular architecture. The enteric nervous system appears to undergo pathological remodeling during fistulisation, with potential consequences for motility, sensory feedback, and neurotransmitter-mediated immune modulation. Simultaneously, the adaptive immune system establishes both clonally expanded tissue-resident memory T cells and organized ectopic lymphoid structures that may function as local factories for sustained immune activation.\n\nThe epithelial compartment reveals a metaplastic continuum rather than a binary healed/unhealed state, suggesting that squamous metaplasia represents a maladaptive tissue response rather than true mucosal restoration. This is accompanied by profound myeloid heterogeneity, where distinct macrophage subsets occupy niche-specific positions within the fistula architecture and maintain chronic inflammation through impaired clearance mechanisms and sustained chemokine production. The vascular system undergoes concurrent remodeling that likely supports immune cell recruitment and tissue perfusion changes.\n\nCritically, these biological axes interact: neural-immune crosstalk, lymphoid-stromal support networks, vascular-immune recruitment circuits, and epithelial-stromal signaling all converge within the fistula microenvironment. The dataset spanning 41 patients across five fistula types and four disease states, with nearly 8.3 million spatially resolved cells and complete T cell receptor sequencing, provides unprecedented power to dissect these interactions and identify which cellular programs distinguish fistulas that become chronic from those that resolve."}}]};
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbx7e1t1YF9wub7e61n99-RgM-EWtYkyQdG75V_O6W-g-qqcrm1NqNOh8ciYyqQPyymc6A/exec";
const LS_KEY = "ibd_expert_poll_v4";

  reviewer_name: "",

// ---- Helpers ----
function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function evalCriteriaHTML() {
  return '<div class="eval-criteria">' +
    '<strong>Novelty</strong> &mdash; Are the findings non-trivial? Do they offer insights similar to <a href="https://www.nature.com/articles/s41586-025-09744-y" target="_blank" style="color:#3182ce;">our Nature fistula paper</a>? (vs generic textbook knowledge)<br>' +
    '<strong>Groundedness</strong> &mdash; Are the findings specific to what can be found using data in our paper?<br>' +
    '<strong>Factfulness</strong> &mdash; Are the biological claims correct? Are findings supported by evidence?' +
    '</div>';
}

// ---- Init ----
function init() {
  loadFromLocalStorage();
  buildTabs();
  buildLanding();
  buildQuestions();
  buildFinalQuestions();
  buildProfile();
  if (state.started) {
    showTab("Q1");
  } else {
    showTab("landing");
  }
  updateProgress();
  startAutosave();
  if (state.reviewer_email) loadFromBackend(state.reviewer_email);
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) Object.assign(state, JSON.parse(saved));
  } catch(e) {}
}

function saveToLocalStorage() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
}

function showAutosaveIndicator(msg) {
  const el = document.getElementById("autosaveIndicator");
  el.textContent = msg || "Saved";
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}

// ---- Tabs ----
function buildTabs() {
  const container = document.getElementById("tabsContainer");
  let html = '<button class="tab-btn" data-tab="landing">Start</button>';
  data.questions.forEach((q) => {
    const label = q.type === "hypothesis" ? "Q10 (Hyp)" : q.id;
    html += '<button class="tab-btn" data-tab="' + q.id + '">' + label + '</button>';
  });
  html += '<button class="tab-btn" data-tab="final">Final</button>';
  html += '<button class="tab-btn" data-tab="profile">Submit</button>';
  container.innerHTML = html;
  container.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => showTab(btn.dataset.tab));
  });
}

function showTab(tabId) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  const content = document.getElementById("tab-" + tabId);
  if (content) content.classList.add("active");
  const btn = document.querySelector('.tab-btn[data-tab="' + tabId + '"]');
  if (btn) btn.classList.add("active");
  updateTabStyles();
  window.scrollTo(0, 0);
}

function updateTabStyles() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    const tabId = btn.dataset.tab;
    if (tabId === "landing" || tabId === "profile" || tabId === "final") return;
    const ans = state.answers[tabId];
    if (ans && isQuestionComplete(tabId, ans)) {
      btn.classList.add("completed");
    } else {
      btn.classList.remove("completed");
    }
  });
}

function isQuestionComplete(qId, ans) {
  if (!ans) return false;
  const q = data.questions.find(x => x.id === qId);
  if (!q) return false;
  if (q.type === "comparison") {
    return ans.preference && ans.confidence !== undefined && ans.confidence !== null;
  }
  if (q.type === "hypothesis") {
    return ans.proposals_x && ans.proposals_y &&
      Object.keys(ans.proposals_x).length > 0 && Object.keys(ans.proposals_y).length > 0;
  }
  return false;
}

  data.questions.forEach(q => {
    if (isQuestionComplete(q.id, state.answers[q.id])) done++;
  });
  const pct = Math.round((done / total) * 100);

  document.getElementById("progressText").textContent = pct + "% complete (" + done + "/" + total + " questions)";

function highlightTermsInText(text, sharedPoints) {
  if (!sharedPoints || sharedPoints.length === 0) return escapeHtml(text);
  var terms = [];
  sharedPoints.forEach(function(sp) {
    var words = sp.topic.split(/[\s\/,]+/).filter(function(w) { return w.length > 3; });
    words.forEach(function(w) { if (terms.indexOf(w) === -1) terms.push(w); });
  });
  terms.sort(function(a, b) { return b.length - a.length; });
  var escaped = escapeHtml(text);
  terms.forEach(function(term) {
    var re = new RegExp('\\b(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')\\b', 'gi');
    escaped = escaped.replace(re, '<span class="highlight-term">$1</span>');
  });
  return escaped;
}

function splitNeutralSummary(text) {
  var interpIdx = text.indexOf("Biological Interpretation:");
  if (interpIdx === -1) return { keyFindings: "", interpretation: text };
  var kfRaw = text.slice(0, interpIdx);
  var interp = text.slice(interpIdx + "Biological Interpretation:".length).trim();
  kfRaw = kfRaw.replace(/^BIOLOGICAL FINDINGS SUMMARY\s*\n*/, "").replace(/^Key Findings:\s*\n?/, "").trim();
  return { keyFindings: kfRaw, interpretation: interp };
}

function parseProposals(text, arm) {
  var proposals = [];
  var lines = text.split("\n");
  var currentTitle = "";
  var currentBody = "";
  var inProposal = false;

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var numMatch = line.match(/^(\d+)\.\s+([A-Z][A-Z\s\-\/(),&:]+)/);
    var qMatch = line.match(/^(Q\d+):\s*(.+)/);
    var propMatch = line.match(/^(?:PROPOSAL|Hypothesis|Direction)\s+(\d+)[:\-]\s*(.+)/i);

    if (numMatch && numMatch[2].length > 8) {
      if (inProposal) proposals.push({title: currentTitle, body: currentBody.trim()});
      currentTitle = numMatch[1] + ". " + numMatch[2].trim();
      currentBody = "";
      inProposal = true;
    } else if (qMatch) {
      if (inProposal) proposals.push({title: currentTitle, body: currentBody.trim()});
      currentTitle = qMatch[1] + ": " + qMatch[2].trim();
      currentBody = "";
      inProposal = true;
    } else if (propMatch) {
      if (inProposal) proposals.push({title: currentTitle, body: currentBody.trim()});
      currentTitle = "Proposal " + propMatch[1] + ": " + propMatch[2].trim();
      currentBody = "";
      inProposal = true;
    } else if (inProposal) {
      if (!/^[=\-]{5,}$/.test(line.trim())) {
        currentBody += line + "\n";
      }
    }
  }
  if (inProposal) proposals.push({title: currentTitle, body: currentBody.trim()});

  if (proposals.length === 0) {
    var count = arm === "X" ? 5 : 7;
    for (var j = 0; j < count; j++) {
      proposals.push({title: "Proposal " + (j+1), body: ""});
    }
  }

  // Truncate body for display
  proposals.forEach(function(p) {
    if (p.body.length > 300) {
      p.body = p.body.substring(0, 300) + "...";
    }
  });
  return proposals;
}

  html += '<div class="rating-grid">';

  }
  html += '</div></div>';
  html += '<div class="rating-cell"><p>Groundedness (0=generic, 10=specific to our data)</p><div class="score-row" style="margin-bottom:0;">';
  for (var i = 0; i <= 10; i++) {
    html += '<button class="score-btn sm ' + (pa.groundedness===i?"selected":"") + '" data-q="' + qId + '" data-prop="' + key + '" data-field="groundedness" data-val="' + i + '">' + i + '</button>';

  html += '</div></div>';
  html += '<div class="rating-cell"><p>Feasibility (0=impossible on our data, 10=highly feasible)</p><div class="score-row" style="margin-bottom:0;">';
  for (var i = 0; i <= 10; i++) {
    html += '<button class="score-btn sm ' + (pa.feasibility===i?"selected":"") + '" data-q="' + qId + '" data-prop="' + key + '" data-field="feasibility" data-val="' + i + '">' + i + '</button>';
  }
  html += '</div></div></div>';

  // 2-column checkboxes
  html += '<div class="checkbox-grid">';
  html += '<label><input type="checkbox" name="worth-' + qId + '-' + key + '" ' + (pa.worth_investigating?"checked":"") + '> <strong>Worth investigating</strong></label>';
  html += '<label><input type="checkbox" name="investigating-' + qId + '-' + key + '" ' + (pa.already_investigating?"checked":"") + '> <strong>Already investigating</strong></label>';
  html += '</div>';

  // Per-proposal confidence
  html += '<div class="rating-cell" style="margin-bottom:10px;"><p>Confidence in your assessment (0=guess, 10=certain)</p><div class="score-row" style="margin-bottom:0;">';
  for (var i = 0; i <= 10; i++) {
    html += '<button class="score-btn sm ' + (pa.confidence===i?"selected":"") + '" data-q="' + qId + '" data-prop="' + key + '" data-field="confidence" data-val="' + i + '">' + i + '</button>';
  }
  html += '</div></div>';

  // Comment
  html += '<textarea class="reasoning-textarea" data-q="' + qId + '" data-prop="' + key + '" data-field="comment" placeholder="Your reasons for this judgement (optional)" style="min-height:40px;">' + escapeHtml(pa.comment||"") + '</textarea>';
  html += '</div>';
  return html;
}

// ---- Event Attachment ----
function attachQuestionEvents() {
  // Nav buttons (use data-target instead of inline onclick)
  document.querySelectorAll('.nav-btn').forEach(function(btn) {
    btn.addEventListener("click", function() {
      showTab(btn.dataset.target);
    });
  });

  // View Full buttons
  document.querySelectorAll('.btn-view-full').forEach(function(btn) {
    btn.addEventListener("click", function() {
      openModal(btn.dataset.q, btn.dataset.arm);
    });
  });


  // Preference radios
  document.querySelectorAll('input[name^="pref-"]').forEach(function(r) {
    r.addEventListener("change", function(e) {
      var qId = e.target.name.replace("pref-", "");
      if (!state.answers[qId]) state.answers[qId] = {};
      state.answers[qId].preference = e.target.value;
      saveToLocalStorage();
      updateProgress();
      updateTabStyles();
    });
  });

  // Score buttons (comparison confidence - no data-prop)
  document.querySelectorAll('.score-btn[data-q][data-field="confidence"]:not([data-prop])').forEach(function(btn) {
    btn.addEventListener("click", function() {
      var qId = btn.dataset.q;
      var val = parseInt(btn.dataset.val);
      if (!state.answers[qId]) state.answers[qId] = {};
      state.answers[qId].confidence = val;
      btn.parentElement.querySelectorAll(".score-btn").forEach(function(b) { b.classList.remove("selected"); });
      btn.classList.add("selected");
      saveToLocalStorage();
      updateProgress();
      updateTabStyles();
    });
  });

  // Reasoning textareas (no data-prop)
  document.querySelectorAll('.reasoning-textarea[data-q]:not([data-prop])').forEach(function(ta) {
    ta.addEventListener("input", function() {
      var qId = ta.dataset.q;
      if (!state.answers[qId]) state.answers[qId] = {};
      state.answers[qId].reasoning = ta.value;
      saveToLocalStorage();
    });
  });

  // Proposal score buttons
  document.querySelectorAll('.score-btn[data-prop]').forEach(function(btn) {
    btn.addEventListener("click", function() {
      var qId = btn.dataset.q;
      var prop = btn.dataset.prop;
      var field = btn.dataset.field;
      var val = parseInt(btn.dataset.val);
      if (!state.answers[qId]) state.answers[qId] = { proposals_x: {}, proposals_y: {} };
      var isX = prop.startsWith("x_");
      var bucket = isX ? "proposals_x" : "proposals_y";
      if (!state.answers[qId][bucket]) state.answers[qId][bucket] = {};
      if (!state.answers[qId][bucket][prop]) state.answers[qId][bucket][prop] = {};
      state.answers[qId][bucket][prop][field] = val;
      btn.parentElement.querySelectorAll(".score-btn").forEach(function(b) { b.classList.remove("selected"); });
      btn.classList.add("selected");
      saveToLocalStorage();
      updateProgress();
      updateTabStyles();
    });
  });

  // Proposal checkboxes
  document.querySelectorAll('input[name^="worth-"]').forEach(function(cb) {
    cb.addEventListener("change", function(e) {
      var parts = e.target.name.replace("worth-", "").split("-");
      var qId = parts[0];
      var prop = parts.slice(1).join("-");
      ensureProposalState(qId, prop);
      var bucket = prop.startsWith("x_") ? "proposals_x" : "proposals_y";
      state.answers[qId][bucket][prop].worth_investigating = e.target.checked;
      saveToLocalStorage();
      updateProgress();
      updateTabStyles();
    });
  });
  document.querySelectorAll('input[name^="investigating-"]').forEach(function(cb) {
    cb.addEventListener("change", function(e) {
      var parts = e.target.name.replace("investigating-", "").split("-");
      var qId = parts[0];
      var prop = parts.slice(1).join("-");
      ensureProposalState(qId, prop);
      var bucket = prop.startsWith("x_") ? "proposals_x" : "proposals_y";
      state.answers[qId][bucket][prop].already_investigating = e.target.checked;
      saveToLocalStorage();
      updateProgress();
      updateTabStyles();
    });
  });

  // Proposal comment textareas
  document.querySelectorAll('.reasoning-textarea[data-prop]').forEach(function(ta) {
    ta.addEventListener("input", function() {
      var qId = ta.dataset.q;
      var prop = ta.dataset.prop;
      ensureProposalState(qId, prop);
      var bucket = prop.startsWith("x_") ? "proposals_x" : "proposals_y";
      state.answers[qId][bucket][prop].comment = ta.value;
      saveToLocalStorage();
    });
  });

  // Save Progress buttons
  document.querySelectorAll('.save-progress-btn').forEach(function(btn) {
    btn.addEventListener("click", function() {
      saveToLocalStorage();
      sendToBackend("partial");
      btn.textContent = "Saved!";
      btn.style.background = "#276749";
      setTimeout(function() { btn.textContent = "Save Progress"; btn.style.background = "#38a169"; }, 2000);
    });
  });
}

function ensureProposalState(qId, prop) {
  if (!state.answers[qId]) state.answers[qId] = { proposals_x: {}, proposals_y: {} };
  var bucket = prop.startsWith("x_") ? "proposals_x" : "proposals_y";
  if (!state.answers[qId][bucket]) state.answers[qId][bucket] = {};
  if (!state.answers[qId][bucket][prop]) state.answers[qId][bucket][prop] = {};
}

// ---- Modal ----
function openModal(qId, arm) {
  var q = data.questions.find(function(x) { return x.id === qId; });
  if (!q) return;
  var text = arm === "X" ? q.responses.X : q.responses.Y;
  document.getElementById("modalText").textContent = text;
  document.getElementById("modalOverlay").classList.add("open");
}
document.getElementById("modalClose").addEventListener("click", function() {
  document.getElementById("modalOverlay").classList.remove("open");
});
document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target === document.getElementById("modalOverlay")) {
    document.getElementById("modalOverlay").classList.remove("open");
  }
});


// ---- Backend ----
function sendToBackend(type) {
  saveFinalQuestions();
  var body = {
    reviewer_name: state.reviewer_name,
    reviewer_email: state.reviewer_email,
    type: type,
    payload: {
      field_confidence: state.field_confidence,
      answers: state.answers,
      final_questions: state.final_questions
    }
  };
  fetch(BACKEND_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function() {
    showAutosaveIndicator(type === "final" ? "Submitted!" : "Autosaved");
  }).catch(function(err) {
    console.warn("Backend save failed:", err);
  });
}

function loadFromBackend(email) {
  var loadKey = "ibd_poll_loaded_" + email.toLowerCase().trim();
  if (sessionStorage.getItem(loadKey)) return;
  sessionStorage.setItem(loadKey, "1");
  fetch(BACKEND_URL + "?action=load&email=" + encodeURIComponent(email), { redirect: "follow" })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var payload = (d && d.payload) ? d.payload : (d && d.data) ? d.data : null;
      if (payload && (payload.answers || payload.field_confidence !== undefined)) {
        var ansCount = payload.answers ? Object.keys(payload.answers).length : 0;
        if (confirm("Found saved progress for this email (" + ansCount + " questions). Restore it?")) {
          if (payload.field_confidence !== undefined) state.field_confidence = payload.field_confidence;
          if (payload.answers) state.answers = payload.answers;
          if (payload.final_questions) state.final_questions = payload.final_questions;
          state.started = true;
          saveToLocalStorage();
          location.reload();
        }
      }
    })
    .catch(function(e) { console.log("Backend load failed:", e.message); });
}

function startAutosave() {
  setInterval(function() {
    if (state.started && state.reviewer_email) {
      saveToLocalStorage();
      sendToBackend("partial");
    }
  }, 30000);
}

function showPreviewAndSubmit() {
  if (!state.reviewer_name || !state.reviewer_email) {
    alert("Please provide your name and email on the Start page.");
    return;
  }

  // Count incomplete questions
  var incomplete = 0;
  data.questions.forEach(function(q) {
    if (!isQuestionComplete(q.id, state.answers[q.id])) incomplete++;
  });

  var previewHtml = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;" id="preview-overlay" onclick="if(event.target===this)closePreview()">' +
    '<div style="background:#fff;border-radius:12px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">' +
    '<h2 style="margin-bottom:20px;color:#1a202c;">Review Your Responses</h2>';

  if (incomplete > 0) {
    previewHtml += '<div style="background:#fed7d7;border:1px solid #fc8181;border-radius:8px;padding:12px 16px;margin-bottom:16px;color:#c53030;font-size:0.9rem;">' +
      '<strong>' + incomplete + ' question' + (incomplete > 1 ? 's' : '') + ' not yet completed.</strong> You may go back and finish them before submitting.</div>';
  }

  // Reviewer info
  previewHtml += '<div style="background:#f7fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:12px;">' +
    '<h4 style="margin:0 0 6px 0;color:#2d3748;">Reviewer</h4>' +
    '<p style="font-size:0.9rem;margin:0;"><strong>' + escapeHtml(state.reviewer_name) + '</strong> (' + escapeHtml(state.reviewer_email) + ')</p>' +
    '<p style="font-size:0.9rem;margin:4px 0 0 0;">Field confidence: ' + (state.field_confidence !== null ? state.field_confidence + '/10' : 'not set') + '</p>' +
  '</div>';

  // Q1-Q9
  data.questions.forEach(function(q, idx) {
    var ans = state.answers[q.id] || {};
    previewHtml += '<div style="background:#f7fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:8px;">' +
      '<h4 style="margin:0 0 6px 0;color:#2d3748;">' + q.id + ': ' + escapeHtml(q.text).slice(0, 80) + '...</h4>';
    if (q.type === "comparison") {
      previewHtml += '<p style="font-size:0.9rem;margin:0;">Preference: ' + (ans.preference ? '<strong>Response ' + ans.preference + '</strong>' : '<em style="color:#c53030;">Not selected</em>') + '</p>';
      previewHtml += '<p style="font-size:0.9rem;margin:4px 0 0 0;">Confidence: ' + (ans.confidence !== undefined && ans.confidence !== null ? ans.confidence + '/10' : 'not set') + '</p>';
      if (ans.reasoning) previewHtml += '<p style="font-size:0.85rem;margin:4px 0 0 0;color:#4a5568;">Notes: ' + escapeHtml(ans.reasoning).slice(0, 100) + (ans.reasoning.length > 100 ? '...' : '') + '</p>';
    } else {
      var xCount = ans.proposals_x ? Object.keys(ans.proposals_x).length : 0;
      var yCount = ans.proposals_y ? Object.keys(ans.proposals_y).length : 0;
      previewHtml += '<p style="font-size:0.9rem;margin:0;">Proposals scored: X=' + xCount + ', Y=' + yCount + '</p>';
    }
    previewHtml += '</div>';
  });

  // Final questions
  var fq = state.final_questions || {};
  if (fq.directions || fq.ai_questions || fq.feedback || fq.other) {
    previewHtml += '<div style="background:#f7fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:12px;">' +
      '<h4 style="margin:0 0 6px 0;color:#2d3748;">Final Questions</h4>';
    if (fq.directions) previewHtml += '<p style="font-size:0.85rem;margin:2px 0;">Research directions: provided</p>';
    if (fq.ai_questions) previewHtml += '<p style="font-size:0.85rem;margin:2px 0;">Questions for AI: provided</p>';
    if (fq.feedback) previewHtml += '<p style="font-size:0.85rem;margin:2px 0;">Overall feedback: provided</p>';
    if (fq.other) previewHtml += '<p style="font-size:0.85rem;margin:2px 0;">Other comments: provided</p>';
    previewHtml += '</div>';
  }

  previewHtml += '<div style="background:#fefcbf;border:1px solid #f6e05e;border-radius:8px;padding:12px 16px;margin-top:16px;font-size:0.9rem;color:#744210;">' +
    'Please ensure you are happy with your responses before submitting. You can still edit after submission by reloading and using the same email.</div>';

  previewHtml += '<div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;align-items:center;">' +
    '<button class="submit-final" onclick="closePreview();submitAndDownload()">Submit &amp; Download a Copy</button>' +
    '<button class="btn-primary" style="background:#718096;" onclick="closePreview()">Go Back &amp; Edit</button>' +
  '</div>';

  previewHtml += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', previewHtml);
}

function closePreview() {
  var overlay = document.getElementById('preview-overlay');
  if (overlay) overlay.remove();
}

function submitAndDownload() {
  downloadLocalCopy();
  saveToLocalStorage();
  sendToBackend("final");
  showThankYou();
}

function downloadLocalCopy() {
  var text = '=== Expert Blind Evaluation v2 — Response Summary ===\n\n';
  text += 'Reviewer: ' + state.reviewer_name + '\n';
  text += 'Email: ' + (state.reviewer_email || 'not provided') + '\n';
  text += 'Field confidence: ' + (state.field_confidence !== null ? state.field_confidence + '/10' : 'not set') + '\n';
  text += 'Date: ' + new Date().toISOString().slice(0, 10) + '\n\n';

  data.questions.forEach(function(q, idx) {
    var ans = state.answers[q.id] || {};
    text += '--- ' + q.id + ': ' + q.text + ' ---\n';
    if (q.type === "comparison") {
      text += 'Preference: ' + (ans.preference ? 'Response ' + ans.preference : 'NOT SELECTED') + '\n';
      text += 'Confidence: ' + (ans.confidence !== undefined && ans.confidence !== null ? ans.confidence + '/10' : 'not set') + '\n';
      if (ans.reasoning) text += 'Notes: ' + ans.reasoning + '\n';
    } else {
      var px = ans.proposals_x || {};
      var py = ans.proposals_y || {};
      Object.keys(px).forEach(function(k) {
        var p = px[k];
        text += '  ' + k + ': Nov=' + (p.novelty||'?') + ' Grd=' + (p.groundedness||'?') + ' Feas=' + (p.feasibility||'?') + ' Worth=' + (p.worth_investigating?'Y':'N') + ' Known=' + (p.already_investigating?'Y':'N') + ' Conf=' + (p.confidence||'?') + '\n';
      });
      Object.keys(py).forEach(function(k) {
        var p = py[k];
        text += '  ' + k + ': Nov=' + (p.novelty||'?') + ' Grd=' + (p.groundedness||'?') + ' Feas=' + (p.feasibility||'?') + ' Worth=' + (p.worth_investigating?'Y':'N') + ' Known=' + (p.already_investigating?'Y':'N') + ' Conf=' + (p.confidence||'?') + '\n';
      });
    }
    text += '\n';
  });

  var fq = state.final_questions || {};
  text += '--- Final Questions ---\n';
  if (fq.directions) text += 'Research directions: ' + fq.directions + '\n';
  if (fq.ai_questions) text += 'Questions for AI: ' + fq.ai_questions + '\n';
  if (fq.feedback) text += 'Overall feedback: ' + fq.feedback + '\n';
  if (fq.other) text += 'Other: ' + fq.other + '\n';

  var blob = new Blob([text], {type: 'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'expert_poll_v2_' + state.reviewer_name.replace(/\s+/g,'_') + '_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();

  // Also download JSON copy
  var jsonBlob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
  var a2 = document.createElement('a');
  a2.href = URL.createObjectURL(jsonBlob);
  a2.download = 'expert_poll_v2_' + state.reviewer_name.replace(/\s+/g,'_') + '_' + new Date().toISOString().slice(0,10) + '.json';
  setTimeout(function() { a2.click(); }, 500);
}

function showThankYou() {
  var html = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;" id="thankyou-overlay">' +
    '<div style="background:#fff;border-radius:16px;max-width:500px;width:100%;padding:40px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.3);">' +
    '<h1 style="color:#276749;font-size:2em;margin-bottom:16px;">Thank You!</h1>' +
    '<p style="color:#4a5568;font-size:1.05em;line-height:1.6;margin-bottom:12px;">Your evaluation has been submitted successfully.</p>' +
    '<p style="color:#4a5568;font-size:1.05em;line-height:1.6;margin-bottom:12px;">Your expert review is invaluable for our research. A copy has been downloaded for your records.</p>' +
    '<p style="margin-top:20px;font-size:0.9em;color:#718096;">You can close this page or reload to review/edit your responses.</p>' +
    '<button class="btn-primary" style="margin-top:24px;padding:14px 36px;font-size:1.05em;" onclick="document.getElementById(\'thankyou-overlay\').remove()">Close</button>' +
  '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

// ---- Run ----
init();

</script>
</body>
