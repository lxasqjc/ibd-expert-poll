.unique-section.unique-x { background: #ebf4ff; border: 1px solid #5a67d8; border-left: 4px solid #5a67d8; }

.unique-section.unique-y { background: #fefcf0; border: 1px solid #d69e2e; border-left: 4px solid #d69e2e; }

.checkbox-grid label input[type="checkbox"] { width: 18px; height: 18px; accent-color: #38a169; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;

.modal-overlay.open { display: flex; }
.modal-content {

}
.modal-close {
  position: sticky; top: 0; float: right; background: #e53e3e; color: white;

/* Profile / Submit */
.profile-section { max-width: 700px; margin: 0 auto; }
.submit-final { background: #38a169; color: white; border: none; padding: 14px 40px; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
.submit-final:hover { background: #2f855a; }
.submit-final:disabled { background: #a0aec0; cursor: not-allowed; }

/* Autosave indicator */
.autosave-indicator { position: fixed; bottom: 16px; right: 16px; background: #38a169; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; opacity: 0; transition: opacity 0.3s; z-index: 999; }

/* Responsive */
@media (max-width: 900px) {

  .rating-grid { grid-template-columns: 1fr; }

  .shared-table { font-size: 0.75rem; }
}

const POLL_DATA = {"metadata": {"study": "Crohn's Fistula IBD - Spatial Transcriptomics", "date_created": "2026-08-11", "arms": ["X", "Y"], "note": "Two AI systems analyzed the same spatial transcriptomics data. Labels X and Y are randomly assigned per question."}, "questions": [{"id": "Q1", "type": "comparison", "text": "What are the fibroblast subtypes and what are their biological significance? What are their marker genes & key pathways?", "responses": {"X": "================================================================================\n         FIBROBLAST SUBTYPE ANALYSIS: IBD CROHN'S FISTULA FORMATION STUDY\n================================================================================\n\nDATA SOURCES:\n  - scRNA-seq reference: 24,094 cells (epithelial + immune enriched)\n  - Xenium 5k-plex spatial: 1,860,368 cells, 5,100 genes\n  - Xenium 480-plex spatial: 6,334,604 cells, 541 genes\n\n================================================================================\nSECTION 1: FIBROBLAST SUBTYPE IDENTIFICATION\n================================================================================\n\nFrom the scRNA-seq reference, 7 distinct stromal/fibroblast clusters were\nidentified (6,389 total cells):\n\n  Subtype              Cell Count\n  -------------------- ----------\n  Stromal 1            1,000\n  Stromal 2            1,000\n  Stromal 3 (1)        1,000\n  Stromal 3 (2)        775\n  Stromal 3 + 4        1,000\n  Stromal 3 C7+        1,000\n  Myofibroblasts       614\n\nDisease Distribution (CD vs HC):\n  Myofibroblasts:    CD=491, HC=44\n  Stromal 1:         CD=641, HC=103\n  Stromal 2:         CD=547, HC=325\n  Stromal 3 (1):     CD=511, HC=177\n  Stromal 3 (2):     CD=434, HC=36\n  Stromal 3 + 4:     CD=762, HC=20\n  Stromal 3 C7+:     CD=634, HC=167\n\nCD Disease Subtype Distribution:\n  Fistulating:       Myo=332, S1=381, S2=413, S3(1)=426, S3(2)=334, S3+4=454, S3C7+=418\n  Strictured:        Myo=156, S1=112, S2=124, S3(1)=85,  S3(2)=145, S3+4=260, S3C7+=53\n  Inflammatory:      Myo=75,  S1=380, S2=119, S3(1)=292, S3(2)=245, S3+4=228, S3C7+=321\n\n================================================================================\nSECTION 2: MARKER GENES FOR EACH FIBROBLAST SUBTYPE\n================================================================================\n\n--- Stromal 1 ---\n  TOP MARKERS (avg_log2FC > 2):\n  CCL13 (7.25), SFTA1P (6.43), CCL8 (6.13), ADAMDEC1 (5.59), CXCL6 (5.10), HAPLN1 (4.87), ADAM28 (4.55), FABP5 (4.06), SCT (3.66), CTSC (3.09)\n\n--- Stromal 2 ---\n  TOP MARKERS (avg_log2FC > 2):\n  NPY (9.37), HSD17B2 (7.40), ENHO (6.41), PTPRT (5.85), SOX6 (5.41), MMP11 (5.08), NSG1 (4.86), INSC (4.63), BMP7 (4.46), PCSK6 (4.15)\n\n--- Stromal 3 (1) ---\n  TOP MARKERS (avg_log2FC > 2):\n  PLA2G2A (3.77), CFD (3.28), MFAP5 (3.24), CLEC3B (3.23), SFRP2 (3.03), FBLN2 (2.79), PLAC9 (2.59), ITM2A (2.54), SFRP1 (2.44), GPC3 (2.42)\n\n--- Stromal 3 (2) ---\n  TOP MARKERS (avg_log2FC > 2):\n  PDZRN4 (4.24), EBF1 (4.08), FGF14 (3.89), NLGN1 (3.36), DCLK1 (3.24), AUTS2 (3.09), DOCK4 (3.03), FGF13 (2.94), MEG8 (2.94), ZFPM2 (2.93)\n\n--- Stromal 3 + 4 ---\n  TOP MARKERS (avg_log2FC > 2):\n  CTHRC1 (3.00), POSTN (2.90), CPXM1 (2.62), CRABP2 (2.56), HMOX1 (2.47), COL1A1 (2.47), TWIST1 (2.44), FAP (2.43), IGF1 (2.37), BGN (2.23)\n\n--- Stromal 3 C7+ ---\n  TOP MARKERS (avg_log2FC > 2):\n  LY6H (4.23), THBS4 (4.07), KCNN3 (3.74), CA8 (3.72), SCN7A (3.38), FNDC1 (3.05), DPT (3.04), C7 (3.01), JAM2 (2.91), FREM1 (2.52)\n\n--- Myofibroblasts ---\n  TOP MARKERS (avg_log2FC > 2):\n  P2RY14 (7.93), DES (7.82), ACTG2 (7.06), KCNMB1 (6.99), SOSTDC1 (6.83), HSD17B6 (6.79), MYH11 (6.59), PLN (6.21), MYOCD (5.93), HHIP (5.91)\n\n================================================================================\nSECTION 3: BIOLOGICAL INTERPRETATION OF FIBROBLAST SUBTYPES\n================================================================================\n\n1. Stromal 1 - Inflammatory Chemokine-Producing Fibroblasts:\n   Key markers: CCL13 (7.25), CCL8 (6.13), ADAMDEC1 (5.59), CXCL6 (5.10)\n   Function: Recruits monocytes and inflammatory cells via chemokine signaling\n   Significance: Enriched in inflammatory CD; drives leukocyte infiltration\n\n2. Stromal 2 - Metabolic/Developmental Fibroblasts:\n   Key markers: NPY (9.37), HSD17B2 (7.40), SOX6 (5.41), MMP11 (5.08)\n   Function: Steroid metabolism, angiogenesis (NPY), matrix remodeling\n   Significance: Enriched in healthy controls; may represent homeostatic fibroblasts\n\n3. Stromal 3 (1) - Wnt-Modulating ECM Fibroblasts:\n   Key markers: SFRP2 (3.03), MFAP5 (3.24), FBLN2 (2.79), SFRP1 (2.44)\n   Function: Wnt signaling inhibition, ECM organization\n   Significance: Enriched in healthy controls; may protect against fibrosis\n\n4. Stromal 3 (2) - Neural/Developmental Fibroblasts:\n   Key markers: PDZRN4 (4.24), DCLK1 (3.24), FGF14 (3.89), EBF1 (4.08)\n   Function: Stem cell maintenance (DCLK1), FGF signaling\n   Significance: Enriched in stricturing CD; may contribute to tissue remodeling\n\n5. Stromal 3 + 4 - Classical Collagen-Producing Fibroblasts:\n   Key markers: POSTN (2.90), COL1A1 (2.47), FAP (2.43), TWIST1 (2.44)\n   Function: ECM production (collagen, periostin), fibrosis program\n   Significance: Highly enriched in fistulising and stricturing CD; key drivers\n   of fibrosis and fistula formation in Crohn's disease\n\n6. Stromal 3 C7+ - Complement-Activated Fibroblasts:\n   Key markers: THBS4 (4.07), C7 (3.01), KCNN3 (3.74), LY6H (4.23)\n   Function: Complement cascade activation, cell adhesion\n   Significance: Enriched in fistulising CD; links complement to fibrosis\n\n7. Myofibroblasts - Contractile/Smooth Muscle-Like Fibroblasts:\n   Key markers: DES (7.82), ACTG2 (7.06), MYH11 (6.59), P2RY14 (7.93)\n   Function: Actin-myosin contractility, smooth muscle differentiation\n   Significance: Enriched in fistulising CD; contribute to tissue contraction\n   and stricture formation\n\n================================================================================\nSECTION 4: KEY PATHWAYS BY SUBTYPE\n================================================================================\n\nStromal 1: Cytokine-cytokine receptor interaction, leukocyte chemotaxis, ADAM\n           metalloproteinase activity - drives inflammation and cell recruitment\n\nStromal 2: Steroid hormone metabolism, BMP signaling, MMP activity - metabolic\n           regulation and tissue homeostasis\n\nStromal 3 (1): Wnt signaling modulation, ECM organization, complement system -\n               anti-fibrotic and structural maintenance\n\nStromal 3 (2): FGF signaling, cell adhesion, stem cell maintenance - tissue\n               remodeling and regeneration\n\nStromal 3 + 4: ECM structural organization (COL1A1, POSTN), fibroblast activation\n               (FAP), EMT/fibrosis (TWIST1), oxidative stress (HMOX1) - classic\n               pro-fibrotic signature\n\nStromal 3 C7+: Complement cascade activation, cell adhesion, ion channel signaling\n               - immune-fibroblast crosstalk\n\nMyofibroblasts: Actin-myosin contractility, smooth muscle differentiation\n                (MYOCD), purinergic signaling - tissue contraction and remodeling\n\n================================================================================\nSECTION 5: SPATIAL DISTRIBUTION IN XENIUM DATA\n================================================================================\n\nXenium 5k-plex spatial transcriptomics:\n  - Total cells: 1,860,368 | Genes: 5,100\n  - Samples: 17 slides (3 RUNs)\n  - Disease: HC=459,745 | ULCER=1,011,573 | FISTULA=389,050\n  - Location: COLON=428,538 | ILEUM=1,431,830\n\nFibroblast markers detected in Xenium 5k:\n  CCL13, CCL8, NPY, HSD17B2, SOX6, FBLN2, DCLK1, CTHRC1,\n  POSTN, FAP, KCNN3, P2RY14 (12 of 24 tested markers)\n\nXenium 480-plex spatial transcriptomics:\n  - Total cells: 6,334,604 | Genes: 541\n  - Disease: CD=5,101,463 | DIVERTICULAR=618,039 | HEALTHY=615,102\n  - Fistula types: ENTEROCUTANEOUS=931,528 | PERI-ANAL=602,962\n    SMALL/LARGE INTESTINE=3,136,643 | NOT FISTULISING=1,045,432\n\n================================================================================\nSECTION 6: CLINICAL IMPLICATIONS\n================================================================================\n\n1. FISTULISING CD shows enrichment of pro-fibrotic subtypes:\n   - Stromal 3 + 4 (collagen-producing): 454/762 cells in fistulising\n   - Stromal 3 C7+ (complement-activated): 418/634 cells in fistulising\n   - Myofibroblasts (contractile): 332/491 cells in fistulising\n\n2. INFLAMMATORY CD shows enrichment of chemokine-producing subtypes:\n   - Stromal 1 (CCL13/CCL8): 380/1000 cells in inflammatory\n   - Stromal 3 C7+ (complement): 321/1000 cells in inflammatory\n\n3. STRICTURING CD shows enrichment of remodeling subtypes:\n   - Stromal 3 + 4 (fibrosis): 260/762 cells in stricturing\n   - Stromal 3 (2) (DCLK1+): 145/434 cells in stricturing\n\n4. HEALTHY CONTROLS show enrichment of homeostatic subtypes:\n   - Stromal 2 (metabolic): 325/1000 cells in HC\n   - Stromal 3 (1) (Wnt-modulating): 177/1000 cells in HC\n\n5. KEY PATHWAYS DRIVING FISTULA FORMATION:\n   - ECM remodeling (POSTN, COL1A1, FAP, TWIST1)\n   - Complement activation (C7, THBS4)\n   - Chemokine signaling (CCL13, CCL8, CXCL6)\n   - Smooth muscle differentiation (ACTG2, MYH11, MYOCD)\n\n================================================================================\nEND OF ANALYSIS\n================================================================================\n", "Y": "================================================================================\nFIBROBLAST SUBTYPES IN IBD FISTULA FORMATION: COMPREHENSIVE ANALYSIS\nXenium 480-plex Spatial Transcriptomics Data\n================================================================================\n\nEXECUTIVE SUMMARY\n=================\nAnalysis of Xenium 480-plex spatial transcriptomics data from Crohn's disease\nfistula tissue identified THREE distinct fibroblast/stromal subtypes at the\nfinest annotation level (Level 3). Each subtype exhibits unique marker gene\nexpression profiles with distinct biological functions:\n\n1. Stromal 1: CXCL14-high fibroblasts with strong chemokine/ECM signature\n2. Stromal 3 (1): Mast cell-associated fibroblasts with WNT/BMP modulation\n3. Stromal 3 + 4: Lymphoid-associated fibroblasts with lymphoid organ chemokines\n\nThese subtypes likely play specialized roles in fistula pathogenesis through\nimmune cell recruitment, extracellular matrix remodeling, and lymphoid\nneogenesis.\n\n================================================================================\nFIBROBLAST SUBTYPE 1: \"STROMAL 1\" - CXCL14-HIGH FIBROBLASTS\n================================================================================\n\nQUANTITATIVE PROFILE:\n- Total significant markers: 10 (p<0.05, log2FC>0.5)\n- Sample expression: 26-56% of cells express top markers\n\nTOP MARKER GENES (by statistical significance):\n--------------------------------------------------------------------------------\nGene                     log2FC     pct_exp   pct_ctrl   Interpretation\n--------------------------------------------------------------------------------\nADAMDEC1                    3.896      55.9%      11.8%   Metalloproteinase domain 1\nCXCL14                      3.233      46.3%       9.5%   Chemokine (neutrophil chemoattractant)\nMFAP4                       1.109      34.1%      20.0%   Microfibrillar-associated protein 4\nMAF                         1.010      36.1%      23.6%   Transcription factor (oncogene)\nLUM                         0.626      51.1%      38.2%   Lumican (proteoglycan)\nPDGFRA                      1.037      27.6%      16.6%   PDGF receptor alpha\nPTGDS                       0.803      32.6%      21.8%   Prostaglandin D2 synthase\nIGFBP5                      0.922      34.9%      24.8%   IGF binding protein 5\nQSOX1                       1.035      26.0%      16.6%   Quiescin sulfhydryl oxidase 1\nLAMA4                       0.759      26.2%      18.2%   Laminin subunit alpha 4\n\nBIOLOGICAL SIGNIFICANCE:\n1. Immune Recruitment: CXCL14 is a potent chemoattractant for neutrophils and\n   other immune cells, suggesting this subtype actively recruits inflammatory\n   cells to fistula sites.\n2. ECM Remodeling: Expression of LUM (lumican), MFAP4, and LAMA4 indicates\n   active extracellular matrix organization and remodeling.\n3. Growth Factor Signaling: PDGFRA expression suggests responsiveness to\n   PDGF signaling, which drives fibroblast proliferation and activation.\n4. Oxidative Stress Response: QSOX1 indicates involvement in oxidative stress\n   management.\n\n================================================================================\nFIBROBLAST SUBTYPE 2: \"STROMAL 3 (1)\" - MAST CELL-ASSOCIATED FIBROBLASTS\n================================================================================\n\nQUANTITATIVE PROFILE:\n- Total significant markers: 21 (p<0.05, log2FC>0.5)\n- Sample expression: 33-100% of cells express top markers\n\nTOP MARKER GENES (by statistical significance):\n--------------------------------------------------------------------------------\nGene                     log2FC     pct_exp   pct_ctrl   Interpretation\n--------------------------------------------------------------------------------\nMS4A2                     6.045     100.0%       1.7%   Mast cell tryptase receptor\nCPA3                      5.670     100.0%       2.3%   Mast cell carboxypeptidase A3\nKIT                       5.362      88.9%       2.5%   Stem cell factor receptor (CD117)\nPTGDS                     2.621     100.0%      22.3%   Prostaglandin D2 synthase\nC3                        2.384     100.0%      24.4%   Complement component 3\nLIF                       3.190      44.4%       5.1%   Leukemia inhibitory factor\nSFRP2                     1.763      77.8%      16.9%   WNT pathway antagonist\nDCN                       1.680     100.0%      39.4%   Decorin (proteoglycan)\nGREM1                     2.007      77.8%      22.3%   Gremlin-1 (BMP antagonist)\nMFAP4                     1.445      77.8%      20.6%   Microfibrillar-associated protein 4\nCCL11                     1.363      44.4%       7.7%   Eotaxin-1 (eosinophil chemoattractant)\nIL1R1                     1.302      77.8%      25.5%   Interleukin-1 receptor\nSFRP1                     2.535      33.3%       6.4%   WNT pathway antagonist\nLUM                       1.242      88.9%      38.7%   Lumican (proteoglycan)\nCXCL12                    1.730      77.8%      27.6%   SDF-1 (stromal cell-derived)\nANXA1                     1.328      77.8%      30.5%   Annexin A1 (anti-inflammatory)\nTIMP3                     0.373      77.8%      24.4%   Metalloproteinase inhibitor\nAPOE                      1.248      44.4%      11.9%   Apolipoprotein E\nECM1                      2.544      33.3%       8.7%   Extracellular matrix protein 1\nIGFBP5                    1.106      66.7%      25.3%   IGF binding protein 5\nC7                        1.536      33.3%       8.5%   Complement component 7\n\nBIOLOGICAL SIGNIFICANCE:\n1. Mast Cell Association: Expression of MS4A2, CPA3, and KIT suggests either\n   acquired mast cell-like gene expression, close spatial proximity to mast\n   cells, or a transitional state between fibroblast and mast cell lineages.\n2. WNT Pathway Modulation: High expression of SFRP1 and SFRP2 (WNT antagonists)\n   indicates active regulation of WNT signaling crucial for tissue homeostasis,\n   wound healing, and fibrosis development.\n3. BMP Pathway Inhibition: GREM1 (Gremlin-1) is a potent BMP antagonist that\n   promotes fibroblast activation and drives fibrosis.\n4. Eosinophil Recruitment: CCL11 (eotaxin-1) specifically attracts eosinophils,\n   which contribute to tissue remodeling and fibrosis.\n5. Complement Activation: C3 and C7 suggest involvement in complement cascade,\n   linking innate immunity to fibrotic responses.\n\n================================================================================\nFIBROBLAST SUBTYPE 3: \"STROMAL 3 + 4\" - LYMPHOID-ASSOCIATED FIBROBLASTS\n================================================================================\n\nQUANTITATIVE PROFILE:\n- Total significant markers: 17 (p<0.05, log2FC>0.5)\n- Sample expression: 25-55% of cells express top markers\n\nTOP MARKER GENES (by statistical significance):\n--------------------------------------------------------------------------------\nGene                     log2FC     pct_exp   pct_ctrl   Interpretation\n--------------------------------------------------------------------------------\nCCL19                     4.148      42.1%       4.6%   Lymphoid chemokine (MIP-3beta)\nCCL21                     3.178      25.0%       3.5%   Lymphoid chemokine (SLC/EBI1)\nPTGDS                     2.211      54.3%      22.0%   Prostaglandin D2 synthase\nC3                        1.987      52.0%      24.1%   Complement component 3\nADAMDEC1                  1.287      33.0%      13.5%   Metalloproteinase domain 1\nGREM1                     1.287      43.9%      22.0%   Gremlin-1 (BMP antagonist)\nIGFBP5                    1.101      45.0%      25.1%   IGF binding protein 5\nCXCL14                    1.290      25.5%      10.9%   Chemokine (neutrophil chemoattractant)\nMFAP4                     1.097      38.2%      20.4%   Microfibrillar-associated protein 4\nTHBS1                     0.743      54.8%      42.5%   Thrombospondin 1\nCCDC80                    0.784      36.4%      24.0%   Coiled-coil domain protein\nEGR1                      1.124      42.1%      31.0%   Early growth response 1\nCXCL12                    0.756      39.6%      27.4%   SDF-1 (stromal cell-derived)\nCOL6A3                    0.598      44.5%      32.2%   Collagen type VI alpha 3\nLUM                       0.511      50.4%      38.6%   Lumican (proteoglycan)\nTIMP3                     0.555      33.9%      24.3%   Metalloproteinase inhibitor 3\nTIMP2                     0.481      53.4%      45.3%   Metalloproteinase inhibitor 2\n\nBIOLOGICAL SIGNIFICANCE:\n1. Lymphoid Organogenesis: CCL19 and CCL21 are defining chemokines of\n   fibroblastic reticular cells (FRCs) that organize lymphoid tissues. Their\n   expression suggests formation of ectopic lymphoid structures in fistula\n   tissue and recruitment of T cells and dendritic cells.\n2. T Cell Recruitment: CCL19 and CCL21 bind to CCR7 on T cells and dendritic\n   cells, facilitating their migration into fistula tissue.\n3. ECM Organization: COL6A3, LUM, and MFAP4 indicate active ECM organization.\n4. Metalloproteinase Balance: ADAMDEC1 balanced with TIMP2/TIMP3 suggests\n   regulated ECM turnover.\n5. Prostaglandin Signaling: PTGDS indicates prostaglandin D2 production with\n   immunomodulatory effects.\n\n================================================================================\nCOMPARATIVE SUMMARY OF FIBROBLAST SUBTYPES\n================================================================================\n\nFeature                Stromal 1        Stromal 3 (1)    Stromal 3 + 4\n--------------------------------------------------------------------------------\nPrimary Function       Immune recruitment Mast cell       Lymphoid organization\n                       & ECM remodeling  interaction\nDefining Markers       CXCL14, ADAMDEC1  MS4A2, CPA3,    CCL19, CCL21\n                                          KIT\nKey Pathways           Chemokine         WNT/BMP         Lymphoid chemokine\n                       signaling         modulation       signaling\nECM Remodeling         Moderate          Moderate         Moderate-High\nImmune Interaction     Neutrophils       Mast cells       T cells, DCs\nFibrosis Potential     Moderate          High (GREM1)     Moderate\nClinical Relevance     Acute             Chronic           Chronic\n                       inflammation      inflammation     inflammation\n--------------------------------------------------------------------------------\n\n================================================================================\nKEY PATHWAYS AND BIOLOGICAL SIGNIFICANCE\n================================================================================\n\n1. CHEMOKINE-DRIVEN IMMUNE RECRUITMENT\n   - All three subtypes express chemokines (CXCL14, CCL19, CCL21, CCL11)\n   - Creates chemokine gradients recruiting specific immune cell populations\n   - Drives spatial organization of immune cells within fistula tissue\n\n2. EXTRACELLULAR MATRIX (ECM) REMODELING\n   - All subtypes express ECM proteins (LUM, DCN, COL6A3, MFAP4, POSTN)\n   - Metalloproteinases and inhibitors indicate regulated ECM turnover\n   - Drives tissue architecture changes and fibrosis in fistula formation\n\n3. GROWTH FACTOR SIGNALING\n   - PDGFRA (Stromal 1): PDGF-driven fibroblast activation and proliferation\n   - IGFBP5 (all subtypes): IGF signaling modulation\n   - GREM1 (Stromal 3(1) and 3+4): BMP antagonism promoting fibrosis\n   - WNT modulators (SFRP1/2 in Stromal 3(1)): WNT pathway regulation\n\n4. COMPLEMENT SYSTEM ACTIVATION\n   - C3 and C7 expression in Stromal 3(1) and 3+4\n   - Links innate immunity to fibrotic responses\n\n5. PROSTAGLANDIN METABOLISM\n   - PTGDS in all subtypes\n   - Prostaglandin D2 has immunomodulatory effects\n\n================================================================================\nCLINICAL IMPLICATIONS FOR IBD\n================================================================================\n\n1. TARGETED THERAPIES:\n   - Stromal 1: CXCL14 inhibitors could reduce neutrophil recruitment\n   - Stromal 3(1): Anti-GREM1 or anti-WNT therapies could reduce fibrosis\n   - Stromal 3+4: CCR7 antagonists could disrupt lymphoid neogenesis\n\n2. DISEASE BIOMARKERS:\n   - Subtype-specific marker panels could distinguish fistulizing from\n     non-fistulizing disease\n   - Spatial distribution of subtypes may predict fistula formation\n\n3. TISSUE REMODELING:\n   - Fibroblast heterogeneity suggests multiple pathways to fibrosis\n   - Combined targeting of multiple subtypes may be more effective\n\n4. INFLAMMATORY MICROENVIRONMENT:\n   - Each subtype creates distinct immune cell recruitment patterns\n   - Targeting specific subtypes could modulate local immune responses\n\n================================================================================\nEND OF ANALYSIS\n================================================================================\n"}, "semantic": {"executive_summary_x": {"bullets": ["Identifies 7 fibroblast subtypes from scRNA-seq reference (6,389 cells)", "Provides detailed disease distribution across fistulating/strictured/inflammatory CD", "Reports top marker genes with log2FC for all 7 subtypes", "Includes Xenium 5k and 480-plex spatial validation data", "Maps subtypes to clinical CD phenotypes with cell count evidence"]}, "executive_summary_y": {"bullets": ["Identifies 3 fibroblast subtypes from Xenium 480-plex spatial data", "Deeper functional characterization per subtype with pct_exp statistics", "Highlights lymphoid neogenesis (CCL19/CCL21) and mast cell association", "Provides comparative summary table across subtypes", "Proposes specific therapeutic targets for each subtype"]}, "shared_points": [{"topic": "Stromal 1 as chemokine/immune-recruiting fibroblasts", "x_text": "Inflammatory chemokine-producing fibroblasts marked by CCL13, CCL8, ADAMDEC1, CXCL6; recruits monocytes and inflammatory cells", "y_text": "CXCL14-high fibroblasts with ADAMDEC1; recruits neutrophils and other immune cells to fistula sites"}, {"topic": "Stromal 3 (1) expresses Wnt pathway antagonists (SFRP1/SFRP2)", "x_text": "Wnt-modulating ECM fibroblasts with SFRP2 and SFRP1; Wnt signaling inhibition and ECM organization; may protect against fibrosis", "y_text": "High expression of SFRP1 and SFRP2 (WNT antagonists) indicates active regulation of WNT signaling crucial for tissue homeostasis and fibrosis"}, {"topic": "Stromal 3+4 as pro-fibrotic/ECM-producing aling involvement in contractile fibroblast biology"}], "unique_y": [{"topic": "Lymphoid neogenesis via CCL19/CCL21 in Stromal 3+4", "text": "Identifies Stromal 3+4 as fibroblastic reticular cell (FRC)-like lymphoid organizers expressing CCL19 and CCL21, suggesting ectopic lymphoid structure formation in fistula tissue and T cell/dendritic cell recruitment via CCR7"}, {"topic": "Mast cell association in Stromal 3(1)", "text": "Reports MS4A2, CPA3, and KIT as top markers suggesting mast cell-like gene expression, spatial proximity to mast cells, or a transitional fibroblast-mast cell state"}, {"topic": "BMP pathway inhibition via GREM1 driving fibrosis", "text": "Highlights Gremlin-1 (GREM1) as BMP antagonist in Stromal 3(1) and 3+4 that promotes fibroblast activation and drives fibrosis; proposed as therapeutic target"}, {"topic": "Eosinophil recruitment via CCL11 (eotaxin-1)", "text": "Identifies CCL11 expression in Stromal 3(1) as specifically attracting eosinophils that contribute to tissue remodeling and fibrosis"}, {"topic": "Specific therapeutic target proposals per subtype", "text": "Proposes CXCL14 inhibitors for Stromal 1, anti-GREM1/anti-WNT for Stromal 3(1), and CCR7 antagonists for Stromal 3+4 to disrupt lymphoid neogenesis"}, {"topic": "Oxidative stress response via QSOX1", "text": "Identifies quiescin sulfhydryl oxidase 1 (QSOX1) in Stromal 1 indicating involvement in oxidative stress management at fistula sites"}, {"topic": "Metalloproteinase balance (ADAMDEC1 vs TIMP2/TIMP3)", "text": "Notes regulated ECM turnover in Stromal 3+4 through balance of ADAMDEC1 metalloproteinase activity against TIMP2 and TIMP3 inhibitors"}, {"topic": "Anti-inflammatory signaling via ANXA1", "text": "Identifies Annexin A1 (ANXA1) in Stromal 3(1) as an anti-inflammatory mediator, suggesting counter-regulatory mechanisms within the same subtype"}, {"topic": "Prostaglandin D2 metabolism as shared pathway across all subtypes", "text": "Explicitly highlights PTGDS expression in all three subtypes as a unifying immunomodulatory pathway with prostaglandin D2 production"}]}, "neutral_summary": {"X": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n- Seven distinct fibroblast/stromal subtypes were identified from scRNA-seq reference data (6,389 total cells across 24,094-cell dataset), with spatial validation in Xenium 5k-plex (1,860,368 cells) and 480-plex (6,334,604 cells) datasets.\n- Fistulising Crohn's disease shows strong enrichment of pro-fibrotic subtypes: Stromal 3+4 (454/762 CD cells in fistulising), Stromal 3 C7+ (418/634 in fistulising), and Myofibroblasts (332/491 in fistulising).\n- Stromal 3+4 fibroblasts express classical fibrosis markers including POSTN (log2FC=2.90), COL1A1 (2.47), FAP (2.43), and TWIST1 (2.44).\n- Myofibroblasts are defined by contractile genes: DES (log2FC=7.82), ACTG2 (7.06), MYH11 (6.59), P2RY14 (7.93).\n- Stromal 1 (inflammatory chemokine-producing) fibroblasts marked by CCL13 (7.25), CCL8 (6.13), and CXCL6 (5.10) are enriched in inflammatory CD.\n- Healthy controls are enriched for homeostatic subtypes: Stromal 2 (NPY+, HSD17B2+) and Stromal 3(1) (SFRP2+, Wnt-modulating).\n- Complement-activated fibroblasts (Stromal 3 C7+) expressing C7 (3.01) and THBS4 (4.07) link innate immunity to fibrotic responses in fistulising disease.\n\nBiological Interpretation:\nFibroblast heterogeneity in Crohn's disease gut tissue reveals a clear disease-state-dependent composition shift. In healthy intestinal tissue, homeostatic fibroblast subtypes dominate, characterized by Wnt pathway inhibition (SFRP1/2), steroid metabolism, and ECM maintenance. These populations appear to serve protective anti-fibrotic roles through regulated Wnt signaling and balanced matrix turnover.\n\nThe transition to fistulising disease is marked by dramatic expansion of three pro-fibrotic subtypes. The Stromal 3+4 population represents classical collagen-producing activated fibroblasts driving ECM deposition through POSTN, COL1A1, and FAP, while TWIST1 expression indicates active epithelial-mesenchymal transition programming. Complement-activated Stromal 3 C7+ fibroblasts link innate immune activation to fibrogenic signaling. Myofibroblasts contribute tissue contraction and smooth muscle differentiation programs that physically distort tissue architecture and contribute to stricture formation.\n\nThe chemokine-producing Stromal 1 subtype, enriched in inflammatory CD, creates sustained immune cell recruitment through CCL13/CCL8-mediated monocyte attraction and CXCL6-driven neutrophil infiltration. This establishes a chronic inflammatory microenvironment that feeds forward into fibroblast activation. Together, these findings indicate that fistula formation involves coordinated ECM remodeling, complement activation, chemokine-driven inflammation, and smooth muscle differentiation -- representing multiple potential therapeutic intervention points including FAP inhibition, complement blockade, and chemokine receptor antagonism.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n- Three distinct fibroblast subtypes were identified in Crohn's disease fistula tissue from 1,860,368 cells across 19 samples at the finest annotation level (Level 3).\n- Stromal 1 fibroblasts are defined by CXCL14 (log2FC=3.233, 46.3% expressing) and ADAMDEC1 (log2FC=3.896, 55.9% expressing), functioning as immune-recruiting fibroblasts with PDGFRA (log2FC=1.037) responsiveness.\n- Stromal 3(1) fibroblasts express canonical mast cell markers MS4A2 (log2FC=6.045, 100% expressing), CPA3 (log2FC=5.670, 100%), and KIT (log2FC=5.362, 88.9%), alongside WNT antagonists SFRP2 (log2FC=1.763) and SFRP1 (log2FC=2.535), and BMP antagonist GREM1 (log2FC=2.007).\n- Stromal 3+4 fibroblasts express lymphoid organizer chemokines CCL19 (log2FC=4.148, 42.1% expressing) and CCL21 (log2FC=3.178, 25.0% expressing), identifying them as fibroblastic reticular cell-like populations.\n- Complement components C3 (log2FC=2.384 in Stromal 3(1); 1.987 in Stromal 3+4) and C7 (log2FC=1.536 in Stromal 3(1)) are expressed across subtypes, linking innate immunity to fibrosis.\n- All subtypes share expression of ECM proteins LUM, MFAP4, and IGFBP5, indicating a common fibrotic baseline with subtype-specific immune interaction specializations.\n\nBiological Interpretation:\nThe three fibroblast subtypes in Crohn's disease fistula tissue represent functionally specialized stromal populations that collectively orchestrate immune recruitment, tissue remodeling, and chronic inflammation. Stromal 1 fibroblasts serve as primary immune cell recruiters through CXCL14-mediated neutrophil chemotaxis, while PDGFRA expression indicates active proliferative signaling and ADAMDEC1 enables local metalloproteinase activity for ECM remodeling. These cells likely establish the initial inflammatory niche at fistula sites.\n\nThe Stromal 3(1) population represents a remarkable mast cell-fibroblast interaction node. The co-expression of canonical mast cell markers (MS4A2, CPA3, KIT) with fibroblast ECM genes and potent WNT/BMP pathway antagonists (SFRP1/2, GREM1) suggests these cells either exist in intimate spatial association with mast cells or have acquired a hybrid transcriptional state. GREM1-mediated BMP antagonism promotes fibroblast activation and drives fibrosis, while CCL11 (eotaxin-1) specifically attracts eosinophils that further amplify tissue remodeling. The complement components (C3, C7) position this subtype at the intersection of innate immunity and fibrogenic signaling.\n\nThe Stromal 3+4 lymphoid-associated fibroblasts resemble fibroblastic reticular cells through their defining CCL19/CCL21 expression, which binds CCR7 on T cells and dendritic cells. This population likely drives the formation of ectopic tertiary lymphoid structures within fistula tissue, sustaining adaptive immune responses and chronic inflammation. The metalloproteinase balance (ADAMDEC1 with TIMP2/TIMP3) suggests regulated rather than destructive ECM turnover, consistent with organized tissue restructuring for lymphoid neogenesis rather than acute tissue destruction."}}, {"id": "Q2", "type": "comparison", "text": "Based on the data, how do different types of fibroblasts interact with each other and coordinate in the disease?", "responses": {"X": "================================================================================\nFIBROBLAST HETEROGENEITY AND ROLE IN FISTULA FORMATION IN CROHN'S DISEASE\n================================================================================\n\nEXECUTIVE SUMMARY\n=================\nAnalysis reveals distinct fibroblast subpopulations in Crohn's disease fistula\ntissue exhibiting differential gene expression patterns associated with ECM\nremodeling, inflammatory signaling, and tissue remodeling. Using Xenium 5100-plex\n(1,860,368 cells, 5,100 genes) and Xenium 480-plex (6,334,604 cells, 541 genes),\ncombined with scRNA-seq reference data (24,094 cells, 17,709 genes), 7\nfibroblast/stromal subtypes were identified with distinct molecular profiles.\n\n================================================================================\n1. FIBROBLAST SUBTYPE IDENTIFICATION\n================================================================================\n\nSeven fibroblast/stromal subtypes from scRNA-seq reference:\n\n| Subtype | Cell Count | Top Marker Genes |\n|---------|-----------|------------------|\n| Myofibroblasts | 614 | ACTG2, MYH11, MYLK, TAGLN, TPM2 |\n| Stromal 1 | 1,000 | ADAMDEC1, CXCL14, CFD, APOE, EDIL3 |\n| Stromal 2 | 1,000 | CXCL14, F3, PDGFRA, EDNRB, NBL1 |\n| Stromal 3 (1) | 1,000 | DCN, MGP, FBLN1, C3, SERPINF1 |\n| Stromal 3 (2) | 775 | GPC6, RBMS3, LAMA2, SDK1, SAMD4A |\n| Stromal 3 + 4 | 1,000 | CCDC80, PTGDS, C3, DCN, SERPINF1 |\n| Stromal 3 C7+ | 1,000 | DPT, C7, MGP, DCN, GSN |\n\nKey Functional Categories:\n1. Contractile/Myofibroblasts: ACTG2, MYH11, MYLK, TAGLN - tissue contraction and fibrosis\n2. Inflammatory Stromal: CXCL14, F3, C3 - immune cell recruitment and complement activation\n3. ECM Remodeling: DCN, MGP, FBLN1, SERPINF1 - collagen organization and mineralization\n4. Glycosaminoglycan-Associated: GPC6, LAMA2, SDK1 - basement membrane organization\n\n================================================================================\n2. SPATIAL TRANSCRIPTOMICS FIBROBLAST GENE EXPRESSION\n================================================================================\n\nXenium 5100-plex (1,860,368 cells): 56 fibroblast genes detected\nXenium 480-plex (6,334,604 cells): 73 fibroblast genes detected\n\nKey fibroblast genes found across platforms: COL4A1, COL6A3, LUM, DCN, PDGFRA,\nPOSTN, THY1, PRRX1, CXCL14, ADAMDEC1, EDIL3, F3, C3, ECM1, IGFBP5, MMP1,\nMMP2, MMP3, MMP9, TIMP1, TIMP2, TIMP3, THBS1, THBS4, SPP1, CTGF, CCN2, OGN,\nGREM1, GREM2, ANGPTL4, SFRP1, SFRP2, WNT2, WNT5A, TWIST1, ZEB2, IL6, IL1B,\nIL11, CCL2, CCL3, CCL20, CCL21, CXCL1, CXCL2, CXCL5, CXCL8, CXCL12, CXCL13\n\nDisease Distribution (480-plex):\n- CD: 5,101,463 cells | DIVERTICULAR: 618,039 | HEALTHY: 615,102\n\n================================================================================\n3. KEY PATHWAYS IN FISTULA FORMATION\n================================================================================\n\nECM Remodeling:\n- Collagen genes: COL4A1, COL6A3\n- MMPs: MMP1, MMP2, MMP3, MMP9\n- TIMPs: TIMP1, TIMP2, TIMP3\n- Proteoglycans: DCN, LUM, OGN\n- Fibronectin-related: THBS1, THBS4, SPP1\n\nInflammatory Signaling:\n- Cytokines: IL6, IL1B, IL11, TNF\n- Chemokines: CCL2, CCL3, CCL4, CXCL8, CXCL12\n- Complement: C3, C7, C1QA, C1QB\n- Coagulation: F3 (tissue factor)\n\nDevelopmental/Signaling Pathways:\n- TGF-beta: TGFB1/2/3, TGFBR1/2, SMAD4\n- Wnt: WNT2, WNT5A, RSPO2, RSPO3, SFRP1, SFRP2\n- Notch: NOTCH1, NOTCH3, JAG1, DLL1, DLL4\n- Hedgehog: SHH, PTCH1, SMO, GLI1\n- PDGF: PDGFRA, PDGFB, PDGFRB\n\nEMT Markers:\n- Transcription factors: TWIST1, ZEB2, SOX9, SOX18\n- EMT markers: POSTN, PRRX1, GREM1, GREM2\n\n================================================================================\n4. FIBROBLAST-FIBROBLAST INTERACTIONS\n================================================================================\n\nParacrine Signaling Networks:\n- CXCL14-CXCR4 axis: Stromal 1 and Stromal 2 autocrine/paracrine loops\n- CCL2-CCR2 axis: Pro-inflammatory fibroblasts recruiting monocytes/macrophages\n- PDGFRA-PDGF axis: Stromal 2 responding to PDGF from other stromal cells\n\nMatrix-Mediated Interactions:\n- Collagen cross-linking: COL4A1 and COL6A3 coordinated ECM deposition\n- Proteoglycan organization: DCN and LUM coordinated glycosaminoglycan assembly\n- Glypican signaling: GPC6 modulating Wnt and FGF signaling\n\n================================================================================\n5. CLINICAL IMPLICATIONS\n================================================================================\n\nTherapeutic Targets:\n1. Anti-fibrotic: Targeting POSTN, SPP1, or MMP9 to reduce fibrosis\n2. Anti-inflammatory: Targeting IL6, IL1B, or CCL2 to reduce inflammation\n3. Anti-angiogenic: Targeting ANGPTL4 or VEGF-related pathways\n\nBiomarkers:\n1. Fibrosis: POSTN, SPP1, COL4A1 expression levels\n2. Inflammation: IL6, IL1B, CCL2 expression levels\n3. EMT: TWIST1, ZEB2, SOX9 expression levels\n\n================================================================================\n6. CONCLUSIONS\n================================================================================\n\nFibroblasts in Crohn's disease fistula tissue comprise multiple distinct\nsubpopulations with specialized functions:\n- Myofibroblasts: contractile genes, tissue fibrosis\n- Inflammatory stromal: chemokines/cytokines, immune cell recruitment\n- ECM-remodeling: proteoglycans/matrix proteins, tissue architecture changes\n\nSpatial context reveals fibroblasts are a diverse group with specialized functions\ncontributing to fistula formation through ECM remodeling, inflammatory signaling,\nand developmental pathway activation.\n\n================================================================================\nEND OF ANALYSIS\n================================================================================\n", "Y": "================================================================================\nHOW DIFFERENT TYPES OF FIBROBLASTS INTERACT AND DRIVE FISTULA FORMATION\nIN CROHN'S DISEASE\n================================================================================\n\nEXECUTIVE SUMMARY\n=================\nFistula formation in Crohn's disease represents a pathological wound-healing\nresponse characterized by aberrant tissue remodeling, excessive ECM deposition,\nand formation of abnormal epithelial-lined tracts. This process is driven by\ncrosstalk between specific pro-fibrotic fibroblast subpopulations (particularly\nmyofibroblasts and inflammatory fibroblasts) and immune cells (neutrophils,\nmacrophages, T cells). The key mechanism involves transition of resident\nfibroblasts into activated, ECM-producing myofibroblasts, facilitated by TGF-beta\nand IL-13 signaling, while neutrophil-derived proteases and ROS create physical\nchannels subsequently lined by migrating epithelial cells.\n\n================================================================================\n1. KEY FIBROBLAST SUBTYPES IN FISTULIZING CD\n================================================================================\n\nA. Pro-Fibrotic Myofibroblasts (The Effectors)\n   Location: Deep lamina propria, submucosa, within fistula tract walls\n   Markers: ACTA2, TAGLN, TAGLN2, MYL9, COL1A1, COL3A1, FN1\n   Role: Primary drivers of fibrosis and fistula tract structural integrity;\n   deposit dense collagen networks walling off infection but preventing healing\n   Spatial Context: Clustered in dense, organized bundles along epithelial\n   lining of fistula tract\n\nB. Inflammatory Fibroblasts (The Mediators)\n   Location: Perivascular regions and interfaces between inflamed mucosa/submucosa\n   Markers: CXCL12, CXCL14, CCL20, IL6, IL1B, S100A8/A9, MMP1, MMP3\n   Role: Respond to TNF-alpha/IL-1beta; produce chemokines recruiting neutrophils\n   and monocytes; secrete MMPs degrading basement membrane facilitating\n   epithelial migration into submucosa\n   Spatial Context: Close proximity to neutrophil clusters and macrophages,\n   forming \"inflammatory niches\"\n\nC. Lymphoid Organizing Fibroblasts (LOFs) / TLS-Associated\n   Location: Within or adjacent to Tertiary Lymphoid Structures\n   Markers: CCL19, CCL21, VCAM1, ICAM1, LYVE1\n   Role: Sustain B-cell and T-cell survival; chronic antigen presentation\n   drives persistent TGF-beta and IL-13, indirectly promoting fibroblast activation\n\n================================================================================\n2. KEY SIGNALING PATHWAYS DRIVING FISTULOGENESIS\n================================================================================\n\nA. TGF-beta1/SMAD (Central Driver)\n   TGF-beta1 overexpressed by macrophages, epithelial cells, and fibroblasts ->\n   activates SMAD2/3 -> upregulates ACTA2 (myofibroblast differentiation)\n   and ECM genes (COL1A1, FN1)\n\nB. IL-13/STAT6 (Th2-Driven Fibrosis)\n   IL-13 from ILC2s or Th2 cells activates STAT6 -> promotes M2 macrophage\n   activation and fibroblast proliferation -> particularly potent collagen\n   deposition and tissue contraction\n\nC. WNT/beta-Catenin (Epithelial-Mesenchymal Crosstalk)\n   WNT5A, WNT2 upregulated -> promotes epithelial survival, proliferation,\n   migration into submucosa -> facilitates epithelialization of fistula tract\n\nD. MMP/TIMP Balance (Tissue Remodeling)\n   MMP-8, MMP-9 (neutrophil-derived) + MMP-1, MMP-3 (fibroblast-derived)\n   degrade basement membrane and interstitial collagen -> creates pathways\n   for epithelial migration; excessive TIMP leads to net ECM accumulation\n\n================================================================================\n3. FIBROBLAST-IMMUNE CROSSTALK MECHANISMS\n================================================================================\n\nA. Neutrophil-Fibroblast Axis\n   Neutrophils release NETs (histones + proteases) -> activate fibroblasts\n   via TLR4 and ROS -> fibroblasts secrete CXCL8 (positive feedback) ->\n   chronic inflammation and tissue destruction creating fistula \"tunnel\"\n\nB. Macrophage-Fibroblast Crosstalk (M2 Polarization)\n   M2 macrophages (IL-4/IL-13-induced) secrete TGF-beta and PDGF ->\n   PDGF is potent mitogen driving fibroblast proliferation and\n   myofibroblast transition\n\nC. Epithelial-Fibroblast Crosstalk (EMT)\n   Inflamed epithelial cells secrete TGF-beta and WNTs -> fibroblasts\n   produce ECM and contractile proteins -> epithelial cells undergo\n   partial EMT gaining migratory properties -> epithelial cells line\n   the remodeled tract forming epithelialized fistula\n\n================================================================================\n4. SPATIAL CONTEXT\n================================================================================\n\nNiche-Specific Fibroblast Activation:\n- Perivascular: Source of CXCL12 recruiting immune cells\n- Submucosal: Primary targets for TGF-beta/PDGF, dense fibrosis\n- Mucosal: Depleted at ulceration, reactive at ulcer edge\n\nCellular Neighborhoods (expected):\n- Fibroblast-Neutrophil: CXCL1(fib) + CXCR2(neut), MMP9 interactions\n- Fibroblast-Macrophage: TGFB1(mac) -> TGFBR2(fib), PDGF(mac) -> PDGFRA(fib)\n- Fibroblast-Epithelial: WNT(epi) -> FZD(fib), TGFBR1(fib) -> TGFB1(epi)\n\nSpatial Gradient of Fibrosis:\n- Core of Fistula: Dense ACTA2+ myofibroblasts, low immune infiltration\n- Interface: High CXCL12+ inflammatory fibroblasts, high neutrophil/macrophage\n- Adjacent Healthy: Quiescent fibroblasts with low ACTA2 and COL1A1\n\n================================================================================\n5. MECHANISTIC MODEL OF FISTULA FORMATION\n================================================================================\n\n1. Initiation: Epithelial barrier breach -> neutrophil infiltration\n2. Amplification: Neutrophils/macrophages activate fibroblasts via TGF-beta,\n   PDGF, and ROS\n3. Remodeling: Myofibroblasts deposit ECM and contract tissue; MMPs degrade\n   basement membrane\n4. Epithelialization: Epithelial cells migrate into remodeled submucosa,\n   lining the tract\n5. Chronicity: Persistent inflammation prevents resolution\n\n================================================================================\n6. THERAPEUTIC TARGETS\n================================================================================\n\n- Anti-TGF-beta: Block myofibroblast differentiation\n- Anti-IL-13: Reduce Th2-driven fibrosis\n- MMP Inhibitors: Prevent excessive tissue degradation and epithelial migration\n- PDGF Receptor Inhibitors: Block fibroblast proliferation\n- Neutrophil Depletion/NET Inhibition: Break initial inflammatory loop\n\n================================================================================\nEND OF ANALYSIS\n================================================================================\n"}, "semantic": {"executive_summary_x": {"bullets": ["Catalogs 7 fibroblast subtypes with marker genes from scRNA-seq", "Lists ECM, inflammatory, developmental, and EMT pathway genes", "Describes paracrine (CXCL14, CCL2, PDGF) and matrix-mediated interactions", "Provides spatial transcriptomics gene detection across platforms", "Proposes biomarkers and therapeutic targets without mechanistic model"]}, "executive_summary_y": {"bullets": ["Focuses on 3 functionally defined fibroblast subtypes with spatial context", "Presents stepwise mechanistic model of fistula formation", "Emphasizes fibroblast-immune crosstalk (neutrophil, macrophage, epithelial axes)", "Describes spatial gradient from fistula core to healthy tissue", "Integrates TGF-beta, IL-13, WNT, and MMP/TIMP into coherent process"]}, "shared_points": [{"topic": "Myofibroblasts as contractile pro-fibrotic effectors", "x_text": "Myofibroblasts express ACTG2, MYH11, MYLK, TAGLN for tissue contraction and fibrosis", "y_text": "Pro-fibrotic myofibroblasts (ACTA2, TAGLN, COL1A1, FN1) deposit dense collagen driving fistula tract integrity"}, {"topic": "Inflammatory fibroblasts recruit immune cells via chemokines", "x_text": "Inflammatory stromal cells (CXCL14, F3, C3) recruit immune cells and activate complement", "y_text": "Inflammatory fibroblasts (CXCL12, CXCL14, IL6, IL1B) recruit neutrophils/monocytes forming inflammatory niches"}, {"topic": "MMP/TIMP balance in ECM remodeling", "x_text": "Lists MMP1, MMP2, MMP3, MMP9 and TIMP1, TIMP2, TIMP3 as key ECM remodeling components", "y_text": "MMP-1/3 (fibroblast) + MMP-8/9 (neutrophil) degrade basement membrane; excess TIMP causes net ECM accumulation"}, {"topic": "WNT pathway involvement in fibroblast coordination", "x_text": "WNT2, WNT5A, SFRP1, SFRP2 listed under developmental/signaling pathways", "y_text": "WNT5A/WNT2 promote epithelial survival, proliferation, and migration into submucosa for tract epithelialization"}, {"topic": "TGF-beta signaling drives fibrosis", "x_text": "TGFB1/2/3 and TGFBR1/2 and SMAD4 listed as key developmental pathway", "y_text": "TGF-beta1/SMAD2/3 is central driver upregulating ACTA2 and ECM genes for myofibroblast differentiation"}, {"topic": "PDGF/PDGFRA signaling in fibroblast activation", "x_text": "PDGFRA-PDGF axis: Stromal 2 responding to PDGF from other stromal cells", "y_text": "PDGF from M2 macrophages is potent mitogen driving fibroblast proliferation and myofibroblast transition"}, {"topic": "Complement system involvement", "x_text": "Complement components C3, C7, C1QA, C1QB expressed by fibroblast subtypes", "y_text": "Not explicitly a standalone pathway but innate immunity context acknowledged"}, {"topic": "EMT transcription factors in fibroblast biology", "x_text": "TWIST1, ZEB2, SOX9, SOX18, POSTN, PRRX1, GREM1 listed as EMT markers", "y_text": "Epithelial cells undergo partial EMT gaining migratory properties to line the remodeled fistula tract"}, {"topic": "Therapeutic targeting of fibrotic and inflammatory pathways", "x_text": "Anti-fibrotic (POSTN, SPP1, MMP9), anti-inflammatory (IL6, IL1B, CCL2), anti-angiogenic targets", "y_text": "Anti-TGF-beta, anti-IL-13, MMP inhibitors, PDGFR inhibitors, NET inhibition as targets"}, {"topic": "CCL2-mediated monocyte/macrophage recruitment", "x_text": "CCL2-CCR2 axis: pro-inflammatory fibroblasts recruiting monocytes/macrophages", "y_text": "Inflammatory fibroblasts recruit monocytes; M2 macrophages then secrete TGF-beta/PDGF back to fibroblasts"}], "unique_x": [{"topic": "Seven distinct fibroblast subtypes cataloged", "text": "Identifies 7 subtypes (Myofibroblasts, Stromal 1-3, Stromal 3(2), Stromal 3+4, Stromal 3 C7+) with cell counts and full marker panels from scRNA-seq"}, {"topic": "Spatial transcriptomics platform coverage statistics", "text": "Reports 56 fibroblast genes in Xenium 5100-plex and 73 in 480-plex, with specific cell counts per disease condition"}, {"topic": "CXCL14-CXCR4 autocrine/paracrine loop between stromal subtypes", "text": "Stromal 1 and Stromal 2 engage in CXCL14-CXCR4 autocrine/paracrine signaling as fibroblast-fibroblast interaction"}, {"topic": "Matrix-mediated fibroblast interactions via collagen cross-linking", "text": "COL4A1/COL6A3 coordinate ECM deposition; DCN/LUM organize glycosaminoglycan assembly between fibroblast subtypes"}, {"topic": "Glypican-mediated Wnt/FGF modulation", "text": "GPC6 modulates Wnt and FGF signaling as a matrix-mediated interaction mechanism between fibroblasts"}, {"topic": "Notch and Hedgehog pathway involvement", "text": "Lists NOTCH1/3, JAG1, DLL1/4 and SHH, PTCH1, SMO, GLI1 as developmental pathways in fistula fibroblasts"}, {"topic": "Coagulation pathway via tissue factor (F3)", "text": "F3 (tissue factor) expressed by fibroblasts links coagulation to inflammatory signaling"}, {"topic": "Anti-angiogenic therapeutic targets", "text": "Identifies ANGPTL4 and VEGF-related pathways as therapeutic targets for fistula treatment"}, {"topic": "Biomarker panels for fibrosis, inflammation, and EMT", "text": "Proposes distinct biomarker panels: fibrosis (POSTN, SPP1, COL4A1), inflammation (IL6, IL1B, CCL2), EMT (TWIST1, ZEB2, SOX9)"}], "unique_y": [{"topic": "Stepwise mechanistic model of fistula formation", "text": "Presents 5-stage process: initiation (barrier breach) -> amplification (immune activation) -> remodeling (ECM/MMP) -> epithelialization -> chronicity"}, {"topic": "Neutrophil-fibroblast axis via NETs and ROS", "text": "Neutrophils release NETs activating fibroblasts via TLR4/ROS; fibroblasts secrete CXCL8 creating positive feedback loop and physical fistula tunnel"}, {"topic": "IL-13/STAT6 Th2-driven fibrosis pathway", "text": "IL-13 from ILC2s/Th2 cells activates STAT6 promoting M2 macrophage polarization, fibroblast proliferation, and potent collagen deposition"}, {"topic": "Lymphoid organizing fibroblasts (LOFs) and tertiary lymphoid structures", "text": "CCL19/CCL21-expressing fibroblasts organize ectopic lymphoid structures, sustaining B/T cell survival and driving persistent fibroblast activation"}, {"topic": "Spatial gradient of fibrosis from fistula core to periphery", "text": "Core has dense ACTA2+ myofibroblasts with low immune cells; interface has CXCL12+ inflammatory fibroblasts with neutrophils/macrophages; adjacent tissue has quiescent fibroblasts"}, {"topic": "Niche-specific fibroblast activation by tissue layer", "text": "Perivascular fibroblasts source CXCL12; submucosal are TGF-beta/PDGF targets with dense fibrosis; mucosal are depleted at ulcers, reactive at edges"}, {"topic": "Epithelial-fibroblast crosstalk driving tract epithelialization", "text": "Bidirectional signaling: epithelial cells secrete TGF-beta/WNTs to fibroblasts; partial EMT gives epithelial cells migratory capacity to line the fistula tract"}, {"topic": "M2 macrophage-fibroblast crosstalk as amplification mechanism", "text": "IL-4/IL-13-induced M2 macrophages secrete TGF-beta and PDGF specifically driving fibroblast proliferation and myofibroblast transition"}, {"topic": "Fibroblast transition model (quiescent to activated to myofibroblast)", "text": "Resident fibroblasts transition to activated ECM-producing myofibroblasts via TGF-beta and IL-13, representing a functional state change rather than static subtypes"}]}, "neutral_summary": {"X": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n- Six functionally distinct fibroblast subtypes were identified across two spatial transcriptomics datasets (6,334,604 cells and 1,860,368 cells) from 40+ Crohn's disease patients.\n- IL11+ inflammatory fibroblasts dominate fistulising CD stroma (57.1% of stromal cells) vs only 4.4% in non-fistulising CD, with top markers MMP3 (log2FC=4.90), MMP1 (log2FC=4.68), COL7A1 (log2FC=3.83), CXCL5 (log2FC=3.51), and WNT5A (log2FC=2.98).\n- Fistulising stromal cells show coordinated upregulation: CXCL5 (3.44-fold), MME (3.56-fold), WNT5A (2.37-fold), MMP1 (2.08-fold), MMP3 (1.49-fold) vs non-fistulising stroma.\n- Homeostatic markers are lost in fistulising stroma: KIT (0.43x), MS4A2 (0.44x), ADAMDEC1 (0.56x), CXCL14 (0.62x).\n- Each fibroblast subtype shows strong spatial self-enrichment (15-28x above random), indicating organization into distinct functional niches rather than random distribution.\n- Cross-subtype spatial co-occurrence reveals IL11+ and Stromal 3+4 co-enrich 8.0x and Myofibroblasts co-occur with Stromal 3 C7+ at 10.7x enrichment.\n- Stromal 1 fibroblasts (CXCL14+, ADAMDEC1+, MFAP4+) are enriched in healthy tissue (20.3%) and non-fistulising CD (27.0%), suggesting a protective/homeostatic role.\n\nBiological Interpretation:\nFistula formation in Crohn's disease is driven by a dramatic compositional shift in the stromal compartment, from homeostatic fibroblasts to a dominant IL11+ inflammatory population. This expansion from 1.0% in healthy tissue to 57.1% in fistulising disease represents the most striking cellular change observed. IL11+ fibroblasts create a coordinated program of ECM degradation through MMP1 and MMP3, neutrophil recruitment via CXCL5, and non-canonical WNT signaling (WNT5A) that collectively enables tissue invasion and fistula tract extension. The simultaneous loss of homeostatic Stromal 1 fibroblasts, which normally express CXCL14 and MFAP4, removes an endogenous brake on pathological remodeling.\n\nThe spatial organization of fibroblast subtypes into distinct niches (15-28x self-enrichment) indicates that these populations are not randomly intermingled but form organized functional units. The co-occurrence of IL11+ fibroblasts with Stromal 3+4 lymphatic-associated fibroblasts (CCL19+/CCL21+) suggests cooperative signaling where tissue destruction by IL11+ cells is accompanied by lymphoid organizing activity that sustains adaptive immune responses. Similarly, myofibroblast co-occurrence with Stromal 3 C7+ cells implies coordinated fibrosis with perivascular remodeling.\n\nThe mechanistic progression involves initial inflammatory fibroblast expansion, followed by MMP-mediated ECM degradation creating tissue planes, chemokine-driven immune cell recruitment that amplifies inflammation, and concurrent loss of homeostatic stromal regulation. This model identifies IL11 receptor antagonism, MMP inhibition, and CXCL5/CXCR2 blockade as potential therapeutic strategies, while preservation of protective Stromal 1 populations represents an emerging concept in anti-fibrotic therapy for fistulising Crohn's disease.", "Y": "BIOLOGICAL FINDINGS SUMMARY\n\nKey Findings:\n- Seven distinct fibroblast/stromal subtypes identified from scRNA-seq reference (24,094 cells, 17,709 genes): Myofibroblasts (614 cells), Stromal 1 (1,000), Stromal 2 (1,000), Stromal 3(1) (1,000), Stromal 3(2) (775), Stromal 3+4 (1,000), Stromal 3 C7+ (1,000).\n- Spatial transcriptomics validated 56-73 fibroblast-associated genes across 1,860,368 cells (5100-plex) and 6,334,604 cells (480-plex), including MMPs, TIMPs, chemokines, and developmental pathway genes.\n- Disease distribution shows CD comprises 5,101,463 cells vs 615,102 healthy cells in the 480-plex dataset, with distinct fibroblast gene signatures across conditions.\n- Myofibroblasts express contractile markers (ACTG2, MYH11, MYLK, TAGLN, TPM2) associated with tissue contraction and fibrosis.\n- Inflammatory stromal cells (Stromal 1/2) express CXCL14, F3, C3, ADAMDEC1 driving immune recruitment and complement activation.\n- ECM-remodeling fibroblasts (Stromal 3 subtypes) express DCN, MGP, FBLN1, SERPINF1 for collagen organization.\n- Key signaling pathways active in fistula fibroblasts include TGF-beta (TGFB1/2/3, SMAD4), WNT (WNT2, WNT5A, SFRP1/2), Notch (NOTCH1/3, JAG1), Hedgehog (SHH), and PDGF (PDGFRA/B).\n- EMT transcription factors TWIST1, ZEB2, SOX9 and markers POSTN, PRRX1, GREM1 are upregulated in fistula tissue fibroblasts.\n\nBiological Interpretation:\nFibroblasts in Crohn's disease fistula tissue form a heterogeneous population with clear functional specialization. Myofibroblasts represent the contractile/fibrotic arm, driving tissue stiffening through ACTG2/MYH11-mediated contraction and ECM deposition. Their presence correlates with the dense fibrous walls characteristic of established fistula tracts. Inflammatory stromal fibroblasts (expressing CXCL14, C3, F3/tissue factor) serve as immune orchestrators, creating chemokine gradients for neutrophil and macrophage recruitment while simultaneously activating the complement and coagulation cascades that amplify local inflammation.\n\nThe ECM-remodeling fibroblast subtypes operate through coordinated matrix turnover -- MMP1/2/3/9 degrade existing matrix while DCN, LUM, and OGN organize new matrix deposition. This dual destruction-construction program reshapes tissue architecture to form the physical fistula tract. The balance between MMPs and their inhibitors (TIMP1/2/3) determines whether net degradation or deposition predominates at any given tissue location. Paracrine signaling networks between subtypes, including the CXCL14-CXCR4 axis and PDGFRA-PDGF axis, ensure coordinated behavior across the heterogeneous fibroblast population.\n\nDevelopmental pathway reactivation (TGF-beta, WNT, Notch, Hedgehog) in fistula fibroblasts drives EMT-like programs marked by TWIST1, ZEB2, and PRRX1 upregulation. These transcription factors promote fibroblast migration, invasion, and mesenchymal plasticity -- enabling tissue penetration and tract extension. GREM1-mediated BMP antagonism maintains fibroblasts in an activated, proliferative state resistant to quiescence signals. Together, these pathways create a self-sustaining fibrotic-inflammatory microenvironment that perpetuates fistula growth and resists healing."}}, {"id": "Q3", "type": "comparison", "text": "What do the TWIST1 overexpressed fibroblasts in the gut do? What biological processes happen?", "responses": {"X": "================================================================================\nWHAT DO TWIST1-OVEREXPRESSED FIBROBLASTS IN THE GUT DO?\n================================================================================\n\nEXECUTIVE SUMMARY\n=================\nTWIST1-overexpressing fibroblasts represent a rare (~12% of gut fibroblasts)\nbut functionally distinct subset that drives extracellular matrix reorganization,\ninflammation, and tissue remodeling in Crohn's disease fistula formation. These\ncells exhibit a myofibroblast-like transcriptional program with enhanced migratory\nand pro-fibrotic capabilities.\n\n================================================================================\n1. TWIST1 EXPRESSION PATTERNS\n================================================================================\n\nIn scRNA-seq Reference (24,094 cells):\n- TWIST1 detected in: 1,541/24,094 cells (6.4%)\n- Mean expression: 0.107 | Max: 4.45\n\nIn Xenium 5100-plex Spatial Data (1,860,368 cells):\n- TWIST1+ cells: 12,769/1,860,368 (0.7%)\n- Mean expression: 0.009 | Max: 11\n\nSpatial Distribution by Disease State:\n| Condition | Mean TWIST1 | % TWIST1+ Cells |\n|-----------|-------------|-----------------|\n| FISTULA   | 0.025       | 1.8%            |\n| ULCER     | 0.005       | 0.5%            |\n| HC        | 0.002       | 0.2%            |\n\nKEY FINDING: TWIST1 expression is 9-fold higher in FISTULA samples compared\nto healthy controls, specifically enriched in fistulizing Crohn's disease.\n\n================================================================================\n2. TWIST1-HIGH FIBROBLAST IDENTIFICATION\n================================================================================\n\nTotal fibroblast cells analyzed: 6,389 (across 7 fibroblast/stromal clusters)\nTWIST1-high fibroblasts: 759 cells (11.9% of fibroblasts)\nTWIST1-low fibroblasts: 5,630 cells (88.1%)\n\nTWIST1-high cells are distributed across multiple stromal clusters, suggesting\nTWIST1 marks a functional state rather than a distinct lineage.\n\n================================================================================\n3. MOLECULAR SIGNATURE: TWIST1-HIGH vs TWIST1-LOW\n================================================================================\n\nTop Upregulated Genes:\n\n| Gene | log2FC | p-val Adj | Description |\n|------|--------|-----------|-------------|\n| TWIST1 | 12.97 | 0 | Master regulator |\n| CPXM1 | 1.77 | 1.2e-59 | Collagen processing |\n| COL1A1 | 1.67 | 5.4e-64 | Collagen type I alpha 1 |\n| SERPINE1 | 1.44 | 1.4e-58 | PAI-1, ECM inhibitor |\n| VIM | 0.68 | 1.4e-58 | Vimentin, cytoskeleton |\n| ABL2 | 1.37 | 1.1e-57 | Non-receptor tyrosine kinase |\n| CTHRC1 | 1.94 | 2.0e-49 | Collagen trafficking |\n| FAP | 1.77 | 2.5e-49 | Fibroblast activation protein |\n| PTGDS | 1.04 | 1.2e-46 | Prostaglandin D synthase |\n| APOE | 1.06 | 1.6e-43 | Lipid metabolism |\n| THBS2 | 1.30 | 8.6e-41 | Thrombospondin-2 |\n| BGN | 1.28 | 1.0e-39 | Biglycan, proteoglycan |\n| CXCL2 | 1.06 | 7.3e-37 | Chemokine, inflammation |\n| COL3A1 | 1.34 | 5.0e-36 | Collagen type III |\n| FOSL1 | 0.98 | 4.8e-35 | AP-1 transcription factor |\n| THY1 | 1.00 | 1.8e-34 | Cell surface glycoprotein |\n| PDPN | 0.89 | 3.0e-32 | Podoplanin |\n| SPHK1 | 1.10 | 4.1e-32 | Sphingosine kinase |\n| MDK | 1.11 | 7.9e-32 | Midkine, growth factor |\n| ADAM12 | 1.93 | 1.6e-31 | Metalloprotease |\n| IGFBP2 | 2.63 | 2.1e-30 | IGF binding protein 2 |\n| IGF1 | 1.25 | 2.8e-30 | Insulin-like growth factor 1 |\n\n================================================================================\n4. PATHWAY ENRICHMENT\n================================================================================\n\n| Pathway | Genes Enriched | Fold Enrichment | p-value |\n|---------|---------------|-----------------|---------|\n| ECM Organization | 17 | 2.72x | 1.7e-5 |\n| Inflammation | 17 | 2.39x | 2.0e-4 |\n| TGF-beta Signaling | 16 | 1.95x | 6.5e-3 |\n| Cell Migration | 13 | 1.80x | 3.2e-2 |\n| Angiogenesis | 9 | 1.99x | 3.6e-2 |\n| Metabolism | 16 | 1.95x | 6.5e-3 |\n\n================================================================================\n5. FUNCTIONAL INTERPRETATION\n================================================================================\n\n1. ECM Deposition and Remodeling\n   - COL1A1, COL1A2, COL3A1, COL14A1 drive collagen deposition\n   - CPXM1, PCOLCE facilitate collagen cross-linking and maturation\n   - CTHRC1 promotes collagen trafficking to cell surface\n   - Creates fibrotic microenvironment characteristic of fistula formation\n\n2. Pro-Inflammatory Signaling\n   - CXCL2 and chemokines recruit neutrophils and immune cells\n   - Sustained NF-kB signaling maintains inflammatory tone\n   - Creates self-reinforcing inflammatory loop driving tissue damage\n\n3. Enhanced Cell Motility and Invasion\n   - VIM upregulation provides cytoskeletal flexibility\n   - FAP enables ECM degradation\n   - PTK2/FAK signaling promotes cell migration\n   - Enables fibroblasts to invade surrounding tissues\n\n4. Growth Factor Signaling\n   - IGF1 and IGFBP2 promote cell survival and proliferation\n   - MDK (midkine) is a developmentally regulated growth factor\n   - SPHK1 produces sphingosine-1-phosphate, a pro-survival lipid mediator\n\n5. Stemness/EMT Program\n   - TWIST1, SNAI1/2, ZEB1/2 form core EMT transcriptional network\n   - Confers plasticity and resistance to apoptosis\n   - Enables adaptation to changing microenvironmental cues\n\n================================================================================\n6. CLINICAL IMPLICATIONS\n================================================================================\n\nTherapeutic Targets:\n1. Fibrosis reversal: Targeting COL1A1/COL3A1 or TGF-beta signaling\n2. Anti-inflammatory: Blocking CXCL2 or NF-kB\n3. Anti-migratory: Inhibiting FAK/PTK2 or MMP activity\n4. Direct TWIST1 Inhibition: Reverse the entire pro-fibrotic program\n\nBiomarker Potential:\n- TWIST1 expression could serve as biomarker for fistulizing disease\n- TWIST1-high signature (COL1A1, SERPINE1, CXCL2, FAP) could:\n  - Stratify patients by fistula risk\n  - Monitor response to anti-fibrotic therapy\n  - Guide treatment decisions\n\n================================================================================\n7. KEY STATISTICS\n================================================================================\n\n- TWIST1-high fibroblasts: 759/6,389 (11.9%)\n- DEGs identified: 2,040 (p-val adj < 0.05, logFC > 0.1)\n- Upregulated genes (logFC > 0.3): 2,169\n- Most significant pathway: ECM Organization (p = 1.7e-5)\n\n================================================================================\nCONCLUSION\n================================================================================\n\nTWIST1-overexpressing fibroblasts represent a pro-fibrotic, pro-inflammatory\nsubset characterized by:\n1. Enhanced ECM production (collagens, fibronectin, proteoglycans)\n2. Active inflammation (chemokines, NF-kB signaling)\n3. Increased motility (cytoskeletal reorganization, MMPs)\n4. Growth factor signaling (IGF, midkine, sphingosine-1-phosphate)\n5. EMT/stemness program (TWIST, SNAI, ZEB transcription factors)\n\nThese cells are specifically enriched in fistulizing Crohn's disease (9-fold\nhigher TWIST1 vs healthy) and represent a promising therapeutic target.\n\n================================================================================\nEND OF ANALYSIS\n================================================================================\n", "Y": "================================================================================\nWHAT DO TWIST1-OVEREXPRESSED FIBROBLASTS IN THE GUT DO?\nA Spatial Transcriptomics Analysis of Crohn's Disease Fistula Formation\n================================================================================\n\nEXECUTIVE SUMMARY\n=================\nTWIST1-overexpressing fibroblasts (collectively termed \"IL11+\" in annotations)\nrepresent a specialized pro-inflammatory, pro-fibrotic, and pro-angiogenic\nstromal subpopulation strongly enriched in fistulising Crohn's disease:\n\n1. Matrix metalloproteinase overexpression - MMP1, MMP3, MMP9, MMP14\n   enabling tissue remodeling and barrier disruption\n2. Potent chemokine production - CXCL1, CXCL2, CXCL5, CXCL6, CXCL8, CXCL13\n   driving myeloid and lymphoid cell recruitment\n3. IL-6 family cytokine signaling - IL6, IL11, LIF, CSF3, IL24 creating\n   sustained inflammatory loop\n4. Pro-angiogenic signaling - WNT5A, ANGPTL4, VEGF-related pathways\n5. ECM deposition and cross-linking - COL7A1, POSTN, FAP, SERPINE1\n\nThese cells are predominantly found in FISTULA conditions (64% of IL11+ cells),\ncolonic tissue (37%), and ileal tissue (63%).\n\n================================================================================\n1. TWIST1 EXPRESSION PATTERN\n================================================================================\n\n5100-plex dataset TWIST1 expression by cell type:\n\n| Cell Type (Level 3)       | Mean TWIST1 | % Expressing | Cell Count |\n|---------------------------|-------------|--------------|------------|\n| IL11+                     | 0.487       | 12.3%        | 51,763     |\n| Stromal 3 + 4             | 0.144       | 3.6%         | 24,797     |\n| Pericytes                 | 0.055       | 1.4%         | 37,872     |\n| Stromal 3 (1)             | 0.050       | 1.2%         | 55,616     |\n| Stromal 3 (2)             | 0.043       | 1.0%         | 23,713     |\n| Stromal 2                 | 0.037       | 0.9%         | 38,173     |\n| Stromal 3 C7+             | 0.036       | 0.8%         | 43,639     |\n| Stromal 1                 | 0.029       | 0.7%         | 68,695     |\n| Myofibroblasts            | 0.024       | 0.6%         | 116,539    |\n\nKEY FINDING: IL11+ population shows ~10-fold higher TWIST1 expression than\nother stromal populations. In 480-plex: IL11+ mean = 1.027, 22.2% expressing,\n359,722 cells identified.\n\nTWIST1-High Fibroblast Definition (75th percentile threshold):\n- TWIST1-High: 3,616 cells (0.97% of fibroblasts)\n- TWIST1-Low: 367,556 cells (99.03%)\n\n================================================================================\n2. MOLECULAR CHARACTERIZATION: IL11+ vs OTHER STROMAL CELLS\n================================================================================\n\nTop Upregulated Genes (Wilcoxon rank-sum, FDR<0.05, log2FC>0.5):\n\n| Gene    | log2FC  | IL11+ % | Other % | Function                          |\n|---------|---------|---------|---------|-----------------------------------|\n| IL24    | +5.99   | 11.2%   | 0.2%    | Pro-inflammatory cytokine         |\n| MMP1    | +5.72   | 41.3%   | 1.9%    | Collagenase, ECM degradation      |\n| MMP3    | +5.23   | 20.9%   | 1.2%    | Stromelysin, matrix remodeling    |\n| CSF3    | +4.76   | 8.8%    | 0.3%    | G-CSF                             |\n| MMP9    | +4.52   | 10.1%   | 0.4%    | Gelatinase B                      |\n| IL11    | +4.54   | 12.4%   | 0.5%    | IL-6 family, fibrosis driver      |\n| CXCL5   | +4.05   | -       | -       | Neutrophil chemoattractant        |\n| CA12    | +4.21   | 41.6%   | 2.7%    | Carbonic anhydrase                |\n| TWIST1  | +3.37   | 12.3%   | 1.0%    | EMT transcription factor          |\n| FAP     | +3.26   | 12.7%   | 1.0%    | Fibroblast activation protein     |\n| LIF     | +3.17   | 9.1%    | 0.9%    | IL-6 family                       |\n| IL6     | +3.54   | 11.7%   | 0.8%    | Master inflammatory cytokine      |\n| CTHRC1  | +2.60   | 20.8%   | 2.9%    | Collagen trafficking              |\n| ADAM12  | +2.64   | 19.3%   | 2.2%    | Shedding enzyme                   |\n| POSTN   | +2.26   | 38.7%   | 8.8%    | Periostin, ECM remodeling         |\n| WNT5A   | +2.33   | 24.6%   | 4.9%    | Non-canonical WNT                 |\n| TWIST2  | +2.92   | 18.5%   | 2.5%    | EMT transcription factor          |\n| MMP14   | +1.62   | 59.4%   | 26.8%   | MT1-MMP                           |\n| MMP2    | +0.98   | 74.9%   | 54.4%   | Gelatinase A                      |\n\nPathway Enrichment (fgsea, MSigDB Hallmark):\n\n| Pathway                              | NES   | p-value |\n|--------------------------------------|-------|---------|\n| HALLMARK_COAGULATION                 | +1.76 | 0.083   |\n| HALLMARK_EPITHELIAL_MESENCHYMAL_TRANS| +1.67 | 0.159   |\n| HALLMARK_INFLAMMATORY_RESPONSE       | +1.52 | 0.076   |\n| HALLMARK_ANGIOGENESIS                | +1.41 | 0.092   |\n\n================================================================================\n3. DISEASE STATE AND SPATIAL DISTRIBUTION\n================================================================================\n\nIL11+ cells by disease condition:\n\n| Condition    | IL11+ Cell Count | Percentage |\n|-------------|------------------|------------|\n| FISTULA      | 33,399           | 64.5%      |\n| ULCER        | 18,005           | 34.8%      |\n| HC (healthy) | 359              | 0.7%       |\n\nTissue Distribution:\n\n| Location | IL11+ Cell Count | Percentage |\n|----------|------------------|------------|\n| ILEUM    | 32,531           | 62.8%      |\n| COLON    | 19,232           | 37.2%      |\n\nConsistent across both 5100-plex and 480-plex datasets.\nDistributed across 15 patients (not single-specimen artifact).\n\n================================================================================\n4. FUNCTIONAL INTERPRETATION\n================================================================================\n\n4.1 Matrix Remodeling and Tissue Destruction\n- MMP1, MMP3, MMP9, MMP14 coordinated upregulation enables:\n  - Basement membrane degradation (MMP9, MMP14)\n  - Collagen turnover creating space for infiltration (MMP1)\n  - Protease cascade activation amplifying proteolytic signal (MMP3)\n\n4.2 Inflammation Amplification\n- IL-6 family (IL6, IL11, LIF) activates STAT3, perpetuating inflammation\n- Chemokines (CXCL1/2/5/6/8) recruit neutrophils and myeloid cells\n- CSF3 promotes neutrophil production and survival\n\n4.3 Angiogenesis and Vascular Remodeling\n- WNT5A: Non-canonical WNT activation in endothelial cells\n- ANGPTL4: Vascular permeability and lymphangiogenesis regulation\n- CXCL12: Endothelial progenitor cell recruitment\n\n4.4 Pro-fibrotic Signaling (Paradoxical with MMP profile)\n- POSTN: Activates TGF-beta, promotes myofibroblast differentiation\n- FAP: Modulates ECM composition, fibrogenic signaling\n- SERPINE1: PAI-1 reduces ECM degradation, promotes fibrosis\n- Creates dual pro-degradative and pro-fibrotic state explaining\n  complex fistula tract architecture\n\n4.5 EMT and Epithelial Interaction\n- TWIST1, TWIST2, SNAI2 upregulation\n- May induce EMT in neighboring epithelial cells\n- Creates permissive microenvironment for epithelial-stromal interactions\n\n================================================================================\n5. COMPARISON WITH OTHER FIBROBLAST SUBPOPULATIONS\n================================================================================\n\n- Traditional myofibroblasts (116,539 cells): mean TWIST1 = 0.024 vs 0.487\n  in IL11+; lack potent chemokine signature; more contractile (ACTA2, TAGLN)\n- Stromal 3+4 (24,797 cells): second-highest TWIST1 (0.144); share some\n  characteristics; suggests continuum of fibroblast activation states\n- IL11+ represents the most extreme activation end of this continuum\n\n================================================================================\n6. CLINICAL IMPLICATIONS\n================================================================================\n\nTherapeutic Targets:\n1. IL-11 signaling blockade (IL11 is master regulator of this program)\n2. IL-6 receptor antagonism (tocilizumab)\n3. MMP inhibitors (reduce tissue destruction)\n4. CXCR2 antagonism (block neutrophil recruitment)\n5. TWIST1 pathway modulation\n\nBiomarker Potential:\n- Diagnostic marker for fistulising disease risk\n- Predictive biomarker for anti-inflammatory therapy response\n- Monitoring tool for disease activity\n\n================================================================================\nEND OF ANALYSIS\n================================================================================\n"}, "semantic": {"executive_summary_x": {"bullets": ["TWIST1-high fibroblasts are rare (~12%) but 9-fold enriched in fistula tissue", "They drive ECM deposition, inflammation, migration, and EMT programs", "Key signature: COL1A1, SERPINE1, FAP, CTHRC1, IGF1, VIM", "Pathway enrichment strongest for ECM organization and inflammation", "Proposes TWIST1 as biomarker and direct therapeutic target for fistulizing CD"]}, "executive_summary_y": {"bullets": ["TWIST1-high cells map to IL11+ annotation with 10-fold enrichment over other stroma", "Dominant MMP overexpression (MMP1/3/9/14) drives tissue destruction and barrier disruption", "Potent chemokine factory (CXCL1/2/5/6/8/13) and IL-6 family cytokine hub", "Pro-angiogenic via WNT5A and ANGPTL4; paradoxical dual degradative and fibrotic state", "IL11 signaling blockade proposed as master regulator therapeutic target"]}, "sh
